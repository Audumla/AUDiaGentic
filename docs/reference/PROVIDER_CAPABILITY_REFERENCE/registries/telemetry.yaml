schema_version: 1
provenance_states:
- official-api
- response-header
- response-body
- harness-event
- local-runtime
- scrape
- estimate
- unavailable
- not-applicable
scopes:
- account
- organization
- project
- workspace
- api-key
- provider-instance
- model
- session
- request
- runtime
categories:
  balance:
    meaning: Account or key-denominated monetary allowance.
  aggregate_usage:
    meaning: Historical consumption over a time range.
  request_usage:
    meaning: Tokens, cost and resources associated with one request.
  quota:
    meaning: Configured or provider-enforced request/token/spend ceiling.
  rate_limit:
    meaning: Short-window capacity and reset state.
  context:
    meaning: Model/session context capacity and consumption; usually derived.
  runtime:
    meaning: Local engine capacity such as VRAM, KV cache and queue depth.
queries:
- get_provider_balance
- get_provider_quota
- get_provider_usage
- get_session_telemetry
- get_runtime_telemetry
