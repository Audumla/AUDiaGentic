# Fixture: Hindsight command integration
recipe-id: hindsight-codex-integration
recipe-version: "1.0.0"
description: Install Hindsight integration for Codex
parameters:
  - name: URL
    required: true
  - name: TOKEN
    required: false
    default: ""
    sensitive: true
  - name: BANK_ID
    required: false
lifecycle:
  probe:
    type: command
    command:
      - codex
      - --version
    expect-exit: 0
  install-steps:
    - type: shell
      id: install-hindsight
      command:
        - python
        - -c
        - "print('{URL}', '{TOKEN}')"
      timeout: 60
  uninstall-steps:
    - type: shell
      id: remove-hindsight
      command:
        - python
        - -c
        - print(remove)
