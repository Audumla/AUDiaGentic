type: component
contract-version: v1
core: true
scope: harness
id: session
display-name: Session
description: Harness status and configuration
mcp-servers:
  - name: ag-session-mgmt
    module: audiagentic.components.session.session_mcp
    args: ["--readonly", "--smoke-only"]
    direct-tools: [status, config, set_auto_update, cli_visibility, set_cli_visibility, refresh_harness_config, update_rig]
    description: Harness status and configuration
    propagate: audiagentic
    instructions: >
      AUDiaGentic session server.
      Exposes harness info/config plus CLI visibility controls.
    tool-descriptions:
      status: Show current AUDiaGentic harness status including versions, model, endpoint, auto-update, and environment info.
      config: Show current AUDiaGentic harness configuration including ag.yaml settings and generated agent model config.
      set_auto_update: Enable or disable auto-update checks at launch.
      cli_visibility: Show current CLI visibility settings for thinking blocks and tool or MCP blocks.
      set_cli_visibility: Set CLI visibility for thinking blocks and tool or MCP blocks, then request an in-session reload.
      refresh_harness_config: Regenerate mcp.json and SYSTEM.md from current component state, then request in-session reload.
      update_rig: Update llama.cpp rig binaries. Use scope='local' to update the active local/project-preferred rig and restart if needed, or scope='global' to update the shared global harness rig binaries.
harness-instructions:
  - section: "What you can do"
    content: |
       ### Session
       - `status` — Check harness status and configuration
       - `config` — Show harness configuration
       - `set_auto_update` — Enable or disable auto-update
       - `cli_visibility` — Show whether thinking/tool blocks are visible
       - `set_cli_visibility` — Show or hide thinking/tool blocks in the CLI
       - `refresh_harness_config` — Regenerate mcp.json/SYSTEM.md from current component state after install/uninstall
       - `update_rig` — Update llama.cpp rig binaries for "local" or "global" scope
