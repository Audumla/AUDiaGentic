type: component
contract-version: v1
id: memory
display-name: Memory
description: >
  Persistent memory capability — back agent sessions with swappable memory
  implementations. Memory core owns backend config/state only; backend-specific
  provider integration is contained in the active implementation package. Only
  one implementation is active at a time.
implementation-cardinality: exclusive
status-hook: audiagentic.components.memory.memory_api.memory_status
lifecycle-observer: audiagentic.components.memory.memory_observer

mcp-servers:
  - name: ag-memory-mgmt
    module: audiagentic.components.memory.memory_mcp
    direct-tools:
      - memory_status
      - memory_list_implementations
      - memory_select_implementation
      - memory_get_config
      - memory_set_config
    description: Memory component management — status, implementation selection, and config
    propagate: audiagentic
    instructions: >
      Inspect, switch, and configure the active memory implementation. Implementations
      are exclusive (selecting one disables the others); config changes return a
      provider recipe refresh hint that providers may act on.
    tool-descriptions:
      memory_status: >
        Return memory component status: active implementation and configured state.
      memory_list_implementations: >
        List available memory implementations with active/default flags and summary.
      memory_select_implementation: >
        Switch the active memory implementation. With implementation-cardinality exclusive,
        enabling one disables all others. Returns updated status and a neutral
        provider recipe refresh hint when applicable.
      memory_get_config: >
        Return resolved config for the active implementation, or for a specific
        implementation_id if provided.
      memory_set_config: >
        Validate and persist config updates for an implementation. Returns updated
        config, status, and a neutral provider recipe refresh hint.

contributions:
  - id: memory/process
    owner: memory
    title: Memory component
    preferred-targets:
      - skill
      - instruction
    content:
      body: |
        Memory is backed by a swappable backend. Use the ag-memory-mgmt MCP tools
        to check status, switch implementations, and configure the active backend.
        - `memory_status` — Active implementation and configuration state
        - `memory_select_implementation` — Switch memory backend
        - `memory_get_config` / `memory_set_config` — Read and update backend config
        - When memory is configured, the active backend's tools are available for
          long-term memory operations (recall, reflect, retain).

  - id: hindsight/memory-usage
    owner: memory
    title: Memory usage guidance
    preferred-targets:
      - instruction
    content:
      body: |
        Use Hindsight memory when prior project context may help.
        - Recall before design/history questions or non-trivial work.
        - Retain durable decisions, user preferences, architecture constraints, and outcomes.
        - Do not retain secrets, credentials, or transient noise.

# v1 decision: no ag-memory activity server. Memory persists backend config only.
# Backend-specific projection/reconcile is owned by the active implementation
# package and uses generic provider seams. An activity server (e.g.
# retain/recall/reflect) would require a runtime client per implementation and is
# deferred to a future stage once the config/provider recipe contract is stable.
