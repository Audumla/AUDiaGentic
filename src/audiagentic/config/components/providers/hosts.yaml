# Host descriptors — editor/IDE hosts that providers integrate with (AR09).
# Adding a host here (plus any provider host_capabilities entries naming it)
# is all that is needed; no Python paths are hardcoded for hosts.
type: provider-hosts
hosts:
  vscode:
    display-name: "Visual Studio Code"
    workspace-marker: ".vscode"
    extensions-manifest: ".vscode/extensions.json"
    extensions-dir: "~/.vscode/extensions"
