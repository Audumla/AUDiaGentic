type: component
contract-version: v1
id: providers
display-name: Providers
description: External provider CLI integration, project surfaces, and provider model catalogs
implementation-cardinality: multi
post-install: audiagentic.components.providers.services.reconcile.reconcile_all
lifecycle-observer: audiagentic.components.providers.surfaces.observer
files:
  - path: .audiagentic/config/runtime/providers.yaml
    lifecycle: create-if-missing
    description: Provider configuration — models, access mode, execution policy
  - path: .audiagentic/runtime/providers
    lifecycle: runtime-only
    recursive: true
    description: Runtime provider catalogs and session state
mcp-servers:
  - name: ag-providers-mgmt
    module: audiagentic.components.providers.providers_mcp
    direct-tools:
      - get_reconciliation_policy
      - set_reconciliation_policy
      - list_providers
      - get_provider_status
      - list_provider_descriptors
      - list_provider_models
      - refresh_provider_catalog
      - refresh_all_catalogs
      - manage_cli_lifecycle
      - operate_provider_surface
      - operate_provider_surfaces
      - model_source_list
      - list_model_inventory
      - refresh_model_source_catalog
      - model_vendor_set_enabled
      - apply_model_sources
      - model_source_add
      - model_source_update
      - model_source_remove
      - model_source_set_enabled
      - describe_provider
    description: Providers MCP server for provider management and introspection
    propagate: audiagentic
    instructions: >
      AUDiaGentic providers component server.
      Use list_providers to see all providers and their status.
      Use get_provider_status to inspect a specific provider runtime catalog.
    tool-descriptions:
      get_reconciliation_policy: Return this project's provider reconciliation policy (mode auto/allowlist/prompt, plus allowed/decided provider lists).
      set_reconciliation_policy: Set this project's provider reconciliation policy, controlling which detected provider CLIs get auto-enabled on launch.
      list_providers: List all known providers and their configuration or catalog status.
      get_provider_status: Return detailed status for a specific provider including catalog contents.
      list_provider_descriptors: List all registered provider descriptors and static metadata.
      list_provider_models: List model IDs from a provider runtime catalog.
      refresh_provider_catalog: Fetch and persist live model catalog for a provider.
      refresh_all_catalogs: Fetch and persist model catalogs for all providers that support it.
      manage_cli_lifecycle: Apply, prune, plan, or inspect one provider CLI lifecycle through the typed provider family contract.
      operate_provider_surface: Apply, prune, plan, or inspect generated surface contributions for one provider and ownership scope.
      operate_provider_surfaces: Apply, prune, plan, or inspect generated surface contributions for one or all active providers.
      model_source_list: List declared model sources (local endpoints and remote accounts) from model-sources.yaml.
      list_model_inventory: Show AUDiaGentic model sources, vendor groups, their models, and compatible harness paths without network access.
      refresh_model_source_catalog: Explicitly refresh one configured vendor or endpoint source catalog.
      model_vendor_set_enabled: Enable or disable all configured sources for one vendor group as desired state; call apply_model_sources separately to project it.
      apply_model_sources: Apply enabled AUDiaGentic model sources across every enabled harness with a verified model projection handler.
      model_source_add: Add a validated model source desired-state declaration without mutating provider files.
      model_source_update: Update a validated model source desired-state declaration without mutating provider files.
      model_source_remove: Remove a model source desired-state declaration; use model projection separately to prune owned provider entries.
      model_source_set_enabled: Enable or disable a model source without deleting its configuration.
      describe_provider: Deep read-only interrogation of one provider - descriptor, status, execution support, model catalog and managed config, config surfaces, and ownership registries. For execution profiles use agent_list_execution_profiles.
