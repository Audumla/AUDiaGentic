type: component
contract-version: v1
id: providers
display-name: Providers
description: External provider CLI integration, project surfaces, and provider model catalogs
implementation-cardinality: multi
post-install: audiagentic.components.providers.services.lifecycle.reconcile_all
lifecycle-observer: audiagentic.components.providers.surfaces.observer
files:
  - path: .audiagentic/config/runtime/providers.yaml
    lifecycle: create-if-missing
    description: Provider configuration — models, access mode, execution policy
  - path: .audiagentic/runtime/providers
    lifecycle: runtime-only
    recursive: true
    description: Runtime provider catalogs and session state
mcp-servers:
  - name: ag-providers-mgmt
    module: audiagentic.components.providers.providers_mcp
    direct-tools: true
    description: Providers MCP server for provider management and introspection
    propagate: audiagentic
    instructions: >
      AUDiaGentic providers component server.
      Use list_providers to see all providers and their status.
      Use get_provider_status to inspect a specific provider runtime catalog.
    tool-descriptions:
      list_providers: List all known providers and their configuration or catalog status.
      get_provider_status: Return detailed status for a specific provider including catalog contents.
      list_provider_descriptors: List all registered provider descriptors and static metadata.
      list_provider_models: List model IDs from a provider runtime catalog.
      refresh_provider_catalog: Fetch and persist live model catalog for a provider.
      refresh_all_catalogs: Fetch and persist model catalogs for all providers that support it.
      install_provider: Install a provider CLI. For explicit install requests, call with dry_run=false unless the user specifically asks for a dry run.
      uninstall_provider: Uninstall a provider CLI. For explicit uninstall requests, call with dry_run=false after confirmation.
      repair_provider: Repair a provider CLI by installing it if missing. For explicit repair requests, call with dry_run=false unless the user specifically asks for a dry run.
      apply_provider_surfaces: Apply managed provider surface blocks to agent files.
      prune_provider_surfaces: Remove stale managed provider surface blocks from agent files.
      reconcile_provider: Reconcile a single provider against host state and sync config or surfaces.
      reconcile_all_providers: Reconcile all registered providers against host state.
harness-instructions:
  - section: "What you can do"
    content: |
      ### ag-providers-mgmt
      - `mcp_list_providers` — List all known providers
      - `mcp_get_provider_status` — Check a specific provider status
      - `mcp_list_provider_models` — List models from a provider's catalog
      - `mcp_install_provider` — Install a provider CLI when explicitly requested; do not dry-run unless requested
      - `mcp_uninstall_provider` — Uninstall a provider CLI after user confirmation; do not dry-run unless requested
      - `mcp_repair_provider` — Repair a provider CLI when explicitly requested; do not dry-run unless requested

