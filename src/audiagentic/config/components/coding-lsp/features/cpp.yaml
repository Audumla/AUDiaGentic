type: feature
contract-version: v1
parent: coding-lsp
kind: language
id: cpp
display-name: C/C++ (clangd)
language-id: cpp
server:
  command: [clangd]
  file-extensions: [.c, .cpp, .cc, .cxx, .h, .hpp, .hxx]
  workspace-config-files: [.clangd, compile_commands.json, CMakeLists.txt]
detection-markers: [.clangd, compile_commands.json, CMakeLists.txt]
dependencies:
  clangd:
    display-name: Clangd (C/C++ LSP)
    probe: binary:clangd
    via:
      winget: LLVM.LLVM
      scoop: clangd
      choco: llvm
      brew: clangd
      apt: clangd
      dnf: clangd
      pacman: clangd
pre-commit-hooks:
  check:
    - clang-format,--dry-run,--Werror
  format:
    - clang-format,-i
options-schema:
  server-settings:
    type: object
    default: {}
