type: feature
contract-version: v1
parent: coding-lsp
kind: language
id: markdown
display-name: Markdown (marksman)
language-id: markdown
server:
  command: [marksman, server]
  file-extensions: [.md, .markdown]
  workspace-config-files: [.marksman.toml]
detection-markers: []
dependencies:
  marksman:
    display-name: Marksman (Markdown LSP)
    probe: binary:marksman
    via:
      winget: Artempyanykh.Marksman
      scoop: marksman
      brew: marksman
    platform-fallback:
      win: [powershell, -NoProfile, -ExecutionPolicy, Bypass, -Command, "mkdir -Force (Join-Path $HOME .local/bin) | Out-Null; iwr -useb https://github.com/artempyanykh/marksman/releases/latest/download/marksman-windows.exe -o (Join-Path $HOME .local/bin/marksman.exe)"]
      darwin: [sh, -c, "curl -fsSL https://github.com/artempyanykh/marksman/releases/latest/download/marksman-macos -o $HOME/.local/bin/marksman && chmod +x $HOME/.local/bin/marksman"]
      linux: [sh, -c, "curl -fsSL https://github.com/artempyanykh/marksman/releases/latest/download/marksman-linux -o $HOME/.local/bin/marksman && chmod +x $HOME/.local/bin/marksman"]
options-schema:
  server-settings:
    type: object
    default: {}
