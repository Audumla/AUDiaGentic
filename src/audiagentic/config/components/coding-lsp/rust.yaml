type: feature
contract-version: v1
parent: coding-lsp
kind: language
id: rust
display-name: Rust (rust-analyzer)
language-id: rust
server:
  command: [rust-analyzer]
  file-extensions: [.rs]
  workspace-config-files: [Cargo.toml, Cargo.lock]
  init-wait: 5
detection-markers: [Cargo.toml, Cargo.lock]
dependencies:
  rust-analyzer:
    display-name: Rust Analyzer
    probe: command:rust-analyzer --version
    toolchain: rustup
    package: rust-analyzer
options-schema:
  server-settings:
    type: object
    default: {}
