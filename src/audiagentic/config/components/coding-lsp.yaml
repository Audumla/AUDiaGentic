type: component
contract-version: v1
id: coding-lsp
display-name: Coding LSP
description: Language server protocol bridge for AI-assisted code navigation and editing
lifecycle-observer: audiagentic.components.coding_lsp.coding_lsp_bootstrap
status-hook: audiagentic.components.coding_lsp.coding_lsp_bootstrap.status_payload
detection-marker: .audiagentic/components/coding-lsp.yaml
implementation-cardinality: exclusive
feature-kinds:
  - language

# Language facts (server command, file extensions, detection markers, and
# language LSP server dependencies) live in feature files under
# config/components/coding-lsp/<language>.yaml. This component owns
# orchestration only — enabling, installing, and propagating LSP capability.

files:
  - path: .audiagentic/components/coding-lsp.yaml
    lifecycle: create-if-missing
    description: Installation marker
  - path: .coding-lsp/logs
    lifecycle: runtime-only
    recursive: true
    description: MCP server and session logs
mcp-servers:
  - name: ag-lsp-mgmt
    module: audiagentic.components.coding_lsp.lsp_manage_mcp
    description: LSP server configuration — manage language server settings
    propagate: audiagentic
    instructions: >
      Use lsp_list_languages to see all supported languages with their default server commands.
      Use lsp_config_status to see which languages are configured and whether
      their server binaries are installed.
      Use lsp_list_missing to see configured languages whose server binaries are not installed.
      Use lsp_list_implementations to see which LSP implementation is active.
      Use lsp_select_implementation to switch between available LSP implementations.
      Use lsp_add_language to add support for a language detected in the project.
      Use lsp_set_language_option to update supported language feature options.
      Use lsp_reset_language_option to clear a language feature option.
      Use lsp_install_dependencies to install a missing language server binary.
      Use lsp_remove_language to remove a language from the project configuration.
      Do not suggest installing a language server unless the project uses that language
      or the user explicitly requests it.

  - name: ag-lsp
    module: audiagentic.components.coding_lsp.lsp_mcp
    description: LSP code intelligence — symbols, definitions, diagnostics
    propagate: audiagentic
    instructions: >
      Use these tools for precise code navigation and intelligence.
      Start with lsp_capabilities(file) when unsure which operations the language
      server supports. Use lsp_symbols(query) for symbol-name or identifier
      searches, not arbitrary text search; prefer it before grep for symbol
      lookups. Use lsp_file_diagnostics(file) for a specific file, especially a
      changed file. Use lsp_diagnostics(root) for workspace/server diagnostics.
      lsp_definition: go to definition at a file position (format: line:column, 1-based).
      lsp_hover: get type/documentation at a position.
      lsp_references: find all references to a symbol.
      lsp_doc_symbols: get the symbol outline for a file.
      lsp_rename_preview: preview a rename refactor without applying it.
      These tools only work for languages enabled for the active LSP implementation.
      Empty results can mean no match, unsupported capability, language not enabled,
      or missing server binary; verify with lsp_capabilities(file) before treating
      an empty response as definitive.

harness-instructions:
  - section: "What you can do"
    propagate: audiagentic
    content: |
      ### ag-lsp-mgmt
      - `lsp_config_status` — Show configured languages and whether their server binaries are installed
      - `lsp_list_implementations` — Show available LSP implementations and the active selection
      - `lsp_select_implementation` — Switch the active LSP implementation
      - `lsp_add_language` — Add a language to the project (auto-configures defaults from the language spec)
      - `lsp_remove_language` — Remove a language from the project configuration
      - `lsp_set_language_option` — Update a supported language feature option
      - `lsp_reset_language_option` — Clear a supported language feature option
      - `lsp_list_languages` — List all supported languages with their default server commands
      - `lsp_list_missing` — List configured languages whose server binaries are not installed
      - `lsp_install_dependencies` — Install a missing language server binary (confirm with user first)

      Active languages come from feature state and the active implementation's
      language bindings; .coding-lsp/lsp.json is a generated runtime cache/projection
      only, not the source of truth. Nothing is auto-detected or installed at
      component install time. lsp_add_language enables a language feature (server
      defaults from the language spec); installing its server binary is a separate,
      explicit step via lsp_install_dependencies — scoped to enabled languages only.
      Do not suggest installing a language server unless the project uses that
      language or the user explicitly requests it.

# No instruction-file contribution for LSP tools: the ag-lsp / ag-lsp-mgmt MCP
# servers expose their tools and descriptions to the agent directly over the MCP
# protocol, and only to providers that actually receive those servers. A markdown
# tool list duplicated into every provider's instruction file drifts out of sync
# (e.g. advertised to opencode/pi, which self-provide LSP and never get ag-lsp).
# Usage doctrine lives in each MCP server's `instructions` field above.

