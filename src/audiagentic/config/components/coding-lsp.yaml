type: component
contract-version: v1
id: coding-lsp
display-name: Coding LSP
description: Language server protocol bridge for AI-assisted code navigation and editing
lifecycle-observer: audiagentic.components.coding_lsp.coding_lsp_bootstrap
status-hook: audiagentic.components.coding_lsp.coding_lsp_bootstrap.status_hook
implementation-cardinality: exclusive
feature-kinds:
