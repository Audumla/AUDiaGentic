# Agent Execution Gateway trigger events — consumed by gateway/events.py
agents.execution.gateway.requested:
  description: "Agent job dispatched to gateway via event trigger"
  payload-required: ["project-root", "prompt-body"]
  payload-optional: ["execution-profile-id", "source"]
  metadata-keys: []
  delivery: sync
  since: v1.0.0

agents.execution.gateway.cancel-requested:
  description: "Gateway cancel request propagated from job control"
  payload-required: ["project-root", "request-id"]
  payload-optional: []
  metadata-keys: []
  delivery: sync
  since: v1.0.0

agents.execution.gateway.profile-reloaded:
  description: "Gateway profile registry reloaded (redacted generation metadata only)"
  payload-required:
    ["config-path", "old-generation-summary", "new-generation-summary"]
  payload-optional: []
  metadata-keys: []
  delivery: async
  since: v1.0.0

# Agent Execution Gateway lifecycle events — published by gateway/queue/queue.py
agents.execution.queued:
  description: "Gateway request accepted and queued for dispatch"
  payload-required: ["request-id", "execution-profile-id", "state"]
  payload-optional: []
  metadata-keys: []
  delivery: async
  since: v1.0.0

agents.execution.started:
  description: "Gateway request dispatched to a worker thread"
  payload-required: ["request-id", "execution-profile-id", "state"]
  payload-optional: []
  metadata-keys: []
  delivery: async
  since: v1.0.0

agents.execution.completed:
  description: "Gateway request completed successfully"
  payload-required: ["request-id", "execution-profile-id", "state"]
  payload-optional: ["provider-id", "model-id", "attempt_count"]
  metadata-keys: []
  delivery: async
  since: v1.0.0

agents.execution.failed:
  description: "Gateway request failed (runner exception or explicit failure)"
  payload-required: ["request-id", "execution-profile-id", "state"]
  payload-optional: ["provider-id", "model-id", "error", "attempt_count"]
  metadata-keys: []
  delivery: async
  since: v1.0.0

agents.execution.cancelled:
  description: "Gateway request cancelled before or during dispatch"
  payload-required: ["request-id", "execution-profile-id", "state"]
  payload-optional: ["provider-id", "model-id"]
  metadata-keys: []
  delivery: async
  since: v1.0.0

agents.execution.rejected:
  description: "Gateway request rejected (queue full or malformed event payload)"
  payload-required: ["request-id", "execution-profile-id", "state"]
  payload-optional: []
  metadata-keys: []
  delivery: async
  since: v1.0.0

agents.execution.interrupted:
  description: "Gateway request interrupted by recovery (stale owner gone; replay required)"
  payload-required: ["request-id", "execution-profile-id", "state"]
  payload-optional:
    ["provider-id", "model-id", "error", "attempt_count", "replay_required"]
  metadata-keys: []
  delivery: async
  since: v1.0.0

# Agent session lifecycle events — published by gateway/session/sessions.py
agents.session.opened:
  description: "Session opened and registered with SessionRuntime"
  payload-required: ["session-id", "execution-profile-id", "state"]
  payload-optional:
    ["provider-id", "model-id", "child-pid", "child-creation-identity"]
  metadata-keys: ["correlation_id"]
  delivery: async
  since: v1.0.0

agents.session.turn-finished:
  description: "A turn completed on a live session"
  payload-required: ["session-id", "execution-profile-id", "state"]
  payload-optional:
    ["provider-id", "model-id", "request-id", "turn-count", "stop-reason"]
  metadata-keys: ["correlation_id"]
  delivery: async
  since: v1.0.0

agents.session.closed:
  description: "Session closed (client-request or shutdown)"
  payload-required: ["session-id", "execution-profile-id", "state"]
  payload-optional: ["provider-id", "model-id", "close-reason", "turn-count"]
  metadata-keys: ["correlation_id"]
  delivery: async
  since: v1.0.0

agents.session.expired:
  description: "Session expired (idle-timeout or max-lifetime)"
  payload-required: ["session-id", "execution-profile-id", "state"]
  payload-optional: ["provider-id", "model-id", "close-reason", "turn-count"]
  metadata-keys: ["correlation_id"]
  delivery: async
  since: v1.0.0

agents.session.failed:
  description: "Session failed (child process died or transport error)"
  payload-required: ["session-id", "execution-profile-id", "state"]
  payload-optional: ["provider-id", "model-id", "close-reason", "turn-count"]
  metadata-keys: ["correlation_id"]
  delivery: async
  since: v1.0.0

agents.session.orphaned:
  description: "Owned session turn recovery observed proven orphan/dead ownership evidence"
  payload-required:
    ["session-id", "execution-profile-id", "state", "request-id", "evidence-tier"]
  payload-optional:
    ["provider-id", "model-id", "close-reason", "turn-count", "owner-epoch"]
  metadata-keys: ["correlation_id"]
  delivery: async
  since: v1.0.0

# Agent turn intra-turn events — published by gateway/session/sessions.py (AS18)
agents.turn.model.started:
  description: "Model inference starting (intra-turn observation)"
  payload-required: ["session-id", "execution-profile-id", "request-id", "kind"]
  payload-optional:
    [
      "provider-id",
      "model-id",
      "sequence",
      "native_kind",
      "semantic-strength",
      "verification-tier",
    ]
  metadata-keys: ["correlation_id"]
  delivery: async
  since: v1.0.0

agents.turn.model.completed:
  description: "Model inference completed (intra-turn observation)"
  payload-required: ["session-id", "execution-profile-id", "request-id", "kind"]
  payload-optional:
    [
      "provider-id",
      "model-id",
      "sequence",
      "native_kind",
      "semantic-strength",
      "verification-tier",
    ]
  metadata-keys: ["correlation_id"]
  delivery: async
  since: v1.0.0

agents.turn.tool.started:
  description: "Tool execution starting (intra-turn observation)"
  payload-required: ["session-id", "execution-profile-id", "request-id", "kind"]
  payload-optional:
    [
      "provider-id",
      "model-id",
      "sequence",
      "native_kind",
      "semantic-strength",
      "verification-tier",
      "tool-call-id",
    ]
  metadata-keys: ["correlation_id"]
  delivery: async
  since: v1.0.0

agents.turn.tool.completed:
  description: "Tool execution completed (intra-turn observation; status distinguishes completed from failed)"
  payload-required: ["session-id", "execution-profile-id", "request-id", "kind"]
  payload-optional:
    [
      "provider-id",
      "model-id",
      "sequence",
      "native_kind",
      "semantic-strength",
      "verification-tier",
      "tool-call-id",
      "status",
    ]
  metadata-keys: ["correlation_id"]
  delivery: async
  since: v1.0.0
