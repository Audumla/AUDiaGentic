RES-AGW-002: "The gateway session record was not found. The session may have been deleted or the ID is incorrect."
IO-AGW-002: "Failed to read or parse the gateway session record file. Check that the file exists and contains valid JSON."
CON-AGW-002: "The requested session state transition is illegal for the current workflow. Review valid transitions in workflows.yaml."
CON-AGW-003: "The session's turn queue is full. Wait for queued turns to drain before sending more prompts."
CON-AGW-004: "The session exceeded its max lifetime and is draining — no new turns are accepted. Open a new session (or open sessions with session_max_lifetime_seconds=0 to disable the cap)."
RES-AGW-003: "The session could not accept this turn because its gateway runtime handle is unavailable or its durable state is not active. Inspect runtime-state, prompt-submission, state, close-reason, timestamps, and provider binding in error details. For stale non-live sessions the prompt was not submitted; retry continuation so the gateway can rehydrate the durable provider session. Use session_resume only for a terminal session, or open a new session when no provider binding remains."
VAL-AGW-060: "The request's execution profile does not match the session's profile. A session is bound to one profile for its lifetime."
VAL-AGW-061: "session_max_lifetime_seconds requires session_keep_alive=true and must be positive, or 0 to disable the lifetime cap. The cap applies to the session's lifetime policy; it is only meaningful when keep-alive sets that policy."
VAL-AGW-062: "project_root must be an absolute, canonicalizable local path."
VAL-AGW-063: "provider_id and model_id must either both be supplied or both be omitted."
VAL-AGW-064: "UNC and network project roots are not supported by the gateway execution-context v1 contract."
VAL-AGW-065: "Gateway execution-context metadata must not contain credential-like material."
VAL-AGW-066: "Gateway execution mode must be 'async' or 'blocking'."
VAL-AGW-067: "provider_isolation_tier must be full-isolation, partial-isolation, or no-isolation."
VAL-AGW-068: "A required gateway execution-manifest identity field is missing."
VAL-AGW-069: "The gateway execution-context schema version is unsupported. Use a version in the gateway's advertised supported range."
VAL-AGW-070: "Provide the non-empty worker identity assigned by the gateway control plane."
CON-AGW-071: "Reload the request and retry only through the owning control plane because its revision changed."
CON-AGW-072: "Ignore the stale worker result; a newer worker owns this request attempt."
CON-AGW-073: "Ignore the stale attempt result; the request has advanced to a newer attempt epoch."
CON-AGW-074: "Discard the private worker message because its outer and provider execution attempt identities differ."
VAL-AGW-074: "Reject the malformed private worker-protocol frame and start no provider execution."
VAL-AGW-075: "Remove environment, configuration, credential, and secret fields from the worker execution request."
CON-AGW-075: "Reject the worker because it did not return the required identity handshake before execution."
CON-AGW-076: "Reject the worker because its PID or creation identity does not match the supervised process."
CON-AGW-077: "Reject the worker error because its attempt identity differs from the handshake."
CON-AGW-078: "Reject the unsupported worker terminal response and inspect redacted worker diagnostics."
CON-AGW-079: "Reject the worker result because its attempt identity differs from the handshake."
CON-AGW-080: "Reject provider environment variables that would replace the gateway worker's private HOME, temporary directory, or trusted Python import path."
CON-AGW-081: "Use a new idempotency key when changing a gateway request's execution intent; replay the original request unchanged to retrieve its existing result."
VAL-AGW-082: "Gateway submission fields must use the documented scalar types and finite timeout ranges; raw prompt and idempotency metadata aliases are removed before durable publication."
VAL-AGW-083: "Provide the non-empty dispatch owner epoch issued by the gateway control plane."
CON-AGW-083: "Do not mutate this request because another owner or terminal transition has superseded its dispatch claim."
VAL-AGW-084: "Use the owned terminal-transition API only for a terminal request state."
CON-AGW-084: "A stale gateway service owner left work in an unprovable state. Treat the request as interrupted and resubmit if needed."
CON-AGW-101: "Resubmit the request because the gateway profile generation or execution configuration changed before dispatch."
CON-AGW-102: "Submit a new request because recovery found queued work without a recoverable dispatch payload."
CON-AGW-103: "Link replay metadata only from an interrupted terminal request that explicitly requires replay."
CON-AGW-104: "The work-index phase update was rejected because the entry's current phase does not match the expected-from-phase value."
CON-AGW-105: "The work-index phase transition is illegal; use only transitions defined in the legal-transition graph (admitted→claimed|terminal-cleanup, claimed→running|terminal-cleanup, running→terminal-cleanup)."
CON-AGW-106: "A different dispatch owner epoch already holds this work-index entry; do not mutate it from a stale owner."
IO-AGW-107: "Fix the gateway profiles config file so it parses as the documented profile-list YAML shape."
IO-AGW-108: "The hosted gateway profile registry is not installed. Start the composed gateway service before admitting execution requests."
VAL-AGW-085: "Provide the complete current dispatch owner, worker, and positive attempt identity for an owned request mutation."
VAL-AGW-086: "Provide the non-empty component identity acknowledging a gateway cancellation request."
UNS-AGW-076: "This provider declares partial-isolation, or a full-isolation materializer that has not been proven safe — neither can run through the disposable-subprocess-per-attempt worker pool. A no-isolation provider does not hit this error; it dispatches through a live gateway session instead (submit with session_keep_alive=true, or an existing session_id, to use one directly)."
TO-AGW-076: "Activity evidence became stale; reconcile the still-running request. This is not provider timeout proof unless an explicit absolute safety ceiling was exhausted."
TO-AGW-090: "The session turn exceeded its deadline and the session was closed. Raise params.session-turn-timeout-seconds (0 disables) or investigate the hung agent harness."
CON-AGW-095: "The resolved session surface is unsupported for this provider — no transport could be prepared. Check that the provider is enabled, installed, and declares a supported session surface for this platform."
CON-AGW-096: "A provider session already has an active owned AG binding. Close or retire the existing session before opening another owner; use explicit attach only when the resolved surface supports it."
IO-AGW-096: "The gateway session binding index is unreadable. Rebuild it from validated session records under the project lock."
VAL-AGW-096: "The gateway session binding index failed validation. Rebuild it from validated session records under the project lock."
VAL-AGW-097: "A session workflow transition attempted to modify immutable identity fields (provider-id, model-id, binding, ...). One generation has one binding; open a new session record for resume/replacement instead of mutating this one."
VAL-AGW-098: "Session lifetime bounds provided with session_id and session_keep_alive, but the runtime cannot update policy on an existing session. Ensure the session is live in this gateway process."
VAL-AGW-099: "Provider ref is empty; cannot attach to an existing provider session. Supply a non-empty opaque provider-session-ref."
VAL-AGW-100: "Provider ref is empty; cannot create a resume binding. Supply a non-empty opaque provider-session-ref and a valid predecessor-binding-id."
VAL-AGW-101: "Provider ref is empty; cannot create a replacement binding. Supply a non-empty opaque provider-session-ref and a valid predecessor-binding-id."
VAL-AGW-102: "Provider session binding requires a resolved surface id. Pass surface_id when a provider-session-ref is present -- AS29 session surfaces are the binding's identity, not optional."
VAL-AGW-103: "Legacy (v1) session binding has no resolved surface id; migration refused. A v1 record predates AS29 surface declarations and cannot be safely upgraded without one."
VAL-AGW-151: "provider_chat_url must be a valid project-scoped ChatGPT conversation URL and is supported only by gpt-auto execution profiles. Use /g/<project>/c/<conversation-id>, not a /project landing URL."
RES-AGW-103: "The resolved execution profile does not declare a session surface. Set surface_id explicitly on the execution profile -- generic gateway code never guesses one from the provider id."
CON-AGW-110: "Explicit resume requires a terminal source session; the session referenced by source-session-id is still active or otherwise not in a terminal state."
CON-AGW-120: "The source session record is missing a valid resolved surface. Reopen the session using a current execution profile with a declared session surface."
CON-AGW-121: "The provider transport returned a session identity that does not match the gateway request. Verify the provider adapter's session-open contract."
CON-AGW-122: "The source session cannot be resumed because its provider binding is incomplete or inconsistent. Inspect the stored session binding before retrying."
CON-AGW-123: "The resumed provider transport did not return a provider session identity. Verify provider resume support and retry with a fresh control id."
RES-AGW-111: "The source session has no usable provider binding (missing or empty provider-session-ref) to resume from."
UNS-AGW-112: "The resolved session surface does not declare resume-by-ref as supported for this provider/surface."
VER-AGW-113: "The current resolved surface's id or ref namespace is incompatible with the source binding's surface — resume across incompatible surfaces is not allowed."
CON-AGW-115: "The request's execution context fingerprint is unknown or does not match the source binding's stored execution context fingerprint."
CON-AGW-116: "This resume control id was already used for a request that failed; resubmit with a new control id rather than replaying a failed attempt."
UNS-AGW-117: "The resolved session surface declares resume-by-ref as supported but its evidence is not validated (evidence.validated=False); prove the capability (AS29) before enabling resume."
EXT-AGW-118: "The provider rejected the resume operation (ACP session/load or equivalent). Inspect the preserved error-message and underlying-details before retrying; verify the provider-session-ref, retained browser tab, and provider session store."
EXT-AGW-119: "The provider acknowledged a session turn but returned no assistant response. Keep the durable session available for reconciliation or retry; inspect bounded gateway diagnostics and the provider harness/bridge version before trusting a retry."
IO-AGW-119: "Provider resume succeeded but persisting the new session record failed; the transport was closed and no live generation was exposed. Investigate the session store write path and retry the resume with a new control id."
INT-AGW-076: "Inspect redacted worker diagnostics; isolated provider execution failed without a safe public error."
INT-AGW-077: "Inspect redacted worker diagnostics; the supervised worker did not return the handshake and one terminal frame."
VER-AGW-001: "Start a worker that supports gateway-worker-v1; do not translate incompatible private worker frames."
UNS-AGW-001: "The resolved provider does not support live agent sessions (no ACP launch builder). Use a provider with ACP session support or drop the session fields."
