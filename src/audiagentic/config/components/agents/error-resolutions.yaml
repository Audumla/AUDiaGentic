# Agent Gateway (AGW) and Agent Profile (AGP) error resolutions
VAL-AGW-001: "The request mode must be 'async' or 'blocking'. Check the mode parameter."
VAL-AGW-002: "The gateway request record failed schema validation after construction. Review the built record fields."
VAL-AGW-003: "The gateway request record is missing a request-id. Ensure build_record() generated one before writing."
VAL-AGW-004: "The gateway request record failed schema validation on write. Check all required fields."
VAL-AGW-005: "The persisted gateway request record failed schema validation on read. The record may be corrupted or from an older contract version."
VAL-AGW-006: "The current gateway request state is not recognized by the workflow engine. Check the record's state field against valid states."
VAL-AGW-007: "A non-empty prompt_body is required. Provide a prompt with at least one character of text."
VAL-AGW-008: "timeout_seconds must be a positive number. Use 0 or null for no timeout."
RES-AGW-001: "The gateway request record was not found. The request may have been deleted or the ID is incorrect."
IO-AGW-001: "Failed to read or parse the gateway request record file. Check that the file exists and contains valid JSON."
CON-AGW-001: "The requested state transition is illegal for the current workflow. Review valid transitions in workflows.yaml."
VAL-AGW-020: "agent profile params.max-concurrency must be an integer (not bool or float). Check the profile configuration."
VAL-AGW-021: "agent profile params.max-concurrency must be at least 1. A value of 0 or negative is not valid."
VAL-AGW-022: "agent profile params.queue-max-size must be an integer (not bool or float). Check the profile configuration."
VAL-AGW-023: "agent profile params.queue-max-size must be at least 1. A value of 0 or negative is not valid."
VAL-AGW-025: "The gateway request queue is full for this profile. Wait for in-flight requests to complete or increase queue-max-size."
VAL-AGW-030: "agent profile params.retry-count must be a non-negative integer (not bool, float, or negative). Check the profile configuration."
VAL-AGW-031: "The provider referenced by this agent profile is not enabled in provider config. Enable the provider or use a different profile."
INT-AGW-001: "The dispatch retry loop exited unexpectedly without a result or error. This indicates an internal logic defect — check server logs."
VAL-AGW-050: "Session idle_timeout_seconds must be positive, or 0 to disable the idle timeout. Omit it to use the gateway default."
VAL-AGW-051: "Session max_lifetime_seconds must be positive, or 0 to disable the lifetime cap. Omit it to use the gateway default."
VAL-AGW-052: "The gateway session record failed schema validation after construction. Review the built record fields."
VAL-AGW-053: "The gateway session record is missing a session-id. Ensure build_session_record() generated one before writing."
VAL-AGW-054: "The gateway session record failed schema validation on write. Check all required fields."
VAL-AGW-055: "The persisted gateway session record failed schema validation on read. The record may be corrupted or from an older contract version."
VAL-AGW-056: "The current gateway session state is not recognized by the workflow engine. Check the record's state field against valid states."
VAL-AGW-057: "session_id and session_keep_alive are mutually exclusive. Use session_keep_alive to open a session, session_id to continue one."
VAL-AGW-059: "session_idle_timeout_seconds requires session_keep_alive and must be positive. The idle timeout is fixed when the session is opened."
RES-AGW-002: "The gateway session record was not found. The session may have been deleted or the ID is incorrect."
IO-AGW-002: "Failed to read or parse the gateway session record file. Check that the file exists and contains valid JSON."
CON-AGW-002: "The requested session state transition is illegal for the current workflow. Review valid transitions in workflows.yaml."
CON-AGW-003: "The session's turn queue is full. Wait for queued turns to drain before sending more prompts."
CON-AGW-004: "The session exceeded its max lifetime and is draining — no new turns are accepted. Open a new session (or open sessions with session_max_lifetime_seconds=0 to disable the cap)."
RES-AGW-003: "The session is not active in this gateway process. It may have been closed, expired, or belong to a previous process — open a new session."
VAL-AGW-060: "The request's agent profile does not match the session's profile. A session is bound to one profile for its lifetime."
VAL-AGW-061: "session_max_lifetime_seconds requires session_keep_alive and must be positive, or 0 to disable the lifetime cap. The cap is fixed when the session is opened."
VAL-AGW-062: "project_root must be an absolute, canonicalizable local path."
VAL-AGW-063: "provider_id and model_id must either both be supplied or both be omitted."
VAL-AGW-064: "UNC and network project roots are not supported by the gateway execution-context v1 contract."
VAL-AGW-065: "Gateway execution-context metadata must not contain credential-like material."
VAL-AGW-066: "Gateway execution mode must be 'async' or 'blocking'."
VAL-AGW-067: "provider_isolation_tier must be full-isolation, partial-isolation, or no-isolation."
VAL-AGW-068: "A required gateway execution-manifest identity field is missing."
VAL-AGW-069: "The gateway execution-context schema version is unsupported. Use a version in the gateway's advertised supported range."
VAL-AGW-070: "Provide the non-empty worker identity assigned by the gateway control plane."
CON-AGW-071: "Reload the request and retry only through the owning control plane because its revision changed."
CON-AGW-072: "Ignore the stale worker result; a newer worker owns this request attempt."
CON-AGW-073: "Ignore the stale attempt result; the request has advanced to a newer attempt epoch."
CON-AGW-074: "Discard the private worker message because its outer and provider execution attempt identities differ."
VAL-AGW-074: "Reject the malformed private worker-protocol frame and start no provider execution."
VAL-AGW-075: "Remove environment, configuration, credential, and secret fields from the worker execution request."
CON-AGW-075: "Reject the worker because it did not return the required identity handshake before execution."
CON-AGW-076: "Reject the worker because its PID or creation identity does not match the supervised process."
CON-AGW-077: "Reject the worker error because its attempt identity differs from the handshake."
CON-AGW-078: "Reject the unsupported worker terminal response and inspect redacted worker diagnostics."
CON-AGW-079: "Reject the worker result because its attempt identity differs from the handshake."
CON-AGW-080: "Reject provider environment variables that would replace the gateway worker's private HOME, temporary directory, or trusted Python import path."
CON-AGW-081: "Use a new idempotency key when changing a gateway request's execution intent; replay the original request unchanged to retrieve its existing result."
VAL-AGW-082: "Gateway submission fields must use the documented scalar types and finite timeout ranges; raw prompt and idempotency metadata aliases are removed before durable publication."
VAL-AGW-083: "Provide the non-empty dispatch owner epoch issued by the gateway control plane."
CON-AGW-083: "Do not mutate this request because another owner or terminal transition has superseded its dispatch claim."
VAL-AGW-084: "Use the owned terminal-transition API only for a terminal request state."
CON-AGW-084: "A stale gateway service owner left work in an unprovable state. Treat the request as interrupted and resubmit if needed."
VAL-AGW-085: "Provide the complete current dispatch owner, worker, and positive attempt identity for an owned request mutation."
VAL-AGW-086: "Provide the non-empty component identity acknowledging a gateway cancellation request."
UNS-AGW-076: "Use a provider with a proven full-isolation execution materializer; partial and fixed configuration cannot run concurrently through the shared gateway."
TO-AGW-076: "Increase the request timeout or investigate the provider worker that exceeded its bounded execution time."
TO-AGW-090: "The session turn exceeded its deadline and the session was closed. Raise params.session-turn-timeout-seconds (0 disables) or investigate the hung agent harness."
CON-AGW-096: "A provider session already has an active owned AG binding. Close or retire the existing session before opening another owner; use explicit attach only when the resolved surface supports it."
IO-AGW-096: "The gateway session binding index is unreadable. Rebuild it from validated session records under the project lock."
VAL-AGW-096: "The gateway session binding index failed validation. Rebuild it from validated session records under the project lock."
INT-AGW-076: "Inspect redacted worker diagnostics; isolated provider execution failed without a safe public error."
INT-AGW-077: "Inspect redacted worker diagnostics; the supervised worker did not return the handshake and one terminal frame."
VER-AGW-001: "Start a worker that supports gateway-worker-v1; do not translate incompatible private worker frames."
UNS-AGW-001: "The resolved provider does not support live agent sessions (no ACP launch builder). Use a provider with ACP session support or drop the session fields."
VAL-AGP-001: "Agent profile failed validation. Check that profile_id, provider_id, and model_id are present and valid."
RES-AGP-001: "The agent profile was not found. Check the profile-id against configured profiles in agent-profiles.yaml."
RES-AGP-002: "An agent profile with this ID already exists. Use a different profile_id or update the existing profile."
RES-AGP-003: "No default agent profile is configured. Set is_default: true on one profile, or specify agent-profile-id explicitly."
IO-AGP-001: "Failed to read the agent profiles configuration file. Check that agent-profiles.yaml exists and is valid YAML."
IO-AGP-002: "Failed to write the agent profiles configuration file. Check disk permissions and available space."
VAL-AGP-004: "The agent profiles contract version is not supported. Ensure the file uses contract-version: v1."
