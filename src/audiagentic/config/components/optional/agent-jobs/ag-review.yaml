type: action
contract-version: v1
id: ag-review/doctrine
title: Review action doctrine
content:
  body: |
    When the review action is triggered: perform read-focused validation and
    completeness review. Identify blockers, missing tests, contract mismatches,
    and drift from tracked docs. Do not add implementation work unless explicitly
    requested, and do not broaden review into feature-scope changes. Keep tracked
    docs and release artifacts synchronized with the job record.

tag-id: ag-review
display-name: Review
description: Perform read-focused validation and completeness review without adding implementation work
aliases:
  - agr
  - r
  - review
directives:
  - id
  - target
  - context
  - output
  - template
  - job
  - profile
  - model
  - model-alias
  - review-count
  - aggregation
  - distinct-reviewers
  - require-distinct-reviewers
requires-body: true
is-generic-tag: false
is-review-tag: true
skill-content-file: ag-review-skill.md

prompts:
  - name: default
    content-file: ag-review-prompt-default.md
