type: component
contract-version: v1
id: agent-ledger
display-name: Agent Ledger
description: Change ledger — fragment recording, sync, audit summaries, and release archiving
detection-marker: .audiagentic/components/agent-ledger.yaml
files:
  - path: .audiagentic/components/agent-ledger.yaml
    lifecycle: create-if-missing
    description: Installation marker
  - path: .audiagentic/runtime/ledger
    lifecycle: runtime-only
    recursive: true
    description: Ledger fragments and sync state
mcp-servers:
  - name: ag-ledger
    module: audiagentic.components.optional.ledger.ledger_mcp
    direct-tools: [record_change_event, get_current_summary, sync_ledger, get_audit_report]
    description: Ledger content tools — record events, summarise, sync, and audit
    propagate: audiagentic,providers
    instructions: >
      Use record_change_event after completing substantive implementation work.
      Use get_current_summary to inspect what has been recorded in the current release.
      Use sync_ledger to merge pending fragments before a release or audit.
      Use get_audit_report to regenerate audit and check-in summaries.
    tool-descriptions:
      record_change_event: >
        Record a change event fragment. Required: event-id (chg_YYYYMMDD_HHMMSS_<desc>),
        timestamp-utc, project-id, source (kind, provider-id, surface, prompt-tag),
        change-class, files, technical-summary, user-summary-candidate, status ('unreleased').
        source.kind: 'interactive-prompt' (most common), 'job-run', 'workflow-stage',
        'manual-script', 'release-finalization'. source.session-id, job-id, packet-id,
        review-id: null for ad-hoc work; populated by job/packet/review system for
        structured workflows. change-class: feature, code-fix, refactor, docs, tests,
        config, release, audit, workflow.
      get_current_summary: Return the current release summary markdown.
      sync_ledger: Merge all pending fragments into the current release ledger.
      get_audit_report: Regenerate and return paths to the audit summary and check-in docs.
  - name: ag-ledger-mgmt
    module: audiagentic.components.optional.ledger.ledger_manage_mcp
    direct-tools: [get_ledger_status]
    description: Ledger component health — installation state and fragment count
    propagate: audiagentic
    instructions: >
      Use get_ledger_status to check installation state, fragment count, and last sync time.
    tool-descriptions:
      get_ledger_status: Return ledger installation state, fragment count, and last sync time.
harness-instructions:
  - section: "What you can do"
    content: |
      ### ag-ledger
      - `record_change_event` — Record a change event after implementation work
      - `get_current_summary` — View current release summary
      - `sync_ledger` — Merge pending fragments into the ledger
      - `get_audit_report` — Regenerate audit and check-in docs

      ### ag-ledger-mgmt
      - `get_ledger_status` — Check ledger installation and fragment count

contributions:
  - id: agent-ledger/process
    owner: agent-ledger
    title: Agent ledger process
    preferred-targets:
      - skill
      - instruction
    content:
      body: |
        For release-affecting work, follow AUDiaGentic agent ledger process.
        - Check release ledger state before changing release notes, changelog fragments, or release workflow files.
        - Keep release artifacts and job records synchronized with implementation and review outcomes.
        - Add or update the release ledger fragment when behavior, public workflow, or generated release output changes.
        - Do not bypass ledger updates by editing generated release outputs only.

  - id: agent-ledger/write-instruction
    owner: agent-ledger
    title: Ledger write instruction
    preferred-targets:
      - skill
      - instruction
    content:
      body: |
        After completing substantive implementation work, record a change event to the ledger
        using the ag-ledger MCP tool (record_change_event).
        Do not skip this step — the ledger is the authoritative record for release tracking.
        Required fields: event-id (chg_YYYYMMDD_HHMMSS_<desc>), timestamp-utc, project-id,
        source (kind=interactive-prompt, provider-id, surface, prompt-tag), change-class,
        files, technical-summary, user-summary-candidate, status ('unreleased').
        session-id, job-id, packet-id, review-id: null for ad-hoc work.
