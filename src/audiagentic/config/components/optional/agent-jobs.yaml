type: component
contract-version: v1
id: agent-jobs
display-name: Agent Jobs
description: Execution/jobs layer — workflow action tags, job records, and session artifacts. Skill sources are owned by the agent-actions component.
detection-marker: .audiagentic/components/agent-jobs.yaml
depends-on:
  - project
files:
  - path: .audiagentic/components/agent-jobs.yaml
    lifecycle: create-if-missing
    description: Installation marker
  - path: .audiagentic/runtime/jobs
    lifecycle: runtime-only
    recursive: true
    description: Job records and artifacts
  - path: .audiagentic/runtime/sessions
    lifecycle: runtime-only
    recursive: true
    description: Agent session input and review state

contributions:
  - config: components/optional/agent-actions/ag-implement.yaml
  - config: components/optional/agent-actions/ag-plan.yaml
  - config: components/optional/agent-actions/ag-review.yaml
