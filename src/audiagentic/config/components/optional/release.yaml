type: component
contract-version: v1
id: release
display-name: Release
description: Release management — versioning, changelog rendering, and release manager tooling
detection-marker: .audiagentic/components/release.yaml
depends-on:
  - project
  - agent-ledger
files:
  - path: .audiagentic/components/release.yaml
    lifecycle: create-if-missing
    description: Installation marker
  - path: .github/workflows/release.yml
    lifecycle: required-managed
    description: Release workflow
mcp-servers:
  - name: audiagentic-release-admin
    module: audiagentic.components.optional.release.release_admin_mcp
    direct-tools: [get_release_status, ensure_release_baseline]
    description: Release component management
    instructions: >
      Use get_release_status to check the current release manager installation state.
      Use ensure_release_baseline to install or repair the release workflow.
    tool-descriptions:
      get_release_status: Return release installation status and active manager state.
      ensure_release_baseline: Ensure the release manager baseline workflow is installed.
  - name: audiagentic-release-please
    module: audiagentic.components.optional.release.release_please.release_please_mcp
    direct-tools: [release_please_status, install_release_please, update_release_please_workflow, finalize_release]
    description: Release-please release management tools
    instructions: >
      Use release_please_status to inspect current state before acting.
      Use install_release_please to set up a new project.
      Use update_release_please_workflow to refresh the workflow template.
      Use finalize_release only after ledger review is complete — it archives the ledger and renders release docs.
    tool-descriptions:
      release_please_status: Return release-please installation status and workflow state.
      install_release_please: Install release-please into the target project.
      update_release_please_workflow: Re-render the release workflow from the current template.
      finalize_release: Archive current ledger and render CHANGELOG.md, RELEASE_NOTES.md, VERSION_HISTORY.md.
harness-instructions:
  - section: "What you can do"
    content: |
      ### audiagentic-release-admin
      - `get_release_status` — Check release manager installation state
      - `ensure_release_baseline` — Install or repair the release workflow

      ### audiagentic-release-please
      - `release_please_status` — Check release-please status
      - `install_release_please` — Install release-please
      - `update_release_please_workflow` — Update release workflow
      - `finalize_release` — Archive ledger and render release documents

surface-contributions:
  - id: release/doctrine
    owner: release
    kind: rule
    title: Release doctrine
    preferred-targets:
      - skill
      - instruction
    content:
      body: |
        Use the configured release manager for versioning and publication.
        Do not edit generated release artifacts (CHANGELOG.md, RELEASE_NOTES.md) directly.
        Run finalize_release only after ledger audit review is complete.
        The ledger is archived as part of finalization — this cannot be undone.
