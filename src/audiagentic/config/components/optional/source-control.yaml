type: component
contract-version: v1
component-id: source-control
display-name: Source Control
description: Source control — installs and manages official git and GitHub MCP servers for providers
detection-marker: .audiagentic/components/source-control.yaml
depends-on:
  - project
files:
  - path: .audiagentic/components/source-control.yaml
    lifecycle: create-if-missing
    description: Installation marker
mcp-servers:
  - name: audiagentic-source-control
    module: audiagentic.components.optional.source_control.source_control_admin_mcp
    direct-tools: [get_source_control_status, install_dependencies, uninstall_dependencies]
    description: Source control component management
    instructions: >
      Use get_source_control_status to check git, gh CLI, gh mcp extension, and uv (uvx).
      The status includes a missing-dependencies list. If any are missing and the user
      wants them installed, ASK the user first which to install, then call
      install_dependencies(names=[...]). External MCP servers (git, github) are then
      registered automatically into the audiagentic mcp.json on next refresh. Use
      uninstall_dependencies(names=[...]) only when the user explicitly asks — never on
      component uninstall.
    tool-descriptions:
      get_source_control_status: Return availability of git, gh CLI, gh mcp, uv plus list of missing dependencies.
      install_dependencies: Install named source-control dependencies (git, gh, gh-mcp, uv) via host package manager after user confirms.
      uninstall_dependencies: Uninstall named source-control dependencies via host package manager (explicit user action only).
external-mcp-servers:
  - name: git
    command: uvx
    args: [mcp-server-git, --repository, .]
    requires: [uvx]
    description: Local git operations via official mcp-server-git
    instructions: >
      Use git MCP tools for local repository operations: status, diff, log,
      commit, branch management, and staging.
  - name: github
    command: gh
    args: [mcp, serve]
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
    requires: [gh]
    probe: [gh, mcp, serve, --help]
    description: GitHub API operations via official gh mcp serve
    instructions: >
      Use github MCP tools for GitHub API operations: pull requests, issues,
      releases, workflow dispatch, and code search.
harness-instructions:
  - section: "What you can do"
    content: |
      ### audiagentic-source-control
      - `get_source_control_status` — Check git, gh, gh-mcp, uv availability and list missing dependencies
      - `install_dependencies` — Install missing dependencies (git, gh, gh-mcp, uv) after user confirms
      - `uninstall_dependencies` — Uninstall named dependencies (explicit user action; not on component uninstall)

      When installing the source-control component: check missing-dependencies, ASK the user
      which to install, then call install_dependencies. Then run mcp_refresh_harness_config
      so the new git/github MCP servers appear in mcp.json.

      ### Official MCP servers (installed by this component)

      **git** (`mcp-server-git` via uvx)
      - Local git operations: status, diff, log, commit, branch, stage

      **github** (`gh mcp serve` via GitHub CLI)
      - GitHub API: pull requests, issues, releases, workflow dispatch, code search

      Prerequisites:
      - `uv` installed for git MCP server (`pip install uv` or https://docs.astral.sh/uv)
      - `gh` CLI installed with `gh extension install github/gh-mcp` for GitHub MCP server
      - `GITHUB_TOKEN` environment variable set for GitHub operations

lifecycle-observer: audiagentic.components.optional.source_control.observer

agent-tags:
  - config: components/optional/agent-actions/ag-check-in-prep.yaml

surface-contributions:
  - id: source-control/doctrine
    owner: source-control
    kind: rule
    title: Source control doctrine
    preferred-targets:
      - skill
      - instruction
    content:
      body: |
        Use the source control component for all git and GitHub operations.
        Before committing, record a change event to the ledger using the
        audiagentic-ledger-write MCP tool (record_change_event).
        Do not invoke git or GitHub APIs directly — use the MCP tools.
