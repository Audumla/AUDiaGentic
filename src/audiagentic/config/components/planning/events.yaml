# Planning item events
planning.item.created:
  description: "Plan item created"
  payload-required: ["item-id"]
  payload-optional: []
  metadata-keys: []
  delivery: async
  since: v1.0.0

planning.item.updated:
  description: "Plan item updated (content or metadata)"
  payload-required: ["item-id"]
  payload-optional: []
  metadata-keys: []
  delivery: async
  since: v1.0.0

planning.item.state.changed:
  description: "Plan item transitioned to a new state"
  payload-required: ["item-id", "state"]
  payload-optional: []
  metadata-keys: []
  delivery: async
  since: v1.0.0

planning.item.deleted:
  description: "Plan item permanently deleted"
  payload-required: ["item-id"]
  payload-optional: []
  metadata-keys: []
  delivery: async
  since: v1.0.0

