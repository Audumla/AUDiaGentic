# Planning (PLN) error resolutions
VAL-PLN-001: "The plan item was not found in active or completed directories. Check the item ID and ensure it exists."
VAL-PLN-003: "The 'plan' field is required for plan items. Provide a plan directory name (e.g., 'code-cleanup')."
VAL-PLN-004: "The 'title' field is required for plan items. Provide a short descriptive title."
VAL-PLN-005: "A plan item with this ID already exists. Use a different ID or update the existing item."
VAL-PLN-006: "The state value is not recognized by the planning workflow engine. Check against valid states in workflows.yaml."
VAL-PLN-008: "The 'review-of' (or 'review_of') field is required for reviews. Provide the parent plan item ID."
VAL-PLN-009: "The 'title' field is required for reviews. Provide a short descriptive title for the review."
VAL-PLN-010: "The parent plan item was not found. Check that the review-of ID references an existing plan item."
VAL-PLN-011: "A review with this auto-generated ID already exists across plans. Use a different ID or delete the duplicate."
VAL-PLN-012: "The derived prefix for this plan collides with another plan's items. Rename one plan's directory to avoid the collision."
VAL-PLN-013: "This operation requires a review item, but the target has a mismatched type. Use the correct scoped tool (item vs review)."
VAL-PLN-014: "The state transition is not allowed for this planning entity kind. Review valid transitions in workflows.yaml."
VAL-PLN-015: "No implementation with this ID exists in the agent-planning component descriptors. Check the implementation name."
VAL-PLN-016: "This option key is not defined in the implementation's options schema. Check the available options for this implementation."
VAL-PLN-017: "The value failed validation against the option's schema type and constraints. Check the expected type and allowed values."
VAL-PLN-018: "This ID references a review, not a plan item. Use the review-scoped tool instead."
VAL-PLN-019: "This state transition operation targets a review, not a plan item. Use set_review_state instead."
VAL-PLN-020: "This update operation targets a review, not a plan item. Use update_review instead."
VAL-PLN-021: "This delete operation targets a review, not a plan item. Use delete_review instead."
VAL-PLN-022: "This ID references a plan item, not a review. Use the item-scoped tool instead."
VAL-PLN-023: "This update operation targets a plan item, not a review. Use update_item instead."
VAL-PLN-024: "This delete operation targets a plan item, not a review. Use delete_item instead."
VAL-PLN-025: "The 'created-by' field is required for plan items. Provide a creator identity (created-by, created_by, or creator_id)."
VAL-PLN-026: "plan_list_items requires at least one of 'plan' or 'id_prefix'. Use plan='code-cleanup' to filter by plan, or id_prefix='CC' to filter by ID prefix."
VAL-PLN-027: "The 'append' option requires update content. Put the text in updates (for example updates={'notes': 'new text'}) and list the section name in append (append=['notes'])."
VAL-PLN-028: "Every value in 'append' must also be a key in 'updates'. Use section names such as 'notes', not the text to append, and include that text in updates."
