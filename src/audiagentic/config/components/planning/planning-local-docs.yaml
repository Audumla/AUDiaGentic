type: implementation
contract-version: v1
parent: agent-planning
id: planning-local-docs
display-name: Local Planning Docs
default: true
description: >
  Hand-rolled plan item management. Items are markdown files stored under
  docs/planning/active/ (pending) and docs/planning/completed/.
  No external service required.

paths:
  plans-root: docs/planning/
  active-dir: docs/planning/active
  completed-dir: docs/planning/completed
  template: docs/planning/TEMPLATE_ITEM.md

standards:
  - id: arch-standards
    title: Architecture Standards
    path: docs/standards/ARCHITECTURE_STANDARDS.md
    description: 'Non-negotiable rules: layering, config-over-code, error handling, logging'
  - id: component-creation
    title: Creating Components
    path: docs/standards/CREATING_A_COMPONENT.md
    description: 'Guide for adding new Components to Audiagentic: describes the concepts of implementations, descriptors, MCP servers, features and options'

files:
  - path: docs/planning
    lifecycle: runtime-only
    recursive: true
    description: Plan item documents
  - path: .audiagentic/skills/ag-planning/skill.md
    lifecycle: required-managed
    description: ag-planning skill source

