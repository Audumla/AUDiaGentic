type: component
contract-version: v1
core: true
id: project
display-name: Project
description: Core project scaffold — config, prompts, and workflow files
context-hook: audiagentic.components.project.project_api.context
lifecycle-observer: audiagentic.components.project.onboarding_events
files:
  - path: .audiagentic/state/mcp-onboarding
    lifecycle: create-if-missing
    recursive: true
    description: Recoverable MCP installation receipts and bounded reconciliation diagnostics
  - path: .audiagentic/config/interoperability/config.yaml
    lifecycle: create-if-missing
    description: Event bus and interoperability runtime config
  - path: .audiagentic/config/interoperability/event-subscriptions.yaml
    lifecycle: create-if-missing
    description: Project-local event subscriptions (not a topic registry; see ARCHITECTURE_STANDARDS §17)
mcp-servers:
  - name: ag-project-mgmt
    module: audiagentic.components.project.project_mcp
    direct-tools: [project_status, list_components, install_component, uninstall_component, enable_component, disable_component, read_project_file, list_project_instructions, get_project_instruction, create_project_instruction, update_project_instruction, delete_project_instruction, list_project_skills, get_project_skill, create_project_skill, update_project_skill, delete_project_skill, runtime_sync_contract, get_option_provenance, list_mcp_catalog, install_mcp, get_mcp_install_status]
    description: Project MCP server for project-level component management
    propagate: audiagentic
    instructions: >
      Manage project components and explicitly selected MCP access.
      Discover declarations with list_mcp_catalog; pass an MCP ID for details.
      Use install_mcp only for explicitly requested targets and dry_run for preflight.
      Inspect interrupted work with get_mcp_install_status; repeating a matching
      install safely resumes proven incomplete work. Configured is distinct from
      reachable or verified. Installing a component does not expose all MCPs.
      Never overwrite foreign native configuration or install harness binaries.
    tool-descriptions:
      project_status: Return current project installation state and installed components.
      list_components: List all registered AUDiaGentic components with install and enabled status.
      install_component: Install a component and perform its existing runtime refresh. Native MCP exposure follows explicit Project selections; component installation does not select every MCP or harness.
      uninstall_component: Uninstall a component and refresh its runtime surfaces. Prune only its owned native exposure; preserve foreign entries.
      enable_component: Enable a component and refresh its runtime surfaces. Restore native MCP exposure only for explicit Project selections.
      disable_component: Disable a component and refresh its runtime surfaces. Prune its owned native exposure without selecting additional harnesses.
      read_project_file: >
        Read a file inside the project .audiagentic directory. relative_path must
        start with '.audiagentic/' (e.g. '.audiagentic/config/runtime/features/memory.yaml').
        Pass a directory path — or '.' for the root — to list its contents instead
        of reading a file, when you need to discover what exists before reading it.
      list_project_instructions: List project-owned instructions rendered to enabled provider surfaces.
      get_project_instruction: Read one project-owned instruction by stable id.
      create_project_instruction: Create a project-owned instruction and reconcile enabled provider surfaces.
      update_project_instruction: Update a project-owned instruction and reconcile enabled provider surfaces.
      delete_project_instruction: Delete a project-owned instruction and reconcile enabled provider surfaces.
      list_project_skills: List project-owned skills rendered to enabled provider skill surfaces.
      get_project_skill: Read one project-owned skill by stable id.
      create_project_skill: Create a project-owned skill with YAML frontmatter and reconcile enabled provider surfaces.
      update_project_skill: Update a project-owned skill and reconcile enabled provider surfaces.
      delete_project_skill: Delete a project-owned skill and reconcile enabled provider surfaces.
      runtime_sync_contract: Return the Pi runtime sync contract for existing component mutations, distinct from native MCP onboarding operation status.
      list_mcp_catalog:
        description: List declared MCP servers, or inspect one server's owned help and eligible native targets. Metadata-only; no installation, provider startup or external probes.
        parameters:
          mcp_id: Canonical MCP ID such as ag-planning. Omit for the compact catalog; supply an ID for detailed metadata.
      install_mcp:
        description: Set one declared MCP's complete native target selection for this project. Preflight all affected targets and preserve other MCP bindings. Repeating a matching request safely resumes proven incomplete work. Does not install harness binaries or authenticate accounts.
        parameters:
          mcp_id: Canonical MCP ID to configure, such as ag-planning.
          harness_ids: Nonempty explicit harness IDs. This is the complete selection for this MCP; omitted previous targets are removed. Other MCPs and foreign configuration remain untouched.
          dry_run: Default false. True reports planned changes without persisting selection or modifying native files.
      get_mcp_install_status:
        description: Read bounded installation progress, per-target outcomes and safe next actions. Does not retry, probe or disclose native configuration.
        parameters:
          operation_id: Installation operation ID. Omit for the latest unresolved operation; returns has_unresolved_operation false when none exists.
      get_option_provenance: Show where each option value came from (project config,
        harness defaults, or override). Optionally filter by component_id.

contributions:
  - id: project/mcp-onboarding
    owner: project
    title: MCP onboarding
    preferred-targets: [instruction]
    content:
      body: |
        Configure MCP access only for explicitly requested harnesses.
        Discover servers with `audiagentic mcp list` and targets with
        `audiagentic harness list`. Use `audiagentic mcp MCP_ID help` for setup.
        Install with `audiagentic mcp install MCP_ID harness ID[,ID...]`.
        This sets that MCP's complete native target selection; other MCPs remain unchanged.
        Component installation alone does not select native MCP exposure.
        For every directory instead of one project, `audiagentic setup harness ID[,ID...]`
        registers the worktree-scoped servers at that harness's user scope
        (`dry-run` reports only); their tools take a per-call `worktree`.
        Report configured separately from verified.

  - id: project/worktrees
    owner: project
    title: Task worktrees
    preferred-targets: [instruction]
    content:
      body: |
        One task is one branch in its own git worktree; never edit the primary checkout.
        - `audiagentic worktree start SLUG [item ID]` creates branch OWNER/SLUG from the fresh
          remote default branch and prints the worktree path. Pass that path as the `worktree`
          argument of the planning, ledger and gateway tools.
        - Publish with `audiagentic worktree ship title "type(scope): subject" body TEXT`. It syncs the
          branch with the default branch, runs the pre-push checks the project names, pushes the exact
          checked commit without force, opens or reuses the pull request and asks GitHub to
          auto-merge, then returns. It never rebases and aborts on a conflict. Run `ship` again
          whenever the default branch moved (a release landed) and the pull request shows BEHIND;
          it reports `merged` when done. `sync`, `push` and `merge [dry-run yes]` are the single steps.
        - After `ship` reports merged, `audiagentic worktree finish BRANCH` preserves the work
          (quarantine ref, archive) and removes the worktree and branch. It refuses unmerged work;
          `abandon TIP12` discards it only after a verified bundle. `prune` reports what is eligible.
        - Never use `git worktree remove --force`, force-push, or edit the primary checkout.
        Details: docs/guides/WORKTREES.md.
