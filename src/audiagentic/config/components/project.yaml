type: component
contract-version: v1
core: true
id: project
display-name: Project
description: Core project scaffold — config, prompts, and workflow files
detection-marker: .audiagentic/components/project.yaml
files:
  - path: .audiagentic/components/project.yaml
    lifecycle: create-if-missing
    description: Installation marker
  - path: .audiagentic/config/project.yaml
    lifecycle: create-if-missing
    description: Project identity and workflow config
  - path: .audiagentic/config/interoperability/config.yaml
    lifecycle: create-if-missing
    description: Event bus and interoperability runtime config
  - path: .audiagentic/config/interoperability/events.yaml
    lifecycle: create-if-missing
    description: Project event definitions
mcp-servers:
  - name: ag-project-mgmt
    module: audiagentic.components.project.project_mcp
    direct-tools: [project_status, list_components, install_component, uninstall_component, enable_component, disable_component, read_project_file]
    description: Project MCP server for project-level component management
    propagate: audiagentic
    instructions: >
      AUDiaGentic project component server.
      Use project_status to inspect target project.
      Use list_components to see all registered components and their status.
    tool-descriptions:
      project_status: Return current project installation state and installed components.
      list_components: List all registered AUDiaGentic components with install and enabled status.
      install_component: Install a component into target project. Harness config is regenerated automatically — no manual refresh needed. The sync field in the result is a runtime hint for the harness adapter; the agent does not need to act on it.
      uninstall_component: Uninstall a component from target project. Harness config is regenerated automatically — no manual refresh needed.
      enable_component: Enable a component in target project. Harness config is regenerated automatically — no manual refresh needed.
      disable_component: Disable a component in target project. Harness config is regenerated automatically — no manual refresh needed.
      read_project_file: Read a file inside project .audiagentic directory.
harness-instructions:
  - section: "What you can do"
    content: |
      ### ag-project-mgmt
      - `mcp_project_status` — Check project installation state
      - `mcp_list_components` — List all available components
      - `mcp_install_component` — Install a component
      - `mcp_uninstall_component` — Uninstall a component
      - `mcp_enable_component` — Enable a component
      - `mcp_disable_component` — Disable a component
      - `mcp_read_project_file` — Read a project file
