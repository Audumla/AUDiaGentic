# Generic managed-mcp recipe for providers using URL transport.
#
# Register a single MCP server entry (ag-hindsight) under the namespaced
# ownership scope memory/hindsight/{server_name}.  Used by _resolve_recipe
# when the provider's mcp surface carries 'remote' in capabilities.
recipe-id: hindsight-managed-mcp
recipe-version: "1.0.0"
description: >-
  Managed MCP server entry (URL transport) for a
  Hindsight-integrated provider.
parameters:
  - name: PROVIDER
    required: true
  - name: OWNERSHIP_SCOPE
    required: true
  - name: MCP_URL
    required: true
  - name: AUTH
    default: ""
  - name: BANK_ID
    default: ""
lifecycle:
  install-steps:
    - type: managed-mcp
      id: entry
      provider: "{PROVIDER}"
      managed-id: ag-hindsight
      ownership-scope: "{OWNERSHIP_SCOPE}"
      name: hindsight
      url: "{MCP_URL}"
      transport: http
      headers:
        Authorization: "{AUTH}"
        X-Bank-Id: "{BANK_ID}"
  uninstall-steps:
    - type: managed-mcp
      id: prune-entry
      provider: "{PROVIDER}"
      managed-id: ag-hindsight
      ownership-scope: "{OWNERSHIP_SCOPE}"
      name: hindsight
      url: "{MCP_URL}"
      transport: http
      mode: prune
