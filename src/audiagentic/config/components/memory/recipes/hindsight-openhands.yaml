# Hindsight integration for OpenHands.
#
# Installs MCP server in .openhands/config.toml and adds
# a memory-use rule via generated-surfaces (AGENTS.md).
recipe-id: hindsight-openhands
recipe-version: "1.0.0"
description: >-
  Managed MCP entry + AGENTS.md rule for Hindsight memory.
parameters:
  - name: PROVIDER
    required: true
  - name: OWNERSHIP_SCOPE
    required: true
  - name: MCP_URL
    required: true
  - name: AUTH
    default: ""
  - name: BANK_ID
    default: ""
lifecycle:
  install-steps:
    - type: managed-mcp
      id: mcp
      provider: "{PROVIDER}"
      managed-id: ag-hindsight
      ownership-scope: "{OWNERSHIP_SCOPE}"
      name: hindsight
      url: "{MCP_URL}"
      transport: http
      headers:
        Authorization: "{AUTH}"
        X-Bank-Id: "{BANK_ID}"
  configure-steps:
    - type: generated-surfaces
      id: surfaces
      provider: "{PROVIDER}"
      ownership-scope: "{OWNERSHIP_SCOPE}"
      mode: apply
  uninstall-steps:
    - type: generated-surfaces
      id: prune-surfaces
      provider: "{PROVIDER}"
      ownership-scope: "{OWNERSHIP_SCOPE}"
      mode: prune
    - type: managed-mcp
      id: prune-mcp
      provider: "{PROVIDER}"
      managed-id: ag-hindsight
      ownership-scope: "{OWNERSHIP_SCOPE}"
      name: hindsight
      url: "{MCP_URL}"
      transport: http
      mode: prune
