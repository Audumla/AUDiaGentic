# Hindsight-owned artifacts for the Codex harness.
#
# Replaces the official `curl … | bash` installer, which cannot configure a
# remote/cloud endpoint without a TTY. This recipe fetches the same hook scripts
# the installer does and writes ~/.hindsight/codex.json directly, so both local
# and remote/cloud backends provision non-interactively. The codex hook *entries*
# (into ~/.codex) are owned separately by the provider managed-hooks family.
recipe-id: hindsight-codex
recipe-version: "1.0.0"
description: Fetch Hindsight Codex hook scripts and write the Hindsight-owned codex.json.
parameters:
  - name: URL
    required: true
  - name: BANK_ID
    default: codex
  - name: TOKEN
    default: ""
    sensitive: true
lifecycle:
  install-steps:
    - type: download
      id: fetch-codex-scripts
      base-url: https://raw.githubusercontent.com/vectorize-io/hindsight/main/hindsight-integrations/codex
      dest-dir: ~/.hindsight/codex
      files:
        - scripts/session_start.py
        - scripts/recall.py
        - scripts/retain.py
        - scripts/lib/__init__.py
        - scripts/lib/bank.py
        - scripts/lib/client.py
        - scripts/lib/config.py
        - scripts/lib/content.py
        - scripts/lib/daemon.py
        - scripts/lib/llm.py
        - scripts/lib/state.py
      optional-files:
        - settings.json
      timeout: 30
  configure-steps:
    - type: config-set
      id: set-api-url
      path: ~/.hindsight/codex.json
      key-path: [hindsightApiUrl]
      value: "{URL}"
    - type: config-set
      id: set-bank-id
      path: ~/.hindsight/codex.json
      key-path: [bankId]
      value: "{BANK_ID}"
    - type: config-set
      id: set-api-token
      path: ~/.hindsight/codex.json
      key-path: [hindsightApiToken]
      value: "{TOKEN}"
  uninstall-steps:
    - type: config-remove
      id: unset-api-url
      path: ~/.hindsight/codex.json
      key-path: [hindsightApiUrl]
    - type: config-remove
      id: unset-bank-id
      path: ~/.hindsight/codex.json
      key-path: [bankId]
    - type: config-remove
      id: unset-api-token
      path: ~/.hindsight/codex.json
      key-path: [hindsightApiToken]
