# Hindsight integration for Roo Code.
#
# Installs MCP server in .roo/mcp.json and adds
# a memory-use rule via generated-surfaces.
recipe-id: hindsight-roo
recipe-version: "1.0.0"
description: >-
  Managed MCP entry + Roo rule for Hindsight memory.
parameters:
  - name: PROVIDER
    required: true
  - name: OWNERSHIP_SCOPE
    required: true
  - name: MCP_URL
    required: true
  - name: AUTH
    default: ""
  - name: BANK_ID
    default: ""
lifecycle:
  install-steps:
    - type: managed-mcp
      id: mcp
      provider: "{PROVIDER}"
      managed-id: ag-hindsight
      ownership-scope: "{OWNERSHIP_SCOPE}"
      name: hindsight
      url: "{MCP_URL}"
      transport: http
      headers:
        Authorization: "{AUTH}"
        X-Bank-Id: "{BANK_ID}"
  configure-steps:
    - type: generated-surfaces
      id: surfaces
      provider: "{PROVIDER}"
      ownership-scope: "{OWNERSHIP_SCOPE}"
      mode: apply
  uninstall-steps:
    - type: generated-surfaces
      id: prune-surfaces
      provider: "{PROVIDER}"
      ownership-scope: "{OWNERSHIP_SCOPE}"
      mode: prune
    - type: managed-mcp
      id: prune-mcp
      provider: "{PROVIDER}"
      managed-id: ag-hindsight
      ownership-scope: "{OWNERSHIP_SCOPE}"
      name: hindsight
      url: "{MCP_URL}"
      transport: http
      mode: prune
