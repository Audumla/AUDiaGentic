      No official Hindsight integration for Local OpenAI. Could connect via
      generic MCP server (hindsight-local-mcp) if the client supports MCP.

  - provider_id: pi
    display_name: Pi
    integration_type: extension
    recipe_kind: hooks
    # Community source remains unverified. Do not retain executable commands
    # until MA02 can submit this as a provider-owned declared capability.
    install_steps: []
    uninstall_steps: []
    status_command: ""
    config_artifacts:
      - ~/.hindsight/config.json
      - pi package npm:@walodayeet/hindsight-pi
    platform_constraints:
      - darwin
      - linux
      - win
    scope: global
    audia_action: manage_config_writes
    source_url: https://github.com/walodayeet/hindsight-pi
    source_date: "2026-07-09"
    source_status: unconfirmed
    notes: >-
      Community Hindsight extension for pi. Installs with
      `pi install npm:@walodayeet/hindsight-pi`; runtime commands include
      /hindsight:setup, /hindsight:doctor, /hindsight:status, and explicit
      tools hindsight_search, hindsight_context, hindsight_retain, and
      hindsight_bank_profile. Config is read from ~/.hindsight/config.json
      or ~/.hindsight/config.toml with project-local overrides under
      <repo>/.hindsight/config.json|toml.

