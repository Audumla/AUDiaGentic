# Hindsight provider recipe matrix — source-backed integration data
#
# This file is the authoritative matrix for Hindsight integration recipes
# across AUDiaGentic providers. Each row captures provider-specific
# integration facts. Edit this file to add/remove/update providers.
#
# Fields:
#   provider_id        unique provider identifier
#   display_name       human-readable name
#   integration_type   descriptive label (hooks, plugin, mcp, wrapper, etc.)
#   recipe_kind        one of: hooks, plugin_config, mcp_config, wrapper_cli,
#                      hybrid, guidance_only, command_installer, rules,
#                      context_provider, native_passthrough
#   install_steps      list of ProvisionStep definitions (type, id, command, ...)
#   uninstall_steps    list of ProvisionStep definitions
#   configure_steps    list of ProvisionStep definitions
#   status_command     command to check integration status (empty if unknown)
#   config_artifacts   list of config files/artifacts created
#   platform_constraints: canonical platform keys (darwin, linux, win)
#   scope              project-local | global | both
#   source_status      verified | unconfirmed | blocked | no_hindsight
#   audia_action       call_official_installer | manage_config_writes |
#                      action_needed | no_source
#   source_url         official documentation URL
#   source_date        date source was checked (ISO format)
#   notes              additional context or blockers
#
# Step types: shell, config-set, managed-block, write-file
# Shell steps with pipes use "shell: true" and a full command string.
# &&-chained commands are split into separate shell step entries.

matrix:
  - provider_id: codex
    display_name: Codex
    integration_type: hooks
    recipe_kind: hooks
    install_steps:
      - type: shell
        id: codex-install
        command: curl -fsSL https://hindsight.vectorize.io/get-codex | bash -s -- --mode local
        shell: true
    uninstall_steps:
      - type: shell
        id: codex-uninstall
        command: curl -fsSL https://hindsight.vectorize.io/get-codex | bash -s -- --uninstall
        shell: true
    status_command: ""
    config_artifacts:
      - ~/.hindsight/codex.json
      - ~/.hindsight/codex/settings.json
      - ~/.hindsight/codex/scripts/
      - ~/.codex/hooks.json
      - ~/.codex/config.toml [features].codex_hooks
    platform_constraints:
      - darwin
      - linux
      - win
    scope: global
    audia_action: manage_config_writes
    source_url: https://hindsight.vectorize.io/sdks/integrations/codex
    source_date: "2026-07-09"
    source_status: verified
    notes: >-
      Three Python lifecycle hooks: session_start.py (SessionStart),
      recall.py (UserPromptSubmit), retain.py (Stop). Installer places hooks
      under ~/.hindsight/codex/scripts/, writes ~/.codex/hooks.json, enables
      [features].codex_hooks in ~/.codex/config.toml, and reads connection
      settings from ~/.hindsight/codex.json. Pure Python stdlib.

  - provider_id: claude
    display_name: Claude Code
    integration_type: plugin
    recipe_kind: plugin_config
    install_steps:
      - type: shell
        id: claude-marketplace
        command:
          - claude
          - plugin
          - marketplace
          - add
          - vectorize-io/hindsight
      - type: shell
        id: claude-install-plugin
        command:
          - claude
          - plugin
          - install
          - hindsight-memory
    uninstall_steps:
      - type: shell
        id: claude-uninstall
        command:
          - claude
          - plugin
          - uninstall
          - hindsight-memory
    status_command: ""
    config_artifacts:
      - ~/.hindsight/claude-code.json
      - ${CLAUDE_PLUGIN_DATA}/venv
      - ~/.hindsight/profiles/claude-code.log
    platform_constraints:
      - darwin
      - linux
      - win
    scope: global
    audia_action: call_official_installer
    source_url: https://hindsight.vectorize.io/sdks/integrations/claude-code
    source_date: "2026-06-26"
    source_status: verified
    plugin_url_config_path: "~/.hindsight/claude-code.json"
    plugin_repair_cache_pattern: "~/.claude/plugins/cache/hindsight/hindsight-memory/*/.mcp.json"
    plugin_repair_data_dir: "${APPDATA}/Claude/plugins/data/hindsight-memory"
    plugin_repair_venv_python: "venv/Scripts/python.exe"
    plugin_repair_server_script: "scripts/mcp_server.py"
    notes: >-
      Plugin combines lifecycle hooks (session_start.py, recall.py, retain.py,
      session_end.py) + MCP server (mcp_server.py with agent_knowledge_* tools)
      + skill (create-agent). Config in ~/.hindsight/.

  - provider_id: cline
    display_name: Cline
    integration_type: hooks
    recipe_kind: hooks
    install_steps:
      - type: shell
        id: cline-pip-install
        command:
          - pip
          - install
          - hindsight-cline
      - type: shell
        id: cline-init
        command:
          - hindsight-cline
          - install
          - "--api-url={URL}"
          - "--api-token={KEY}"
          - "--bank-id={ID}"
    uninstall_steps:
      - type: shell
        id: cline-uninstall
        command:
          - hindsight-cline
          - uninstall
    status_command: ""
    config_artifacts:
      - ~/.hindsight/cline.json
      - settings.json
    platform_constraints:
      - darwin
      - linux
    scope: both
    audia_action: call_official_installer
    source_url: https://hindsight.vectorize.io/sdks/integrations/cline
    source_date: "2026-06-26"
    source_status: verified
    notes: >-
      macOS/Linux only (no Windows). Requires Python 3. Lifecycle hooks for
      TaskStart, UserPromptSubmit, TaskComplete, TaskCancel. --global flag
      for all-project install or per-project.

  - provider_id: copilot
    display_name: GitHub Copilot
    integration_type: mcp+rules
    recipe_kind: hybrid
    install_steps:
      - type: shell
        id: copilot-pip-install
        command:
          - pip
          - install
          - hindsight-copilot
      - type: shell
        id: copilot-init
        command:
          - hindsight-copilot
          - init
          - "--api-token={TOKEN}"
          - "--bank-id={ID}"
    uninstall_steps:
      - type: shell
        id: copilot-uninstall
        command:
          - hindsight-copilot
          - uninstall
    status_command: hindsight-copilot status
    config_artifacts:
      - ./.vscode/mcp.json
      - ./.github/copilot-instructions.md
    platform_constraints:
      - darwin
      - linux
      - win
    scope: project-local
    audia_action: call_official_installer
    source_url: https://hindsight.vectorize.io/sdks/integrations/github-copilot
    source_date: "2026-06-26"
    source_status: verified
    notes: >-
      VS Code MCP server config (.vscode/mcp.json with HTTP server) +
      Copilot instructions rule (.github/copilot-instructions.md).
      Project-local scope.

  - provider_id: opencode
    display_name: OpenCode
    integration_type: plugin
    recipe_kind: plugin_config
    install_steps: []
    uninstall_steps: []
    plugin_array_package: "@vectorize-io/opencode-hindsight"
    status_command: ""
    config_artifacts:
      - opencode.json (plugin array entry)
    platform_constraints:
      - darwin
      - linux
      - win
    scope: both
    audia_action: manage_config_writes
    source_url: https://hindsight.vectorize.io/sdks/integrations/opencode
    source_date: "2026-07-01"
    source_status: verified
    notes: >-
      OpenCode auto-installs plugins in the "plugin" array on startup — no npm install required.
      HINDSIGHT_API_URL and HINDSIGHT_API_TOKEN env vars can be set externally; config file
      provides persistent defaults. Env vars unreliable on Windows for plugin runtime.

  - provider_id: openhands
    display_name: OpenHands
    integration_type: mcp+rules
    recipe_kind: mcp_config
    install_steps:
      - type: shell
        id: openhands-pip-install
        command:
          - pip
          - install
          - hindsight-openhands
      - type: shell
        id: openhands-init
        command:
          - hindsight-openhands
          - init
          - "--api-token={TOKEN}"
          - "--bank-id={ID}"
    uninstall_steps:
      - type: shell
        id: openhands-uninstall
        command:
          - hindsight-openhands
          - uninstall
    status_command: hindsight-openhands status
    config_artifacts:
      - ./config.toml (MCP server entry under [mcp])
      - ./AGENTS.md (recall/retain rule)
    platform_constraints:
      - darwin
      - linux
      - win
    scope: project-local
    audia_action: call_official_installer
    source_url: https://hindsight.vectorize.io/sdks/integrations/openhands
    source_date: "2026-07-01"
    source_status: verified
    notes: >-
      Official integration confirmed. TOML writer now available in openhands adapter.
      MCP config + rule block strategy via generic McpConfigSpec seam.

  - provider_id: roo
    display_name: Roo Code
    integration_type: mcp+rules
    recipe_kind: hybrid
    install_steps:
      - type: shell
        id: roo-pip-install
        command:
          - pip
          - install
          - hindsight-roo-code
      - type: shell
        id: roo-init
        command:
          - hindsight-roo-code
          - install
          - "--api-url={URL}"
          - "--api-token={KEY}"
          - "--bank-id={ID}"
    uninstall_steps: []
    status_command: ""
    config_artifacts:
      - .roo/mcp.json
      - .roo/rules/hindsight-memory.md
    platform_constraints:
      - darwin
      - linux
      - win
    scope: both
    audia_action: call_official_installer
    source_url: https://hindsight.vectorize.io/sdks/integrations/roo-code
    source_date: "2026-06-26"
    source_status: verified
    notes: >-
      MCP server config + custom rules (system-prompt injection via .roo/rules/).
      Project-local (.roo/) or global (~/.roo/) with --global flag.

  - provider_id: continue
    display_name: Continue
    integration_type: context+mcp+rules
    recipe_kind: hybrid
    install_steps:
      - type: shell
        id: continue-pip-install
        command:
          - pip
          - install
          - hindsight-continue
    uninstall_steps: []
    status_command: ""
    config_artifacts:
      - config.yaml (HTTP context provider entry for Continue)
    platform_constraints:
      - darwin
      - linux
      - win
    scope: project-local
    audia_action: call_official_installer
    source_url: https://hindsight.vectorize.io/sdks/integrations/continue
    source_date: "2026-07-01"
    source_status: verified
    notes: >-
      pip install hindsight-continue then run adapter server (hindsight-continue).
      Register in Continue's config.yaml as HTTP context provider on 127.0.0.1:8123.
      MCP + rules optional for automatic recall/retain in agent mode.

  - provider_id: aider
    display_name: Aider
    integration_type: wrapper
    recipe_kind: wrapper_cli
    install_steps:
      - type: shell
        id: aider-pip-install
        command:
          - pip
          - install
          - hindsight-aider
          - aider-chat
    uninstall_steps:
      - type: shell
        id: aider-uninstall
        command:
          - pip
          - uninstall
          - hindsight-aider
    status_command: ""
    config_artifacts:
      - .aider.hindsight-memory.md (recalled memory file, passed via --read)
    platform_constraints:
      - darwin
      - linux
      - win
    scope: project-local
    audia_action: call_official_installer
    source_url: https://hindsight.vectorize.io/sdks/integrations/aider
    source_date: "2026-06-26"
    source_status: verified
    notes: >-
      Drop-in wrapper CLI: hindsight-aider wraps aider, writes recalled context
      to read-only file before launch, reads chat-history file after exit for
      retain. Scoped per git repo.

  - provider_id: gemini
    display_name: Gemini (Spark)
    integration_type: mcp
    recipe_kind: mcp_config
    install_steps: []
    uninstall_steps: []
    configure_steps:
      - type: write-file
        id: gemini-mcp-config
        path: "~/.gemini/antigravity/mcp_config.json"
        content: |
          {
            "mcpServers": {
              "hindsight": {
                "type": "http",
                "url": "{MCP_URL}"
              }
            }
          }
    status_command: ""
    config_artifacts:
      - antigravity.yaml (hosted agent manifest)
      - ~/.gemini/antigravity/mcp_config.json (desktop/IDE config)
    platform_constraints:
      - darwin
      - linux
      - win
    scope: global
    audia_action: manage_config_writes
    source_url: https://hindsight.vectorize.io/sdks/integrations/gemini-spark
    source_date: "2026-07-01"
    source_status: verified
    notes: >-
      Cloud-based agent; Spark's built-in MCP support via OAuth 2.1.
      No hook-based auto-recall/retain — agent calls tools when planner
      judges useful. Self-hosted requires Cloudflare OAuth proxy + tunnel.

  - provider_id: goose
    display_name: Goose
    integration_type: none
    recipe_kind: guidance_only
    install_steps: []
    uninstall_steps: []
    status_command: ""
    config_artifacts: []
    platform_constraints:
      - darwin
      - linux
      - win
    scope: project-local
    audia_action: no_source
    source_url: ""
    source_date: "2026-06-26"
    source_status: no_hindsight
