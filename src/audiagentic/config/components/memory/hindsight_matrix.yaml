      MCP server fallback if Goose supports MCP.

  - provider_id: local-openai
    display_name: Local OpenAI
    integration_type: none
    recipe_kind: guidance_only
    install_steps: []
    uninstall_steps: []
    status_command: ""
    config_artifacts: []
    platform_constraints:
      - darwin
      - linux
      - win
    scope: project-local
    audia_action: no_source
    source_url: ""
    source_date: "2026-06-26"
    source_status: no_hindsight
