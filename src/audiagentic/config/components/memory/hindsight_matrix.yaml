      - Linux
      - Windows
    scope: both
    audia_action: call_official_installer
    source_url: https://hindsight.vectorize.io/sdks/integrations/windsurf
    source_date: "2026-06-26"
    source_status: verified
    notes: >-
      MCP config is global (~/.codeium/windsurf/), rules are project-local
      (.windsurf/rules/ with always-on trigger).

  - provider_id: cursor
    display_name: Cursor
    integration_type: mcp+hooks+plugin
