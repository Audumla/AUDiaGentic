type: implementation
contract-version: v1
parent: memory
id: hindsight
display-name: Hindsight
default: true
description: >
  Hindsight long-term memory backend. Provides recall, reflect, and retain
  operations via the Hindsight MCP server. Memory core stores backend connection
  config; Hindsight-specific harness setup is contained in the Hindsight
  implementation package and uses generic provider seams.

options-schema:
  base-url:
    type: string
    required: true
    description: Hindsight server base URL (e.g. https://hindsight.example.com)
  api-key:
    type: string
    required: false
    description: API key for Hindsight authentication
  bank-id:
    type: string
    required: false
    description: Hindsight bank identifier (X-Bank-Id header)
  timeout-seconds:
    type: integer
    default: 30
    min: 1
    max: 120
    description: Request timeout in seconds
  transport:
    type: enum
    default: http
    values:
      - http
      - sse
      - stdio
    description: MCP transport mode
