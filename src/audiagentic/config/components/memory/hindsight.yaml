type: implementation
contract-version: v1
parent: memory
id: hindsight
display-name: Hindsight
default: true
description: >
  Hindsight long-term memory backend. Provides recall, reflect, and retain
  operations via the Hindsight MCP server. Memory core stores backend connection
  config; Hindsight-specific harness setup is contained in the Hindsight
  implementation package and uses generic provider seams.

options-schema:
  host:
    type: string
    required: true
    description: Hindsight server host or IP (e.g. 10.10.100.10 or hindsight.example.com)
  port:
    type: integer
    default: 8888
    min: 1
    max: 65535
    description: Hindsight server port (defaults to 8888)
  scheme:
    type: enum
    default: http
    values:
      - http
      - https
    description: URL scheme (defaults to http)
  api-key:
    type: string
    required: false
    description: API key for Hindsight authentication
  bank-id:
    type: string
    required: false
    description: Hindsight bank identifier (X-Bank-Id header)
  timeout-seconds:
    type: integer
    default: 30
    min: 1
    max: 120
    description: Request timeout in seconds
  transport:
    type: enum
    default: http
    values:
      - http
      - sse
      - stdio
    description: MCP transport mode
