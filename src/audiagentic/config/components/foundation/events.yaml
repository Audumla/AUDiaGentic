# Lifecycle component events
lifecycle.component.installed:
  description: "Component installed (descriptor added to project)"
  payload-required: ["component_id", "project_root"]
  payload-optional: []
  metadata-keys: []
  delivery: sync
  since: v1.0.0

lifecycle.component.uninstalled:
  description: "Component uninstalled (descriptor removed from project)"
  payload-required: ["component_id", "project_root"]
  payload-optional: []
  metadata-keys: []
  delivery: sync
  since: v1.0.0

lifecycle.component.enabled:
  description: "Component enabled in project config"
  payload-required: ["component_id", "project_root"]
  payload-optional: []
  metadata-keys: []
  delivery: sync
  since: v1.0.0

lifecycle.component.disabled:
  description: "Component disabled in project config"
  payload-required: ["component_id", "project_root"]
  payload-optional: []
  metadata-keys: []
  delivery: sync
  since: v1.0.0

# Interaction events — ask/respond/status flows
interaction.requested:
  description: "Interaction request persisted (pending operator response)"
  payload-required: ["request_id", "kind", "title"]
  payload-optional: ["description", "choices", "ttl_seconds"]
  metadata-keys: []
  delivery: sync
  since: v1.0.0

interaction.answered:
  description: "Operator responded to a persisted interaction request"
  payload-required: ["request_id", "kind", "answer"]
  payload-optional: []
  metadata-keys: []
  delivery: sync
  since: v1.0.0

interaction.status:
  description: "One-way status push to operator surface"
  payload-required: ["component", "level", "message"]
  payload-optional: ["details"]
  metadata-keys: []
  delivery: sync
  since: v1.0.0

lifecycle.component.config_changed:
  description: "Component configuration changed (triggers reconciliation observers)"
  payload-required: ["component_id", "project_root"]
  payload-optional: []
  metadata-keys: []
  delivery: async
  since: v1.0.0
