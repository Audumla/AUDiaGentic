EXT-GIT-001: "git is not installed or could not be started. Install git and make sure it is on PATH."
EXT-GIT-002: "A read-only git query failed. Read the stderr in the error details; typical causes are a path that is not a git repository or git refusing a repository owned by another user (safe.directory)."
EXT-GIT-003: "A git query timed out. Check the repository for a stuck process or a very slow filesystem, then retry."
EXT-GIT-005: "The remote answered a ref query with records or an object id this code does not understand. Check the remote (a proxy or an unusual git server may be altering the answer) and retry."
EXT-FORGE-001: "The gh CLI is not installed or could not be started. Install it and make sure it is on PATH, then retry; worktree cleanup refuses without pull-request proof."
EXT-FORGE-002: "gh could not read from the forge (pull requests or repository details). Read the stderr in the error details; typical causes are no GitHub login (gh auth status), no network, or a repository without a GitHub remote."
EXT-FORGE-003: "gh timed out listing pull requests. Check the network and retry."
EXT-FORGE-004: "gh returned a pull request listing this code cannot read. Update audiagentic and gh, then retry."
EXT-FORGE-005: "gh returned a full page of pull requests, so the listing may be incomplete and proves nothing. Close or archive old pull requests for that branch name, or use a different branch name."
