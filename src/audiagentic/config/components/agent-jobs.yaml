type: component
contract-version: v1
id: agent-jobs
display-name: Agent Jobs
description: Execution/jobs layer — job records and session artifacts.
lifecycle-observer: audiagentic.components.agent_jobs.event_observer
depends-on:
  - project
  - agents
feature-kinds:
  - action
files:
  - path: .audiagentic/runtime/jobs
    lifecycle: runtime-only
    recursive: true
    description: Job records and artifacts
  - path: .audiagentic/runtime/sessions
    lifecycle: runtime-only
    recursive: true
    description: Agent session input and review state
contributions:
  - id: agent-jobs/overview
    owner: agent-jobs
    title: AUDiaGentic agent instructions
    preferred-targets:
      - instruction
    content:
      body: |
        This repository uses AUDiaGentic workflow jobs. The instruction blocks below
        are generated from component sources — do not edit them directly; edit the
        owning component config and re-run surface apply.
