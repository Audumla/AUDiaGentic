type: component
contract-version: v1
id: release
display-name: Release
description: Release management — versioning, changelog rendering, and release manager tooling
depends-on:
  - project
  - agent-ledger
files:
  - path: .github/workflows/release.yml
    lifecycle: required-managed
    description: Release workflow
mcp-servers:
  - name: ag-release-mgmt
    module: audiagentic.components.release.release_mcp
    direct-tools: [get_release_status, ensure_release_baseline]
    description: Release component management
    propagate: audiagentic
    instructions: >
      Check release status before acting on the release workflow.
    tool-descriptions:
      get_release_status: Return release installation status and active manager state.
      ensure_release_baseline: Ensure the release manager baseline workflow is installed.
  - name: ag-release-please
    module: audiagentic.components.release.release_please.release_please_mcp
    direct-tools: [install_release_please, update_release_please_workflow, finalize_release, dispatch_release_workflow, build_release_artifacts, github_auth, github_auth_poll, clear_github_auth]
    propagate: providers
    description: Release-please release management tools
    instructions: >
      Inspect state (get_release_status) before acting. Run finalize_release only after
      ledger audit review is complete — it archives the ledger and cannot be undone.
      GitHub OAuth is a two-step device flow: call github_auth to get a user-code + URL
      to show the user, then poll github_auth_poll until authenticated (or supply
      GITHUB_TOKEN). build_release_artifacts is the local alternative to
      dispatch_release_workflow (GitHub CI).
    tool-descriptions:
      install_release_please: Install release-please into the target project.
      update_release_please_workflow: Re-render the release workflow from the current template.
      finalize_release: Archive current ledger and render CHANGELOG.md, RELEASE_NOTES.md, VERSION_HISTORY.md.
      build_release_artifacts: Build release artifacts locally without GitHub CI/CD — archives ledger, renders docs, builds wheel/sdist, and optionally tags/publishes.
      dispatch_release_workflow: Trigger the Release workflow dispatch on GitHub (auto-authenticates via browser if needed).
      github_auth: Start GitHub OAuth device flow (returns user-code + URL) or report auth status.
      github_auth_poll: Poll once for completion of the device flow started by github_auth.
      clear_github_auth: Remove stored GitHub token.

contributions:
  - id: release/doctrine
    owner: release
    kind: rule
    title: Release doctrine
    preferred-targets:
      - skill
      - instruction
    content:
      body: |
        Use the configured release manager for versioning and publication.
        Do not edit generated release artifacts (CHANGELOG.md, RELEASE_NOTES.md) directly.
        Run finalize_release only after ledger audit review is complete.
        The ledger is archived as part of finalization — this cannot be undone.
