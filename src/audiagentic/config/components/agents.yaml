type: component
contract-version: v1
id: agents
display-name: Agents
description: >
  Canonical Agent composition, Context, Work, execution admission, and protocol projections.
depends-on:
  - project
implementation-cardinality: exclusive
lifecycle-observer: audiagentic.components.agents.gateway.events
status-hook: audiagentic.components.agents.models.execution_profile_api.agent_status
files:
  - path: .audiagentic/config/agents.yaml
    lifecycle: create-if-missing
    description: Canonical per-project Agent, Role, Prompt, Profile, and Trigger configuration
  - path: .audiagentic/runtime/agent-execution-gateway
    lifecycle: runtime-only
    recursive: true
    description: Agent Execution Gateway request/result records
mcp-servers:
  - name: ag-agents-runtime
    module: audiagentic.components.agents.mcp.runtime_mcp
    direct-tools:
      - agent_context_open
      - agent_context_get
      - agent_context_list
      - agent_context_close
      - agent_work_submit
      - agent_work_submit_packet
      - agent_work_list
      - agent_work_get
      - agent_work_message
      - agent_work_answer
      - agent_work_cancel
      - agent_work_output
      - agent_work_submit_child
      - agent_event_failures_list
      - agent_work_overview
    description: Canonical logical Context/Work runtime operations.
    propagate: audiagentic
    instructions: >
      Operate on logical Agent Context and Work through the GatewayClient
      boundary. Work output remains owned by the gateway execution output
      surface; Context and Work records contain identity, lifecycle, and links.
    tool-descriptions:
      agent_context_open: Open a logical Agent Context.
      agent_context_get: Read one Agent Context.
      agent_context_list: List Agent Contexts.
      agent_context_close: Close an Agent Context.
      agent_work_submit: Submit one Work input in a Context.
      agent_work_submit_packet: Submit/replay one deterministic packet as Work.
      agent_work_list: List Agent Work records.
      agent_work_get: Read one Agent Work record.
      agent_work_message: Append one caller message to Work.
      agent_work_answer: Answer a Foundation interaction and resume Work.
      agent_work_cancel: Cancel Work and linked execution.
      agent_work_output: Project gateway-owned output for Work.
      agent_work_submit_child: Create child Work linked to a parent Work.
      agent_event_failures_list: List redacted canonical event-ingress failures.
      agent_work_overview: Summarize canonical Work states and event-ingress failures.
  - name: ag-agents-config
    module: audiagentic.components.agents.mcp.config_mcp
    direct-tools:
      - agent_config_read
      - agent_config_describe
      - agent_config_apply
      - agent_config_put
      - agent_config_delete
      - agent_config_validate
      - agent_config_get
      - agent_resolve
      - agent_list_execution_profiles
      - agent_get_execution_profile
      - agent_create_execution_profile
      - agent_update_execution_profile
      - agent_delete_execution_profile
      - agent_list_roles
      - agent_get_role
      - agent_create_role
      - agent_update_role
      - agent_delete_role
      - agent_list_definitions
      - agent_get_definition
      - agent_create_definition
      - agent_update_definition
      - agent_delete_definition
    description: Execution profile, role, and agent-definition configuration — CRUD for provider+model bindings, behavioral role definitions, and their composition into logical agents
    propagate: audiagentic
    instructions: >
      CRUD for execution profiles (provider+model bindings), roles (small,
      provider-independent behavioral definitions), and agent definitions
      (a stable ID composing one execution profile and one role, plus
      optional advertised skills and internal/acp/a2a publication flags). A
      profile, role, or agent definition's id is immutable — delete and
      recreate to rename. Roles carry no provider/model selection, session
      surface, queue, or runtime tool/MCP/permission configuration; those
      stay owned by execution profiles and the harness's existing
      configuration. Publication flags are authorization/visibility metadata
      only — they do not install MCP servers, grant management MCP access,
      alter harness runtime tools, or imply a selected session surface
      supports ACP/A2A.
    tool-descriptions:
      agent_config_read: Read the canonical Agents configuration document.
      agent_config_describe: Describe the canonical Agents configuration contract and digest.
      agent_config_apply: Replace the canonical Agents configuration with an expected-digest guard.
      agent_config_put: Create or update one canonical Agents configuration item.
      agent_config_delete: Delete one canonical Agents configuration item.
      agent_config_validate: Validate the canonical Agents configuration document.
      agent_config_get: Read one canonical Agents configuration item by kind and id.
      agent_resolve: Resolve one Agent Definition into its execution profile and role.
      agent_list_execution_profiles: List all execution profiles with summary information.
      agent_get_execution_profile:
        description: >
          Get a single execution profile by ID, returning full configuration including
          provider_id, model_id, model_alias, params, surface_id (AS29 session surface
          this profile launches through -- absent means provider default), and
          is-default flag.
        parameters:
          profile_id: "Execution profile identifier to look up"
      agent_create_execution_profile:
        description: >
          Create a new execution profile binding a provider to a specific model with optional
          execution parameters. Returns the created profile.
        parameters:
          profile: "Profile dict with provider_id, model_id, and optional params/is-default"
      agent_update_execution_profile:
        description: >
          Update fields of an existing execution profile by ID. Profile id is immutable —
          delete and recreate to rename. Returns the updated profile.
        parameters:
          profile_id: "Profile identifier to update"
          updates: "Partial profile dict — only specified keys are modified"
      agent_delete_execution_profile:
        description: Delete an execution profile by ID.
        parameters:
          profile_id: "Profile identifier to delete"
      agent_list_roles: List all roles with summary information.
      agent_get_role:
        description: >
          Get a single role by ID, returning instructions, required_capabilities,
          output_guidance, and runtime_tool_policy_ref (inert placeholder).
        parameters:
          role_id: "Role identifier to look up"
      agent_create_role:
        description: >
          Create a new role with instructions and optional required capabilities.
          Returns the created role.
        parameters:
          role: "Role dict with role_id, instructions, and optional required_capabilities/output_guidance"
      agent_update_role:
        description: >
          Update fields of an existing role by ID. Role id is immutable —
          delete and recreate to rename. Returns the updated role.
        parameters:
          role_id: "Role identifier to update"
          updates: "Partial role dict — only specified keys are modified"
      agent_delete_role:
        description: Delete a role by ID.
        parameters:
          role_id: "Role identifier to delete"
      agent_list_definitions: List all agent definitions with summary information.
      agent_get_definition:
        description: >
          Get a single agent definition by ID, returning execution_profile_id,
          role_id, advertised_skills, and publication flags (internal/acp/a2a).
        parameters:
          agent_id: "Agent definition identifier to look up"
      agent_create_definition:
        description: >
          Create a new agent definition composing one execution profile and one
          role. Returns the created definition. Does not validate that the
          referenced execution_profile_id/role_id exist yet.
        parameters:
          definition: "Definition dict with agent_id, name, execution_profile_id, role_id"
      agent_update_definition:
        description: >
          Update fields of an existing agent definition by ID, including
          re-pointing it to a different execution_profile_id or role_id while
          keeping its stable public ID. Returns the updated definition.
        parameters:
          agent_id: "Agent definition identifier to update"
          updates: "Partial definition dict — only specified keys are modified"
      agent_delete_definition:
        description: Delete an agent definition by ID.
        parameters:
          agent_id: "Agent definition identifier to delete"
  - name: ag-agents-admin
    module: audiagentic.components.agents.mcp.admin_mcp
    direct-tools:
      - agent_gateway_status
      - agent_gateway_health
      - agent_gateway_list_implementations
      - agent_gateway_select_implementation
      - agent_gateway_get_config
      - agent_gateway_set_config
      - agent_gateway_restart
      - agent_gateway_create_operation
      - agent_gateway_get_operation
      - agent_gateway_list_operations
      - agent_gateway_get_retention_policy
    description: Privileged gateway administration and lifecycle configuration.
    propagate: none
    tool-descriptions:
      agent_gateway_status: Active gateway management implementation and status.
      agent_gateway_health: Read the gateway health and readiness state.
      agent_gateway_list_implementations: List available gateway implementations.
      agent_gateway_select_implementation: Select the project gateway implementation.
      agent_gateway_get_config: Read gateway implementation configuration.
      agent_gateway_set_config: Update validated gateway implementation configuration.
      agent_gateway_restart: Restart the managed gateway service when explicitly authorized.
      agent_gateway_create_operation: Create bounded provider-neutral gateway administration work.
      agent_gateway_get_operation: Read bounded gateway administration work status.
      agent_gateway_list_operations: List bounded gateway administration work.
      agent_gateway_get_retention_policy: Read the redacted gateway retention policy.
  - name: ag-agents-gateway
    module: audiagentic.components.agents.mcp.gateway_mcp
    direct-tools:
      - agent_task_list_definitions
      - agent_task_submit
      - agent_task_status
      - agent_task_response
      - agent_task_cancel
      - agent_task_list_requests
      - agent_task_gateway_overview
      - agent_task_session_list
      - agent_task_session_close
      - agent_task_session_control
      - agent_task_session_resume
    description: >
      Agent Execution Gateway — read-only agent-definition discovery,
      agent_id-primary submission (AS63) plus status/cancel,
      observability (list/overview), and session management
    propagate: providers
    instructions: >
      agent_task_submit is the sole submission surface (RV891) — pass an
      agent_id (an Agent Definition: an execution profile plus a role bundled
      under one stable ID) and it resolves the profile for you. Direct
      execution_profile_id submission bypassing Agent Definition resolution
      is available programmatically (AgentTaskFactory.submit_raw /
      submit_execution_request) but not exposed over MCP — MCP is a
      deliberately restrictive layer over the fuller Python API.
      Submit returns a structured response with request-id, state, session-id
      (auto-generated when session_keep_alive is true without a provided
      session_id), and metadata. The runtime owns session ID generation —
      the caller never invents one; it only references session-ids from
      previous responses to continue a conversation.
      agent_task_status/cancel/list_requests/gateway_overview/
      session_list/session_close/session_control/session_resume work identically regardless of which
      execution profile a request resolved through.
      Async-only over MCP: submit returns request-id immediately; poll
      agent_task_status until the request reaches a terminal state. A blocking
      submit-and-wait-in-one-call exists only at the
      underlying Python API (submit_execution_request/AgentTaskFactory.submit
      with mode="blocking"), for in-process callers with no such transport
      cap — deliberately not exposed over MCP.
      Cancellation is best-effort: agent_task_cancel on a queued request
      removes it before it ever runs; on a running request it only records
      intent (cancel-requested) — the request may still complete normally,
      and the persisted state reflects what actually happened, not the cancel
      intent. Propagated to providers only; the AUDiaGentic CLI harness must
      not receive the gateway server.
      For most execution profiles, "output" is provider CLI/session execution
      output, not a raw chat completion — only API-style providers (e.g.
      local-openai) return a direct completion. Use agent_task_gateway_overview
      or agent_task_list_requests to see what's happening without already
      knowing a request-id.
    tool-descriptions:
      agent_task_list_definitions: >
        List available agents as a slim, client-facing summary per agent
        (agent_id, name, description, skills) -- the valid agent_id values
        for agent_task_submit. Modeled on the A2A AgentCard shape:
        implementation/harness details (execution profile, role, prompt
        wiring) are deliberately left out.
      agent_task_submit: >
        Submit an async request as agent_id (resolves the agent's execution
        profile automatically). Returns structured response with:
        {request-id, state, session-id, metadata}. When session_keep_alive
        is true and no session_id is provided, a new session is auto-created
        and its id returned. The runtime owns session ID generation — the
        caller never invents one. Poll with agent_task_status using the
        returned request-id. Once the adapter opens a session, the response
        also includes provider-metadata when available. Raises RES-AGD-001
        if agent_id is not a configured agent definition.
      agent_task_status: >
        Return lifecycle/activity status for request-id (state,
        response-artifact, activity, completion, usage, error, attempts).
        Response content and previews are never included in status; use
        agent_task_response for the exact terminal response. Raises
        RES-AGW-001 if not found.
      agent_task_response: >
        Return a bounded response envelope. Small verified terminal responses
        are returned inline as {delivery: inline, text, bytes}. Responses
        larger than gateway.mcp.max-inline-response-bytes return
        {delivery: artifact, response-artifact, artifact-path,
        artifact-path-kind: project-relative}; the exact UTF-8 response is
        already stored at that request-owned path. Never expect an absolute
        filesystem path or a paged MCP result.
      agent_task_cancel: >
        Cancel a queued request, or best-effort mark a running one. See
        instructions for the best-effort semantics.
      agent_task_list_requests: >
        List persisted requests, most recent first. Optional state filter
        (queued/running/completed/failed/cancelled/rejected) and limit.
        Reads from disk, so this works even for requests from an earlier
        process.
      agent_task_gateway_overview: >
        Operator summary: persisted request counts by state, the 5 most recent
        failures (redacted error only), and project-scoped provider capacity
        plus active work. Long-running requests remain non-terminal while
        providers work; watchdog diagnostics are observations, not completion.
      agent_task_session_list: >
        List persisted gateway sessions, newest first. Each entry carries a
        "live" flag: true when this process holds the session's agent process
        (only live sessions can accept new turns).
      agent_task_session_close: >
        Close a live agent session (terminates its agent process). Idempotent —
        an already-closed or orphaned session returns its final record.
      agent_task_session_control:
        description: >
          Issue one closed generic action against a live session. The response
          is an acknowledgement only; it does not claim that a turn stopped or
          a session became terminal. Poll request status for lifecycle truth.
        parameters:
          session_id: "Gateway session identifier"
          action: "cancel-turn, interrupt-turn, respond-permission, or close-session"
          control_id: "Caller idempotency identifier for this control request"
          turn_id: "Optional active turn/request identifier"
          payload: "Closed action-specific payload; no provider-native fields"
      agent_task_session_resume:
        description: >
          Resume a validated provider conversation by durable chat/session id,
          even when the original tab or process is gone. The control id makes
          retries idempotent; a successor session is created and the source
          binding remains immutable. Provider identity is resolved from the
          configured agent execution profile, never from provider-specific
          gateway branches.
        parameters:
          source_session_id: "Terminal source session with a validated provider binding"
          control_id: "Caller idempotency identifier for the resume request"
          identity_context_fingerprint: "Current provider identity context fingerprint"
          execution_context_fingerprint: "Current execution context fingerprint"
          model_id: "Optional current model identifier"

# AS31 Stage-2: output relay policy
# Defaults: disabled until surface is validated; 64KiB fragments, 512KB turns.
gateway:
  output:
    enabled: false
    max-fragment-bytes: 65536
    max-turn-bytes: 524288
  mcp:
    # Keep successful MCP response envelopes small while the artifact
    # delivery boundary is exercised. The complete response is always
    # persisted as the request-owned artifact. Raise per deployment only when
    # inline delivery is deliberately wanted.
    max-inline-response-bytes: 4096

contributions:
  - id: agents/profile-doctrine
    owner: agents
    title: Execution profile doctrine
    preferred-targets:
      - skill
      - instruction
    content:
      body: |
        Execution profiles bind a provider to a specific model with optional
        execution parameters. They are stored in the canonical
        .audiagentic/config/agents.yaml document alongside prompts, roles,
        agent definitions, and triggers.

        ## When to use
        - A job needs a predefined provider+model configuration
        - Execution parameters (temperature, max-tokens) should be
          profile-driven
        - Multiple projects need different default model configurations

        ## Resolution precedence at job launch
        1. Explicit `execution-profile-id` in job request
        2. Explicit provider-id / model-id in job request
        3. Execution profile selected by the Agent Definition
        4. Default execution profile (marked `is-default: true`)

        ## Naming
        Use `execution-profile-id` (NOT `profile-id`) in job requests to avoid
        collision with `workflow-profile` (lite/standard/strict stage
        pipelines).

  - id: agents/role-precedence
    owner: agents
    title: Role selection precedence (AS61/RO01)
    preferred-targets:
      - skill
      - instruction
    content:
      body: |
        Today a Role is reached only through `agent_id` -> Agent Definition ->
        `role_id` (agent_task_submit). There is no standalone `agent-role-id`
        job-request field yet — that wiring belongs to AS78, not this
        component. This section states the precedence/conflict rule that
        MUST hold once one is introduced, so the rule is fixed before the
        field exists rather than improvised after.

        ## Resolution precedence at job launch (once agent-role-id exists)
        1. Explicit `agent-role-id` in job request
        2. Role carried by an explicit `agent-id` (Agent Definition)
        3. Execution profile selection (`execution-profile-id` / provider-id
           + model-id / default execution profile) is independent of role
           selection — they compose, they do not override each other.
        4. `workflow-profile` (lite/standard/strict stage pipelines) and
           `component-profile` (per-process config layer) are orthogonal to
           both and never interact with role/profile precedence.

        ## Conflicts fail closed
        A Role requirement that contradicts an explicitly selected Execution
        Profile is an error raised before dispatch — never a silent override
        in either direction, and never a permissive fallback. This applies
        the moment AS78 exposes a path where the two could disagree; there is
        no such path yet, so no conflict-checking code exists today.

        ## Naming
        `agent-role-id` must stay distinguishable from `execution-profile-id`,
        `workflow-profile`, and `component-profile` — three distinct
        "profile" concepts already exist in this project; a role is a fourth,
        separate axis and must not collapse into any of them by accident.
