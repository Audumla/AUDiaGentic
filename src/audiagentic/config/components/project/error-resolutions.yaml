VAL-PROJFILE-001: "This tool only reads files inside the .audiagentic/ directory. To read the project root, use list_components or project_status instead. To read a specific file, use a relative path starting with .audiagentic/ (e.g. '.audiagentic/config/runtime/features.yaml')."
VAL-PROJFILE-002: "The resolved path escapes the project root — this is a security safeguard. Ensure the path is within the project and does not use '..' to traverse upward."
RES-PROJFILE-001: "The file was not found at the specified path. Verify the path is correct and the file exists."
VAL-PROJFILE-003: "The path points to a directory, not a file. Provide a file path instead."
VAL-PROJFILE-004: "The JSON file could not be parsed. Check for syntax errors in the file."
CON-PROJCOMP-001: "Core components cannot be uninstalled. Only optional components can be removed."
VAL-MCPUSR-001: "The named harness has no user-scope MCP registration. Use one listed with user_scoped true by 'audiagentic harness list', or install per project with 'audiagentic mcp install'."
VAL-MCPONB-001: "Check the canonical MCP and harness IDs using mcp list and harness list. Resolve the reported configuration or ownership conflict before retrying; use dry-run to inspect changes."
RES-MCPONB-001: "No matching installation operation exists in this project. Inspect the latest unresolved operation or submit the intended installation explicitly."
VAL-WTREC-001: "The worktree ownership records are unreadable or have an unknown schema. They are never treated as empty: inspect the file named in the details under the user state directory, restore or remove it, then retry."
VAL-WTREC-002: "A worktree id must look like wt_ followed by 12 lowercase hex characters. Use the id that 'worktree start' printed."
VAL-WTREC-003: "Another ownership record already uses this worktree path or id. List the worktrees, finish or forget the stale record, and retry."
VAL-WTSTART-001: "A worktree slug is 1-48 lowercase letters, digits or hyphens starting with a letter or digit; a plan item id looks like DW01; the owner account must be usable in a branch name. Correct the argument and retry."
VAL-WTSTART-002: "git does not accept the resulting branch name. Choose another slug or change worktrees.branch-prefix in the project settings."
VAL-WTSTART-003: "The remote default branch is not known locally. Fetch the remote or set origin/HEAD (git remote set-head origin -a), then retry."
VAL-WTSTART-004: "The remote default branch could not be fetched, so no worktree was created: starting from a stale base causes conflicts. Check network and credentials, then retry."
CON-WTSTART-001: "A branch with this name already exists. Pick another slug, or finish the existing worktree first (list shows it)."
CON-WTSTART-002: "That worktree path is already in use. Pick another slug, or finish or remove the existing worktree first."
