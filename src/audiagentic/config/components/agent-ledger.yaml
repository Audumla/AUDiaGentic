type: component
contract-version: v1
id: agent-ledger
display-name: Agent Ledger
description: Change ledger — per-event records, audit summaries, and release archiving
lifecycle-observer: audiagentic.components.ledger.ledger_events
paths:
  ledger-runtime: .audiagentic/runtime/ledger
  sync-dir: .audiagentic/runtime/ledger/sync
  lock-file: lock.json
  events-dir: docs/releases/events
  generated-dir: .audiagentic/runtime/ledger/generated
  releases-dir: docs/releases
  current-ledger: CURRENT_RELEASE_LEDGER.ndjson
  historical-ledger: LEDGER.ndjson
  current-summary: CURRENT_RELEASE.md
  audit-summary: AUDIT_SUMMARY.md
  checkin: CHECKIN.md
files:
  - path: .audiagentic/runtime/ledger
    lifecycle: runtime-only
    recursive: true
    description: Ledger locks, projection outbox and generated summaries
  - path: .audiagentic/skills/ag-ledger/skill.md
    lifecycle: required-managed
    description: ag-ledger skill source
mcp-servers:
  - name: ag-ledger
    module: audiagentic.components.ledger.ledger_mcp
    worktree-scoped: true
    direct-tools: [record_change_event, get_current_summary, sync_ledger, get_audit_report]
    description: Record, inspect, sync, and audit release-ledger events
    propagate: providers
    instructions: >
      The ledger is the authoritative release record. Record an event after substantive
      implementation work; each event is its own tracked file, so concurrent branches never conflict; validate with sync_ledger before a release or audit. The worktree argument selects the git worktree (root path); default: the server's.
    tool-descriptions:
      record_change_event: "Record one event or a batch (each becomes its own tracked, write-once file under docs/releases/events). Keys: change-class, files (list), technical-summary, user-summary-candidate, status=unreleased; optional plan-item-ids."
      get_current_summary: Return the current release summary markdown (rendered, not written to a tracked file).
      sync_ledger: Validate every current ledger source and report the pending event count.
      get_audit_report: Regenerate the audit and check-in projections (untracked); return their paths.
  - name: ag-ledger-mgmt
    module: audiagentic.components.ledger.ledger_manage_mcp
    direct-tools: [get_ledger_status]
    description: Ledger component health — installation state and event counts
    propagate: audiagentic
    tool-descriptions:
       get_ledger_status: Return installation state and the recorded and pending event counts.

contributions:
  - id: agent-ledger/process
    owner: agent-ledger
    title: Agent ledger process
    preferred-targets:
      - skill
      - instruction
    content:
      body: |
        After substantive implementation work, record a change event with the ag-ledger
        MCP tool record_change_event — the ledger is the authoritative release record.
        Required fields: change-class, files, technical-summary, user-summary-candidate,
        status ('unreleased'). Other fields are auto-generated.
        - Check release ledger state before changing release notes, changelog fragments, or release workflow files.
        - Keep release artifacts and job records synchronized with implementation and review outcomes.
        - Do not bypass ledger updates by editing generated release outputs only.

        When recording a change event for work associated with one or more plan items,
        include "plan-item-ids" in the event dict (e.g. {"plan-item-ids": ["CC07", "CC08"]}).
        The planning component will automatically link the ledger event ID to those items.
