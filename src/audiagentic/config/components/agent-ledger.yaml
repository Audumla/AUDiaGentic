type: component
contract-version: v1
id: agent-ledger
display-name: Agent Ledger
description: Change ledger — fragment recording, sync, audit summaries, and release archiving
lifecycle-observer: audiagentic.components.ledger.ledger_events
paths:
  ledger-runtime: .audiagentic/runtime/ledger
  sync-dir: .audiagentic/runtime/ledger/sync
  lock-file: lock.json
  manifest-file: manifest.json
  fragments-dir: .audiagentic/runtime/ledger/fragments
  releases-dir: docs/releases
  current-ledger: CURRENT_RELEASE_LEDGER.ndjson
  historical-ledger: LEDGER.ndjson
  current-summary: CURRENT_RELEASE.md
  audit-summary: AUDIT_SUMMARY.md
  checkin: CHECKIN.md
files:
  - path: .audiagentic/runtime/ledger
    lifecycle: runtime-only
    recursive: true
    description: Ledger fragments and sync state
  - path: .audiagentic/skills/ag-ledger/skill.md
    lifecycle: required-managed
    description: ag-ledger skill source
mcp-servers:
  - name: ag-ledger
    module: audiagentic.components.ledger.ledger_mcp
    direct-tools: [record_change_event, get_current_summary, sync_ledger, get_audit_report]
    description: Ledger content tools — record events, summarise, sync, and audit
    propagate: audiagentic,providers
    instructions: >
      Use record_change_event after completing substantive implementation work.
      Use get_current_summary to inspect what has been recorded in the current release.
      Use sync_ledger to merge pending fragments before a release or audit.
      Use get_audit_report to regenerate audit and check-in summaries.
    tool-descriptions:
      record_change_event: >
        Record a change event fragment. Required: change-class, files,
        technical-summary, user-summary-candidate, status ('unreleased').
        change-class: feature, code-fix, refactor, docs, tests, config, release, audit, workflow.
      get_current_summary: Return the current release summary markdown.
      sync_ledger: Merge all pending fragments into the current release ledger.
      get_audit_report: Regenerate and return paths to the audit summary and check-in docs.
  - name: ag-ledger-mgmt
    module: audiagentic.components.ledger.ledger_manage_mcp
    direct-tools: [get_ledger_status]
    description: Ledger component health — installation state and fragment count
    propagate: audiagentic
    instructions: >
      Use get_ledger_status to check installation state, fragment count, and last sync time.
    tool-descriptions:
       get_ledger_status: Return ledger installation state, fragment count, and last sync time.

contributions:
  - id: agent-ledger/process
    owner: agent-ledger
    title: Agent ledger process
    preferred-targets:
      - skill
      - instruction
    content:
      body: |
        After substantive implementation work, record a change event with the ag-ledger
        MCP tool record_change_event — the ledger is the authoritative release record.
        Required fields: change-class, files, technical-summary, user-summary-candidate,
        status ('unreleased'). Other fields are auto-generated.
        - Check release ledger state before changing release notes, changelog fragments, or release workflow files.
        - Keep release artifacts and job records synchronized with implementation and review outcomes.
        - Do not bypass ledger updates by editing generated release outputs only.
