type: component
contract-version: v1
id: agent-planning
display-name: Agent Planning
description: >
  Plan item management — track multi-step implementation work across sessions.
  Implementations may back this with local markdown files, a hosted issue tracker,
  or any other planning store; only one is active at a time.
implementation-cardinality: exclusive
status-hook: audiagentic.components.planning.planning_api.planning_status

mcp-servers:
  - name: ag-planning-mgmt
    module: audiagentic.components.planning.planning_manage_mcp
    direct-tools:
      - planning_status
      - planning_list_implementations
      - planning_select_implementation
    description: Planning component management — status and implementation selection
    propagate: audiagentic
    instructions: >
      Inspect or switch the active planning implementation and check current item counts.

  - name: ag-planning
    module: audiagentic.components.planning.planning_mcp
    direct-tools:
      - plan_create_item
      - plan_list_standards
      - plan_list_groups
      - plan_list_items
      - plan_get_item
      - plan_set_state
      - plan_update_item
      - plan_delete_item
      - plan_create_review
      - plan_list_reviews
      - plan_get_review
      - plan_set_review_state
      - plan_update_review
      - plan_delete_review
    description: Plan item management — create, list, update, transition, and remove items; create and manage reviews
    propagate: providers
    instructions: >
      Discover standards with plan_list_standards before creating items, and reference
      them in a Standards section. Plan names are kebab-case (e.g. code-cleanup); item
      IDs are auto-generated (<PLAN-PREFIX><N>, e.g. CC07) — never supply one. Reviews
      link to a plan item and move through created → considered → closed; completed
      items and closed reviews move to completed/. Always update state after acting:
      close reviews after their findings are incorporated or explicitly rejected, mark
      items completed only when validation is done, and delete stale/superseded items
      rather than leaving them pending.
    tool-descriptions:
      plan_list_standards: >
        List the architecture and design standards for this project. Returns a list
        of standards with id, title, path, and description. Standards are loaded from
        the active planning implementation descriptor. Use this to discover which standards apply
        before creating or updating plan items.
      plan_create_item: >
        Create a new plan item. Required: plan, title.
        Optional: priority (P0/P1/P2/P3/HIGH/MEDIUM), complexity (simple/mid/complex),
        order, validate_first, description, steps, files, validation, effort_risk, notes.
        ID is auto-generated — do not supply it.
        Returns {id, title, plan, path} for the created item.
      plan_list_groups: >
        List plan items grouped by plan. Returns plan groups with item counts
        (total, active, completed) and their items. state: 'active'/'pending' or 'completed' (omit for all).
        plan: directory name like 'code-cleanup' (omit for all plans).
      plan_list_items: >
        List plan items. state: 'active'/'pending' or 'completed' (omit for all).
        plan: directory name like 'code-cleanup' (omit for all plans).
      plan_get_item: Read a plan item by ID, returning frontmatter and all body sections.
      plan_set_state: >
        Transition item state. Use after every implementation or planning cleanup.
        'pending' keeps an unfinished item in active/; 'completed' moves it to
        completed/ only when required work and validation are actually done.
        Do not mark an item completed merely because its reviews were incorporated;
        keep it pending if implementation remains. Delete stale/superseded items
        with plan_delete_item instead of leaving inactive work pending. Also accepts
        'not_done' as a legacy alias for 'pending'.
      plan_update_item: >
        Update frontmatter fields (priority, complexity, order, etc.) or body sections
        (title, description, steps, files, validation, effort_risk, notes) of an existing item.
      plan_delete_item: Permanently delete a plan item by ID.
      plan_create_review: >
        Create a new review linked to a plan item. Required: review-of (parent item ID), title.
        Optional: notes, findings, conclusion, reviewed-by. ID is auto-generated (e.g. RV01).
        Returns {id, title, review-of, plan, path}.
      plan_list_reviews: >
        List reviews. state: 'created'/'considered' for active, 'closed' for completed (omit for all).
        plan: directory name like 'code-cleanup' (omit for all plans).
        review_of: parent item ID to filter by (omit for all).
      plan_get_review: Read a review by ID, returning frontmatter + parsed body sections.
      plan_set_review_state: >
        Transition review state. Use immediately after review findings are handled.
        'closed' moves to completed/ when findings have been incorporated into the
        parent plan, rejected with rationale, or confirmed no-action. 'created' and
        'considered' keep a review active while findings still need triage.
        Returns {id, state, path}.
      plan_update_review: >
        Update frontmatter fields (reviewed-by, reviewed-at) or body sections
        (title, notes, findings, conclusion) of an existing review.
        Returns {id, path}.
      plan_delete_review: Permanently delete a review. Returns {id}.

contributions:
  - id: agent-planning/process
    owner: agent-planning
    title: Planning process
    preferred-targets:
      - skill
      - instruction
    content:
      body: |
        Use the ag-planning MCP tools to manage plan items in docs/planning/.

        ## When to use
        - User asks to create a plan or work items for a task
        - Tracking multi-step implementation across sessions
        - Reviewing or updating the state of outstanding items

        ## Item lifecycle
        1. Create items with plan_create_item — lands in docs/planning/active/<plan>/
        2. Revise content with plan_update_item as work progresses; for a findings-driven correction (not routine progress), record a plan_create_review first, then close it once incorporated
        3. After review triage, close handled reviews with plan_set_review_state(review_id, 'closed')
        4. Mark done with plan_set_state(item_id, 'completed') only when implementation and validation are done
        5. Keep unfinished work pending; remove stale/superseded/cancelled items with plan_delete_item

        ## Item ID convention
        Combine a short uppercase plan prefix with a sequence number: CC07, LSP01, ML01.
        Choose a prefix matching the plan name (CC → code-cleanup, LSP → lsp-mcp-enhancement).

        ## Required fields for plan_create_item
        - plan: plan directory name (e.g. "code-cleanup")
        - title: short descriptive title

        ## State discipline
        - Do not leave incorporated reviews in created/considered; close them.
        - Do not mark a parent item completed just because reviews were handled.
        - If an active item is superseded, delete it or replace it with the canonical item.

        ## Optional fields
        - priority: P0 (critical) / P1 / P2 / P3 / HIGH / MEDIUM (default P2)
        - complexity: simple / mid / complex (default simple)
        - order: integer sort key (default 0)
        - validate_first: true if validation steps must precede implementation (default true)
        - description, steps, files, validation, effort_risk, notes: body section content
