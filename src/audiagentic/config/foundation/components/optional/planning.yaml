type: component
contract-version: v1
component-id: planning
display-name: Planning
description: Structured planning system — requests, specs, plans, tasks, work-packages
detection-marker: .audiagentic/components/planning.yaml
files:
  - path: .audiagentic/components/planning.yaml
    lifecycle: create-if-missing
    description: Installation marker
  - path: .audiagentic/planning/config
    lifecycle: create-if-missing
    recursive: true
    description: Planning configuration — profiles, automations, templates
  - path: .audiagentic/planning/claims
    lifecycle: runtime-only
    recursive: true
    description: Planning item claim state
  - path: .audiagentic/planning/events
    lifecycle: runtime-only
    recursive: true
    description: Planning event log
  - path: .audiagentic/planning/extracts
    lifecycle: runtime-only
    recursive: true
    description: Extracted planning item JSON records
  - path: .audiagentic/planning/ids
    lifecycle: runtime-only
    recursive: true
    description: ID sequence counters
  - path: .audiagentic/planning/indexes
    lifecycle: runtime-only
    recursive: true
    description: Planning index files
mcp-servers:
  - name: audiagentic-planning
    module: audiagentic.components.optional.planning.server
    direct-tools: [planning_status, planning_summary, planning_index, planning_events]
    description: Planning MCP server for planning system introspection
    instructions: >
      AUDiaGentic planning component server.
      Use planning_status to check whether planning is configured.
      Use planning_summary to get item counts per kind.
      Use planning_index to read a specific planning index.
    tool-descriptions:
      planning_status: Return planning component installation status for project.
      planning_summary: Return item counts per planning kind and current ID counters.
      planning_index: Read a specific planning index.
      planning_events: Return recent planning events from events.jsonl.
harness-instructions:
  - section: "What you can do"
    content: |
      ### audiagentic-planning
      - `mcp_planning_status` — Check planning component status
      - `mcp_planning_summary` — Show planning item counts
      - `mcp_planning_index` — Read a specific planning index
      - `mcp_planning_events` — View recent planning events
