type: component
contract-version: v1
component-id: agent-ledger
display-name: Agent Ledger
description: Change ledger — fragment recording, sync, audit summaries, and release archiving
detection-marker: .audiagentic/components/agent-ledger.yaml
config: release/agent-ledger.yaml
files:
  - path: .audiagentic/components/agent-ledger.yaml
    lifecycle: create-if-missing
    description: Installation marker
  - path: .audiagentic/runtime/ledger
    lifecycle: runtime-only
    recursive: true
    description: Ledger fragments and sync state
mcp-servers:
  - name: audiagentic-ledger-write
    module: audiagentic.components.optional.ledger.ledger_write_mcp
    direct-tools: [record_change_event, get_current_summary]
    description: Provider-facing ledger write API
    instructions: >
      Use record_change_event after completing substantive implementation work.
      Use get_current_summary to inspect what has been recorded in the current release.
    tool-descriptions:
      record_change_event: Validate and record a change event fragment to the ledger.
      get_current_summary: Return the current release summary markdown.
  - name: audiagentic-ledger-admin
    module: audiagentic.components.optional.ledger.ledger_admin_mcp
    direct-tools: [get_ledger_status, sync_ledger, get_audit_report]
    description: Ledger management and admin tools
    instructions: >
      Use get_ledger_status to check installation state and fragment count.
      Use sync_ledger to merge pending fragments into the current ledger.
      Use get_audit_report to regenerate audit and check-in summaries.
    tool-descriptions:
      get_ledger_status: Return ledger installation state, fragment count, and last sync time.
      sync_ledger: Merge all pending fragments into the current release ledger.
      get_audit_report: Regenerate and return paths to the audit summary and check-in docs.
harness-instructions:
  - section: "What you can do"
    content: |
      ### audiagentic-ledger-write
      - `record_change_event` — Record a change event after implementation work
      - `get_current_summary` — View current release summary

      ### audiagentic-ledger-admin
      - `get_ledger_status` — Check ledger installation and sync state
      - `sync_ledger` — Merge pending fragments into the ledger
      - `get_audit_report` — Regenerate audit and check-in docs
