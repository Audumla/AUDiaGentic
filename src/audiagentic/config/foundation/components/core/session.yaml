type: component
contract-version: v1
scope: harness
component-id: session
display-name: Session
description: Harness status and configuration
detection-marker: components/session.yaml
files:
  - path: components/session.yaml
    lifecycle: create-if-missing
    description: Component installation marker
mcp-servers:
  - name: audiagentic-session
    module: audiagentic.components.core.harness_server
    args: ["--readonly", "--smoke-only"]
    direct-tools: [status, config, set_auto_update, cli_visibility, set_cli_visibility]
    description: Harness status and configuration
    instructions: >
      AUDiaGentic session server.
      Exposes harness info/config plus CLI visibility controls.
    tool-descriptions:
      status: Show current AUDiaGentic harness status including versions, model, endpoint, auto-update, and environment info.
      config: Show current AUDiaGentic harness configuration including ag.yaml settings and models.json.
      set_auto_update: Enable or disable auto-update checks at launch.
      cli_visibility: Show current CLI visibility settings for thinking blocks and tool or MCP blocks.
      set_cli_visibility: Set CLI visibility for thinking blocks and tool or MCP blocks, then request an in-session reload.
harness-instructions:
  - section: "What you can do"
    content: |
      ### Session
      - `mcp_status` — Check harness status and configuration
      - `mcp_config` — Show harness configuration
      - `mcp_set_auto_update` — Enable or disable auto-update
      - `mcp_cli_visibility` — Show whether thinking/tool blocks are visible
      - `mcp_set_cli_visibility` — Show or hide thinking/tool blocks in the CLI
