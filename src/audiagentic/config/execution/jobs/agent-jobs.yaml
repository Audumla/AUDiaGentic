component-id: agent-jobs

# Tags owned by this component. Each entry points to a tag descriptor file
# (relative to the config root). The providers component surfaces these on
# every installed provider automatically.
agent-tags:
  - config: prompt-triggers/tags/implement/descriptor.yaml
  - config: prompt-triggers/tags/plan/descriptor.yaml
  - config: prompt-triggers/tags/review/descriptor.yaml
  - config: prompt-triggers/tags/audit/descriptor.yaml
  - config: prompt-triggers/tags/check-in-prep/descriptor.yaml

# Component-level surface contributions (non-tag rules) go here.
surface-contributions: []
