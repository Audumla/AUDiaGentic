# Local OpenAI Bridge — provider descriptor
# No CLI, no MCP, no LSP — REST endpoint only

provider_id: local-openai
# SH19: pure REST client (access_mode: none, no cli_probe/cli_install, no
# os.environ reads in adapter.py/catalog.py, no execution_environment.py
# provider-owned env contributions) — has nothing for the disposable worker's
# private-HOME subprocess isolation to break, unlike CLI-based providers with
# fixed real config paths (claude/cline/gemini). Declaring "no-isolation" here
# made the gateway's full-isolation-only dispatch gate (UNS-AGW-076) reject
# every real local-openai request outright. See docs/planning SH19.
execution_isolation_tier: full-isolation
display_name: "Local OpenAI Bridge"
description: "Generic OpenAI-compatible REST endpoint. Points to any locally hosted model server (llama.cpp, Ollama, vLLM, etc.). Requires api-base-url and model-id in config."
url: "https://platform.openai.com/docs/api-reference"
prompt_aliases:
  - lo
access_mode: none

cli_probe: null

receive_lsp_mcp: false

capabilities:
  models:
    mechanism:
      refresh: "audiagentic.components.providers.adapters.local_openai.catalog:_fetch_catalog"
      # MO01: repo fact, not speculation — this adapter's only wire shape is
      # the OpenAI-compatible /v1 REST surface (see adapters/local_openai/
      # catalog.py, adapter.py).
      connectors: [openai-compatible]

  permissions:
    mechanism:
      can_write_files: false
      can_execute_shell: false
      can_browse_web: false
      can_read_env: false
      notes: "OpenAI-compatible REST endpoint; chat completions only. No MCP, LSP, skill surfaces, file writing, or shell execution."
