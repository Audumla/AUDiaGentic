# OpenCode — provider descriptor
# Toolchain-based install (npm), custom probe, MCP + LSP JSON config, VS Code extension

provider_id: opencode
execution_isolation_tier: full-isolation
mcp_launch_isolation_tier: exact
# Declared launch capability (HA04): intent -> queryable channel surface. The
# caller picks the intent; opencode's builder owns the transports/channels.
#   execute      run one turn, captured (adapter.py)
#   interactive  human tty (declarative interactive: recipe below)
#   agent        live agent session (adapters/opencode/acp.py)
launches:
  execute:
    interaction: [native]
    observability: [pipe]
  interactive:
    interaction: [native]
    observability: [pipe]
  agent:
    interaction: [acp]
    observability: [acp]

# Declarative interactive-TUI launch (HA04). OpenCode needs no injected
# extensions or custom config -- just the binary, the translated runner args,
# and the MCP surface's env (OPENCODE_CONFIG_CONTENT / XDG_CONFIG_HOME, merged
# automatically). No hand-written builder.
interactive:
  executable: opencode
  aliases: [opencode]
  # No base args: the runner appends translated RunnerParams (via runner-flags)
  # and any passthrough. MCP env (OPENCODE_CONFIG_CONTENT/XDG_CONFIG_HOME) is
  # merged from the launch-time MCP surface automatically.
  args: []
  runner-flags:
    prompt: --message
    mode-cases:
      json: [--output-format, json]

display_name: "OpenCode"
description: "Terminal-based AI coding assistant. Supports multiple LLM providers via a unified CLI."
url: "https://opencode.ai"
prompt_aliases:
  - opc

cli_probe:
  - opencode
  - "--version"


capabilities:
  cli-install:
    mechanism:
      toolchain: npm
      package: opencode-ai
      executable: opencode
      probe_fn: "audiagentic.components.providers.adapters.opencode.catalog:_opencode_probe"

  host-extensions:
    mechanism:
      host: vscode
      capability_id: "sst-dev.opencode"
      display_name: "OpenCode"

  mcp:
    mechanism:
      config_path: ".opencode/opencode.json"
      reader: "audiagentic.components.providers.adapters.opencode.mcp_format:read_opencode_mcp"
      writer: "audiagentic.components.providers.adapters.opencode.mcp_format:write_opencode_mcp"
      remover: "audiagentic.components.providers.adapters.opencode.mcp_format:remove_opencode_mcp"
      format: "opencode-mcp"
      refresh_mode: "file-watch"

  plugins:
    mechanism:
      config_path: ".opencode/opencode.json"
      reader: "audiagentic.components.providers.adapters.opencode.plugin_array:read_opencode_plugins"
      writer: "audiagentic.components.providers.adapters.opencode.plugin_array:write_opencode_plugins"
      remover: "audiagentic.components.providers.adapters.opencode.plugin_array:remove_opencode_plugin"
      format: "opencode-plugin-array"
      refresh_mode: "none"

  lsp-config:
    mechanism:
      config_path: ".opencode/opencode.json"
      reader: "audiagentic.components.providers.adapters.opencode.language_servers:read_language_servers_opencode"
      writer: "audiagentic.components.providers.adapters.opencode.language_servers:write_language_servers_opencode"
      remover: "audiagentic.components.providers.adapters.opencode.language_servers:remove_language_servers_opencode"
      format: "opencode-json"

  models:
    mechanism:
      store:
        config_path: ".opencode/opencode.json"
        reader: "audiagentic.components.providers.adapters.opencode.model_config:read_opencode_models"
        writer: "audiagentic.components.providers.adapters.opencode.model_config:write_opencode_models"
        remover: "audiagentic.components.providers.adapters.opencode.model_config:remove_opencode_model"
        format: "opencode-models-json"
        refresh_mode: "none"
      entry_renderer: "audiagentic.components.providers.adapters.opencode.model_entry:render_opencode_model_entry"
      refresh: "audiagentic.components.providers.adapters.opencode.catalog:_fetch_opencode_catalog"
      connectors: [openai-compatible, openai, anthropic]
    evidence:
      note: >-
        catalog refresh: opencode models --verbose; requires an installed
        OpenCode CLI; catalog contents depend on provider authentication and
        upstream cache state (tool_version 1.17.18)
      source: "docs/reference/model-source-evidence/opencode.md#opencode-evidence"

  surface-skill:
    mechanism: ".opencode/skills/{tag}/SKILL.md"

  permissions:
    mechanism:
      can_write_files: true
      can_execute_shell: true
      can_browse_web: false
      can_read_env: true
      notes: "CLI agent; multi-provider backend, full tool use"

  agent-files:
    mechanism:
      rel_path: "AGENTS.md"
      managed: false
      description: "OpenCode project instructions"

  launch-isolation:
    evidence:
      note: >-
        isolated XDG config plus per-process OPENCODE_CONFIG_CONTENT, verified
        (tool_version 1.18.3)
      source: "tests/unit/providers/test_mcp_launch_isolation.py"

  model-config-projection:
    evidence:
      note: >-
        BLOCKED: structured provider config; config filename and winning
        container remain unresolved; no safe automatic projection contract is
        verified (tool_version 1.17.18) — resolve config.json versus
        opencode.json and provider key shape.
      source: "docs/reference/model-source-evidence/opencode.md#opencode-evidence"

  # --- ACP capability family (plan agent-sessions AS01-AS07) -------------
  # Segregates ACP/live-session features so they can be requested per state
  # while the capability is being built out. Evidence-only per boundary
  # rules — the executable authority is the adapter's acp submodule hook
  # (load_acp_launch_builder) consumed by gateway session dispatch.
  acp-stdio-transport:
    evidence:
      note: >-
        native `opencode acp` stdio ACP server launched via
        adapters/opencode/acp.py build_acp_launch; model selected via
        OPENCODE_CONFIG_CONTENT inline config. Verified.
      source: "tests/e2e/agents/test_opencode_acp_e2e.py"

  acp-live-session:
    evidence:
      note: >-
        gateway SessionRuntime keep-alive session over `opencode acp`
        (session_keep_alive / session_id request fields; FIFO turn queue,
        idle/lifetime reaper). Long-running turns can hit transport
        event-volume caps before terminal completion (overseer R&D finding
        2026-07-17) — checkpoint/compaction strategy pending. In-flight
        continuation ('bump' during a stalled prompt) is not safe —
        cancelling the await kills the transport; same-session continuation
        AFTER a terminal turn is verified. NEXT: AS07 formal live gate + AS06
        no-orphan proof; MA28 overseer delegation succeeded live 2026-07-17
        (terminal end_turn, cleanup verified).
      source: "tests/unit/agents/test_agents_gateway_sessions.py"

  acp-session-resume:
    evidence:
      note: >-
        planned: ACP session/load gated on advertised capability, anchored by
        persisted provider-session-ref; CLI fallback `opencode run --session
        <id>`. Not implemented; sessions currently die with the gateway
        process. NEXT: AS10.
      source: "docs/planning/active/agent-sessions/AS10.md"

  acp-shared-live-session:
    evidence:
      note: >-
        no known opencode mechanism for multi-client attachment to one live
        session. Gateway-side remote channeling (AS09) can expose OUR session
        to remote clients, but opencode offers no native peer-client surface
        comparable to Codex App Server. NEXT: revisit if opencode ships a
        server/attach surface; otherwise AS09 covers the need gateway-side.
      source: "docs/planning/active/agent-sessions/AS09.md"

  # --- AS27 harness observability capability facts -----------------------
  # Inventory and conformance for agent-loop status observation.
  obs-opencode-acp:
    evidence:
      note: >-
        AS27 inventory: Recipe A transport-observation; validated O1
        publisher on linux-amd64 only (local probe proven); opencode acp
        stdio supports windows/macOS/linux as vendor product platforms but
        local observability validation requires exact per-platform probe.
        cancel-turn not supported in current version.
      source: "src/audiagentic/components/providers/services/harness_observability_inventory.py#opencode-opencode-acp"

  obs-opencode-cli-session:
    evidence:
      note: >-
        AS27 inventory: Recipe A/C candidate; blocked pending synchronous
        completion / idle/status probe; never parse prose. Requires server
        event/status API and plugin route proof; no validated transport
        observation mechanism yet — prove synchronous completion, session
        idle/status, SSE ordering and correlation.
      source: "src/audiagentic/components/providers/services/harness_observability_inventory.py#opencode-opencode-cli-session"

# AS29 session-surface declarations — one per provider surface+version
# ACP (stdio) and CLI run --session are distinct; never interchangeable fallbacks.
session_surfaces:
  - surface_id: opencode-acp
    version_constraint: ">=1.0"
    identity_operations:
      open: "supported"
      attach-existing: "unsupported"
      resume-by-ref: "unsupported"
      discover: "unsupported"
    ownership_modes:
      - "owned"
    controls:
      cancel-turn: "unsupported"
      interrupt-turn: "unsupported"
      steer-turn: "unsupported"
      respond-permission: "unsupported"
      close-session: "supported"
    lifecycle_source: "transport"
    lifecycle_installation: "none"
    content_channels:
      - channel: "assistant-text"
        max_bytes: 65536
        max_events: 100
    validation_state: "declared"
    effective_level: "O1"
    # Platform evidence — only linux-amd64 has exact local probe evidence.
    # Windows/macOS/Linux are vendor-supported platforms (product capability
    # fact), but local observability validation is proven only for linux-amd64.
    # Parent VALIDATED because at least one platform is validated.
    # Other platforms remain DECLARED/O0 until their own probes pass.
    platforms:
      - platform: "linux-amd64"
        tool_version: "repository"
        probe_artifact: "tests/e2e/agents/test_opencode_acp_e2e.py"
        validation_state: "validated"
        effective_level: "O1"
      # Vendor-supported platforms — no local probe evidence yet.
      # Validation state remains DECLARED; effective level O0 until proven.
      - platform: "windows-amd64"
        tool_version: "repository"
        probe_artifact: "tests/e2e/agents/test_opencode_acp_e2e.py"
        validation_state: "declared"
        effective_level: "O0"
      - platform: "darwin-arm64"
        tool_version: "repository"
        probe_artifact: "tests/e2e/agents/test_opencode_acp_e2e.py"
        validation_state: "declared"
        effective_level: "O0"
      - platform: "darwin-amd64"
        tool_version: "repository"
        probe_artifact: "tests/e2e/agents/test_opencode_acp_e2e.py"
        validation_state: "declared"
        effective_level: "O0"
    adapter_ref: "audiagentic.components.providers.adapters.opencode.acp:build_acp_launch"
  - surface_id: opencode-cli-session
    version_constraint: ">=1.0"
    identity_operations:
      open: "supported"
      attach-existing: "unsupported"
      resume-by-ref: "unsupported"
      discover: "unsupported"
    ownership_modes:
      - "owned"
    controls: {}
    lifecycle_source: "none"
    lifecycle_installation: "none"
    content_channels: []
    validation_state: "blocked"
    effective_level: "O0"
