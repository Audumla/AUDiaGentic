# OpenCode — provider descriptor
# Toolchain-based install (npm), custom probe, MCP + LSP JSON config, VS Code extension

provider_id: opencode
execution_isolation_tier: full-isolation
automation_capabilities:
  - family_id: cli-lifecycle
    supported_modes: [plan, apply, prune, status]
    payload_contract: provider-cli-lifecycle-payload/v1
    result_contract: provider-cli-lifecycle-result/v1
    ownership_scope_required: false
  - family_id: managed-mcp
    supported_modes: [apply, prune, status]
    payload_contract: provider-managed-mcp-payload/v1
    result_contract: provider-managed-mcp-result/v1
    ownership_scope_required: true
  - family_id: language-server-projection
    supported_modes: [apply, prune, status]
    payload_contract: provider-language-server-projection-payload/v1
    result_contract: provider-language-server-projection-result/v1
    ownership_scope_required: true

  - family_id: plugin-entry
    supported_modes: [apply, prune, status]
    payload_contract: provider-plugin-entry-payload/v1
    result_contract: provider-plugin-entry-result/v1
    ownership_scope_required: true
  - family_id: generated-surfaces
    supported_modes: [plan, apply, prune, status]
    payload_contract: provider-generated-surface-payload/v1
    result_contract: provider-generated-surface-result/v1
    ownership_scope_required: true
  - family_id: model-projection
    supported_modes: [plan, apply, prune, status]
    payload_contract: provider-model-projection-payload/v1
    result_contract: provider-model-projection-result/v1
    ownership_scope_required: false
display_name: "OpenCode"
description: "Terminal-based AI coding assistant. Supports multiple LLM providers via a unified CLI."
url: "https://opencode.ai"
prompt_aliases:
  - opc

cli_probe:
  - opencode
  - "--version"

cli_install:
  toolchain: npm
  package: opencode-ai
  executable: opencode
  probe_fn: "audiagentic.components.providers.adapters.opencode.catalog:_opencode_probe"

host_capabilities:
  - host: vscode
    capability_id: "sst-dev.opencode"
    display_name: "OpenCode"

capability_facts:
  - capability_id: cli-install
    subject: cli_install
    mechanism: "npm install: opencode-ai with shell probe opencode --version"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/opencode.yaml#cli_install"
      review_state: verified
  - capability_id: host-extension
    subject: host_capabilities
    mechanism: "vscode extension sst-dev.opencode"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/opencode.yaml#host_capabilities"
      review_state: verified
  - capability_id: mcp-config
    subject: mcp_config
    mechanism: "reader/writer/remover over .opencode/opencode.json"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/opencode.yaml#mcp_config"
      review_state: verified
  - capability_id: plugin-config
    subject: plugin_config
    mechanism: "reader/writer/remover over .opencode/opencode.json plugin array"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/opencode.yaml#plugin_config"
      review_state: verified
  - capability_id: lsp-config
    subject: language_servers_config
    mechanism: "reader/writer/remover over .opencode/opencode.json language servers"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/opencode.yaml#language_servers_config"
      review_state: verified
  - capability_id: model-catalog-refresh
    subject: fetch_catalog_fn
    mechanism: "opencode models --verbose"
    constraints:
      - "Provider command requires an installed OpenCode CLI."
    limitations:
      - "Catalog contents depend on provider authentication and upstream cache state."
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: execution
      tool_version: "1.17.18"
      fact_anchor: "docs/reference/model-source-evidence/opencode.md#opencode-evidence"
      review_state: verified
  - capability_id: surface-skill
    subject: skill_surface_path
    mechanism: ".opencode/skills/{tag}/SKILL.md path template"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/opencode.yaml#skill_surface_path"
      review_state: verified
  - capability_id: perm-declaration
    subject: permissions
    mechanism: "ProviderPermissions boolean flags"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/opencode.yaml#permissions"
      review_state: verified
  - capability_id: model-config-projection
    subject: "external:model-config-projection"
    mechanism: "structured provider config"
    constraints:
      - "Config filename and winning container remain unresolved."
    limitations:
      - "No safe automatic projection contract is verified."
    support_assessment: blocked
    action_needed: "Resolve config.json versus opencode.json and provider key shape."
    evidence:
      evidence_tier: unverified
      tool_version: "1.17.18"
      fact_anchor: "docs/reference/model-source-evidence/opencode.md#opencode-evidence"
      review_state: pending-review
  # --- ACP capability family (plan agent-sessions AS01-AS07) -------------
  # Segregates ACP/live-session features so they can be requested per state
  # while the capability is being built out. Evidence-only per boundary
  # rules — the executable authority is the adapter's acp submodule hook
  # (load_acp_launch_builder) consumed by gateway session dispatch.
  - capability_id: acp-stdio-transport
    subject: "external:acp-stdio-transport"
    mechanism: "native `opencode acp` stdio ACP server launched via adapters/opencode/acp.py build_acp_launch; model selected via OPENCODE_CONFIG_CONTENT inline config"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: execution
      tool_version: repository
      fact_anchor: "tests/e2e/agents/test_opencode_acp_e2e.py"
      review_state: verified
  - capability_id: acp-live-session
    subject: "external:acp-live-session"
    mechanism: "gateway SessionRuntime keep-alive session over `opencode acp` (session_keep_alive / session_id request fields; FIFO turn queue, idle/lifetime reaper)"
    constraints:
      - "long-running turns can hit transport event-volume caps before terminal completion (overseer R&D finding 2026-07-17) — checkpoint/compaction strategy pending"
    limitations:
      - "in-flight continuation ('bump' during a stalled prompt) is not safe — cancelling the await kills the transport; same-session continuation AFTER a terminal turn is verified"
    support_assessment: partial
    action_needed: "AS07 formal live gate + AS06 no-orphan proof; MA28 overseer delegation succeeded live 2026-07-17 (terminal end_turn, cleanup verified)."
    evidence:
      evidence_tier: execution
      tool_version: repository
      fact_anchor: "tests/unit/agents/test_agents_gateway_sessions.py"
      review_state: pending-review
  - capability_id: acp-session-resume
    subject: "external:acp-session-resume"
    mechanism: "planned: ACP session/load gated on advertised capability, anchored by persisted provider-session-ref; CLI fallback `opencode run --session <id>`"
    constraints: []
    limitations:
      - "not implemented; sessions currently die with the gateway process"
    support_assessment: blocked
    action_needed: "AS10."
    evidence:
      evidence_tier: documentation
      tool_version: "1.17.18"
      fact_anchor: "docs/planning/active/agent-sessions/AS10.md"
      review_state: pending-review
  - capability_id: acp-shared-live-session
    subject: "external:acp-shared-live-session"
    mechanism: "no known opencode mechanism for multi-client attachment to one live session"
    constraints: []
    limitations:
      - "gateway-side remote channeling (AS09) can expose OUR session to remote clients, but opencode offers no native peer-client surface comparable to Codex App Server"
    support_assessment: blocked
    action_needed: "Revisit if opencode ships a server/attach surface; otherwise AS09 covers the need gateway-side."
    evidence:
      evidence_tier: documentation
      tool_version: "1.17.18"
      fact_anchor: "docs/planning/active/agent-sessions/AS09.md"
      review_state: pending-review

permissions:
  can_write_files: true
  can_execute_shell: true
  can_browse_web: false
  can_read_env: true
  notes: "CLI agent; multi-provider backend, full tool use"

skill_surface_path: ".opencode/skills/{tag}/SKILL.md"

agent_files:
  - rel_path: "AGENTS.md"
    managed: false
    description: "OpenCode project instructions"

fetch_catalog_fn: "audiagentic.components.providers.adapters.opencode.catalog:_fetch_opencode_catalog"

model_entry_renderer: "audiagentic.components.providers.adapters.opencode.model_entry:render_opencode_model_entry"

supported_connectors:
  - openai-compatible
  - openai
  - anthropic

model_config:
  config_path: ".opencode/opencode.json"
  reader: "audiagentic.components.providers.adapters.opencode.model_config:read_opencode_models"
  writer: "audiagentic.components.providers.adapters.opencode.model_config:write_opencode_models"
  remover: "audiagentic.components.providers.adapters.opencode.model_config:remove_opencode_model"
  format: "opencode-models-json"
  refresh_mode: "none"

mcp_config:
  config_path: ".opencode/opencode.json"
  reader: "audiagentic.components.providers.adapters.opencode.mcp_format:read_opencode_mcp"
  writer: "audiagentic.components.providers.adapters.opencode.mcp_format:write_opencode_mcp"
  remover: "audiagentic.components.providers.adapters.opencode.mcp_format:remove_opencode_mcp"
  format: "opencode-mcp"
  refresh_mode: "file-watch"

plugin_config:
  config_path: ".opencode/opencode.json"
  reader: "audiagentic.components.providers.adapters.opencode.plugin_array:read_opencode_plugins"
  writer: "audiagentic.components.providers.adapters.opencode.plugin_array:write_opencode_plugins"
  remover: "audiagentic.components.providers.adapters.opencode.plugin_array:remove_opencode_plugin"
  format: "opencode-plugin-array"
  refresh_mode: "none"

language_servers_config:
  config_path: ".opencode/opencode.json"
  reader: "audiagentic.components.providers.adapters.opencode.language_servers:read_language_servers_opencode"
  writer: "audiagentic.components.providers.adapters.opencode.language_servers:write_language_servers_opencode"
  remover: "audiagentic.components.providers.adapters.opencode.language_servers:remove_language_servers_opencode"
  format: "opencode-json"

# AS29 session-surface declarations — one per provider surface+version
# ACP (stdio) and CLI run --session are distinct; never interchangeable fallbacks.
session_surfaces:
  - surface_id: opencode-acp
    version_constraint: ">=1.0"
    identity_operations:
      open: "supported"
      attach-existing: "unsupported"
      resume-by-ref: "unsupported"
      discover: "unsupported"
    ownership_modes:
      - "owned"
    controls:
      cancel-turn: "unsupported"
      interrupt-turn: "unsupported"
      steer-turn: "unsupported"
      respond-permission: "unsupported"
      close-session: "supported"
    lifecycle_source: "transport"
    lifecycle_installation: "none"
    content_channels:
      - channel: "assistant-text"
        max_bytes: 65536
        max_events: 100
    validation_state: "declared"
    effective_level: "O1"
    platforms:
      - platform: "linux-amd64"
        tool_version: "repository"
        probe_artifact: "tests/e2e/agents/test_opencode_acp_e2e.py"
        validation_state: "validated"
        effective_level: "O1"
      - platform: "windows-amd64"
        tool_version: "repository"
        probe_artifact: "tests/e2e/agents/test_opencode_acp_e2e.py"
        validation_state: "declared"
        effective_level: "O0"
    adapter_ref: "audiagentic.components.providers.adapters.opencode.acp:build_acp_launch"
  - surface_id: opencode-cli-session
    version_constraint: ">=1.0"
    identity_operations:
      open: "supported"
      attach-existing: "unsupported"
      resume-by-ref: "unsupported"
      discover: "unsupported"
    ownership_modes:
      - "owned"
    controls: {}
    lifecycle_source: "none"
    lifecycle_installation: "none"
    content_channels: []
    validation_state: "blocked"
    effective_level: "O0"
