# Pi Coding Agent — provider descriptor
# Custom case: callable install/uninstall, custom probe, on_lsp_enabled hook

provider_id: pi
execution_isolation_tier: full-isolation
mcp_launch_isolation_tier: exact
# Declared launch capability (HA04): intent -> queryable channel surface the
# harness assembles (by role). The caller picks the intent; pi's builder owns
# the transports/channels.
#   execute      run one turn, captured (adapter.py, stdin-piped)
#   interactive  human tty (adapters/pi/interactive.py)
#   agent        live agent session (adapters/pi/acp.py; pi also offers RPC
#                hooks for observability)
launches:
  execute:
    interaction: [native]
    observability: [pipe]
  interactive:
    interaction: [native]
    observability: [pipe]
  agent:
    interaction: [acp]
    observability: [acp, rpc]
automation_capabilities:
  - family_id: cli-lifecycle
    supported_modes: [plan, apply, prune, status]
    payload_contract: provider-cli-lifecycle-payload/v1
    result_contract: provider-cli-lifecycle-result/v1
    ownership_scope_required: false
  - family_id: managed-mcp
    supported_modes: [apply, prune, status]
    payload_contract: provider-managed-mcp-payload/v1
    result_contract: provider-managed-mcp-result/v1
    ownership_scope_required: true
  - family_id: model-projection
    supported_modes: [plan, apply, prune, status]
    payload_contract: provider-model-projection-payload/v1
    result_contract: provider-model-projection-result/v1
    ownership_scope_required: false
  - family_id: self-provided-lsp
    supported_modes: [apply, status]
    payload_contract: provider-self-provided-lsp-payload/v1
    result_contract: provider-self-provided-lsp-result/v1
    ownership_scope_required: false
display_name: "Pi Coding Agent"
description: "Lightweight local coding agent TUI by Earendil Works. Supports MCP tool use via the pi-mcp-adapter extension."
url: "https://www.earendilworks.com/pi"
access_mode: "none"

cli_probe: null

cli_install:
  package_manager: "pi-harness"
  package_name: "audiagentic-pi-harness"
  executable: "pi"
  install:
    type: callable
    id: install
    fn: "audiagentic.components.providers.adapters.pi.hooks:_pi_install"
  uninstall:
    type: callable
    id: uninstall
    fn: "audiagentic.components.providers.adapters.pi.hooks:_pi_uninstall"
  probe_fn: "audiagentic.components.providers.adapters.pi.hooks:_pi_probe"

host_capabilities: []

capability_facts:
  - capability_id: mcp-launch-isolation
    subject: mcp_launch_isolation_tier
    mechanism: "request-owned config via pi-mcp-adapter with exclusive discovery"
    constraints:
      - "requires a compatible installed pi-mcp-adapter"
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: execution
      tool_version: repository
      fact_anchor: "tests/unit/providers/test_mcp_launch_isolation.py"
      review_state: verified
  - capability_id: cli-install
    subject: cli_install
    mechanism: "pi-harness with callable probe_fn, install, uninstall"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/pi.yaml#cli_install"
      review_state: verified
  - capability_id: mcp-config
    subject: mcp_config
    mechanism: "reader/writer/remover over .mcp.json"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/pi.yaml#mcp_config"
      review_state: verified
  - capability_id: lsp-self-support
    subject: on_lsp_enabled
    mechanism: "_pi_ensure_lens hook — callable hook on LSP enable that installs LSP support"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/pi.yaml#on_lsp_enabled"
      review_state: verified
  - capability_id: perm-declaration
    subject: permissions
    mechanism: "ProviderPermissions boolean flags"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/pi.yaml#permissions"
      review_state: verified
  - capability_id: vendor-key-injection
    subject: "external:vendor-key-injection"
    mechanism: "native env var key injection (OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY, etc.)"
    constraints:
      - "env vars effective at launch time"
      - "custom endpoints require models.json write"
    limitations:
      - "user-home write requires consent if global scope"
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: execution
      tool_version: "0.79.8"
      fact_anchor: "docs/reference/model-source-evidence/pi.md#pi-evidence"
      review_state: verified
  - capability_id: model-config-surface
    subject: "external:model-config-surface"
    mechanism: "~/.pi/agent/models.json with providers/models[]/baseUrl/apiKey/compat shape"
    constraints:
      - "home-scoped, not project-local"
    limitations:
      - "for custom/local endpoints only, not required for native vendors"
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: execution
      tool_version: "0.79.8"
      fact_anchor: "docs/reference/model-source-evidence/pi.md#pi-evidence"
      review_state: verified

permissions:
  can_write_files: true
  can_execute_shell: true
  can_browse_web: false
  can_read_env: true
  notes: "TUI coding agent; MCP tool use available when pi-mcp-adapter is installed"

agent_files:
  - rel_path: ".pi"
    managed: false
    description: "Pi agent runtime directory"

mcp_config:
  config_path: ".mcp.json"
  reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
  writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
  remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
  format: "mcp-json"
  refresh_mode: "restart-required"

on_lsp_enabled: "audiagentic.components.providers.adapters.pi.hooks:_pi_ensure_lens"
lsp_support_probe: "audiagentic.components.providers.adapters.pi.hooks:_pi_lens_present"

model_config:
  config_path: "~/.pi/agent/models.json"
  reader: "audiagentic.components.providers.adapters.pi.model_config:read_pi_models"
  writer: "audiagentic.components.providers.adapters.pi.model_config:write_pi_models"
  remover: "audiagentic.components.providers.adapters.pi.model_config:remove_pi_model"
  format: "pi-models-json"
  refresh_mode: "none"

model_entry_renderer: "audiagentic.components.providers.adapters.pi.model_entry:render_pi_model_entry"
supported_connectors:
  - openai-compatible
  - openai
  - anthropic

# One-shot gateway execution uses the shared YAML-driven CLI runner. Live
# sessions use the provider ACP builder in adapters/pi/acp.py instead.
execution:
  mode: cli
  executable: pi
  aliases: [pi]
  prompt-title: Pi
  error-code: EXT-PI-001
  extractor-name: pi-plaintext
  args-template: ["--print", "{model-flags}", "{prompt}"]
  model-flag: "--model"
  approval-mode-flags:
    yolo: []
    auto-edit: []

vendor_key_injection:
  openai: {mechanism: env, key: OPENAI_API_KEY}
  anthropic: {mechanism: env, key: ANTHROPIC_API_KEY}
  google: {mechanism: env, key: GEMINI_API_KEY}
  openrouter: {mechanism: env, key: OPENROUTER_API_KEY}
