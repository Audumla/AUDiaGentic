# Pi Coding Agent — provider descriptor
# Custom case: callable install/uninstall, custom probe, on_lsp_enabled hook

provider_id: pi
execution_isolation_tier: full-isolation
mcp_launch_isolation_tier: exact
# Declared launch capability (HA04): intent -> queryable channel surface the
# harness assembles (by role). The caller picks the intent; pi's builder owns
# the transports/channels.
#   execute      run one turn, captured (adapter.py, stdin-piped)
#   interactive  human tty (adapters/pi/interactive.py)
#   agent        live agent session (adapters/pi/acp.py; pi also offers RPC
#                hooks for observability)
launches:
  execute:
    interaction: [native]
    observability: [pipe]
  interactive:
    interaction: [native]
    observability: [pipe]
  agent:
    interaction: [acp]
    observability: [acp, rpc]
display_name: "Pi Coding Agent"
description: >-
  Lightweight local coding agent TUI by Earendil Works.
  Supports MCP tool use via the pi-mcp-adapter extension.
url: "https://www.earendilworks.com/pi"
access_mode: "none"

cli_probe: null

lsp_support_probe: "audiagentic.components.providers.adapters.pi.hooks:_pi_lens_present"

capabilities:
  cli-install:
    mechanism:
      package_manager: "pi-harness"
      package_name: "audiagentic-pi-harness"
      executable: "pi"
      install:
        type: callable
        id: install
        fn: "audiagentic.components.providers.adapters.pi.hooks:_pi_install"
      uninstall:
        type: callable
        id: uninstall
        fn: "audiagentic.components.providers.adapters.pi.hooks:_pi_uninstall"
      probe_fn: "audiagentic.components.providers.adapters.pi.hooks:_pi_probe"

  mcp:
    mechanism:
      config_path: ".mcp.json"
      reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
      writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
      remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
      format: "mcp-json"
      refresh_mode: "restart-required"

  models:
    mechanism:
      store:
        config_path: "~/.pi/agent/models.json"
        reader: "audiagentic.components.providers.adapters.pi.model_config:read_pi_models"
        writer: "audiagentic.components.providers.adapters.pi.model_config:write_pi_models"
        remover: "audiagentic.components.providers.adapters.pi.model_config:remove_pi_model"
        format: "pi-models-json"
        refresh_mode: "none"
      entry_renderer: "audiagentic.components.providers.adapters.pi.model_entry:render_pi_model_entry"
      connectors: [openai-compatible, openai, anthropic]
      credentials:
        openai: "env:OPENAI_API_KEY"
        anthropic: "env:ANTHROPIC_API_KEY"
        google: "env:GEMINI_API_KEY"
        openrouter: "env:OPENROUTER_API_KEY"
    evidence:
      note: >-
        native env var key injection; env vars effective at launch time;
        custom endpoints require models.json write; user-home write requires
        consent if global scope (tool_version 0.79.8)
      source: "docs/reference/model-source-evidence/pi.md#pi-evidence"

  lsp-self-support:
    mechanism: "audiagentic.components.providers.adapters.pi.hooks:_pi_ensure_lens"

  permissions:
    mechanism:
      can_write_files: true
      can_execute_shell: true
      can_browse_web: false
      can_read_env: true
      notes: >-
        TUI coding agent;
        MCP tool use available when pi-mcp-adapter is installed

  agent-files:
    mechanism:
      rel_path: ".pi"
      managed: false
      description: "Pi agent runtime directory"

  launch-isolation:
    evidence:
      note: >-
        request-owned config via pi-mcp-adapter with exclusive discovery;
        requires a compatible installed pi-mcp-adapter (verified, tool_version
        repository)
      source: "tests/unit/providers/test_mcp_launch_isolation.py"

  model-local-state:
    evidence:
      note: >-
        ~/.pi/agent/models.json with providers/models[]/baseUrl/apiKey/compat
        shape; home-scoped, not project-local; for custom/local endpoints
        only, not required for native vendors (tool_version 0.79.8)
      source: "docs/reference/model-source-evidence/pi.md#pi-evidence"

# One-shot gateway execution uses the shared YAML-driven CLI runner. Live
# sessions use the provider ACP builder in adapters/pi/acp.py instead.
execution:
  mode: cli
  executable: pi
  aliases: [pi]
  prompt-title: Pi
  error-code: EXT-PI-001
  extractor-name: pi-plaintext
  args-template: ["--print", "{model-flags}"]
  # {prompt} omitted — goes via stdin (run_streaming_command input_text=)
  # to preserve embedded newlines; Pi's --print drops the first newline
  # when the prompt arrives as a CLI argument (SH21).
  model-flag: "--model"
  approval-mode-flags:
    yolo: []
    auto-edit: []
