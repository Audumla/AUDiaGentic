# Pi Coding Agent — provider descriptor
# Custom case: callable install/uninstall, custom probe, on_lsp_enabled hook

provider_id: pi
execution_isolation_tier: full-isolation
mcp_launch_isolation_tier: exact
display_name: "Pi Coding Agent"
description: >-
  Lightweight local coding agent TUI by Earendil Works.
  Supports MCP tool use via the pi-mcp-adapter extension.
url: "https://www.earendilworks.com/pi"
access_mode: "none"

capabilities:
  cli-install:
    mechanism:
      package_manager: "pi-harness"
      package_name: "audiagentic-pi-harness"
      executable: "pi"
      install:
        type: callable
        id: install
        fn: "audiagentic.components.providers.adapters.pi.hooks:_pi_install"
      uninstall:
        type: callable
        id: uninstall
        fn: "audiagentic.components.providers.adapters.pi.hooks:_pi_uninstall"
      probe_fn: "audiagentic.components.providers.adapters.pi.hooks:_pi_probe"

  mcp:
    mechanism:
      config_path: ".pi/mcp.json"
      reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
      writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
      remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
      transports: [stdio, http] # json_format.py:84-87 emits {type, url, headers} when entry.is_remote
      format: "mcp-json"
      refresh_mode: "restart-required"

  models:
    mechanism:
      store:
        config_path: "audiagentic.components.providers.adapters.pi.model_config:resolve_pi_models_config_path"
        reader: "audiagentic.components.providers.adapters.pi.model_config:read_pi_models"
        writer: "audiagentic.components.providers.adapters.pi.model_config:write_pi_models"
        remover: "audiagentic.components.providers.adapters.pi.model_config:remove_pi_model"
        format: "pi-models-json"
        refresh_mode: "none"
      entry_renderer: "audiagentic.components.providers.adapters.pi.model_entry:render_pi_model_entry"
      connectors: [openai-compatible, openai, anthropic]
      credentials:
        openai: "env:OPENAI_API_KEY"
        anthropic: "env:ANTHROPIC_API_KEY"
        google: "env:GEMINI_API_KEY"
        openrouter: "env:OPENROUTER_API_KEY"
    evidence:
      note: >-
        native env var key injection; env vars effective at launch time;
        custom endpoints require models.json write; user-home write requires
        consent if global scope (tool_version 0.79.8)
      source: "docs/reference/model-source-evidence/pi.md#pi-evidence"

  lsp-self-support:
    mechanism:
      on_enabled: "audiagentic.components.providers.adapters.pi.hooks:_pi_ensure_lens"
      probe: "audiagentic.components.providers.adapters.pi.hooks:_pi_lens_present"

  permissions:
    mechanism:
      can_write_files: true
      can_execute_shell: true
      can_browse_web: false
      can_read_env: true
      notes: >-
        TUI coding agent;
        MCP tool use available when pi-mcp-adapter is installed

  agent-files:
    mechanism:
      rel_path: ".pi"
      managed: false
      description: "Pi agent runtime directory"

  launch-isolation:
    evidence:
      note: >-
        request-owned config via pi-mcp-adapter with exclusive discovery;
        requires a compatible installed pi-mcp-adapter (verified, tool_version
        repository)
      source: "tests/unit/providers/test_mcp_launch_isolation.py"

  model-local-state:
    evidence:
      note: >-
        ~/.pi/agent/models.json with providers/models[]/baseUrl/apiKey/compat
        shape; home-scoped, not project-local; for custom/local endpoints
        only, not required for native vendors (tool_version 0.79.8)
      source: "docs/reference/model-source-evidence/pi.md#pi-evidence"

  launch:
    mechanism:
      # Declared launch capability (HA04): intent -> queryable channel surface
      # the harness assembles (by role). The caller picks the intent; pi's
      # builder owns the transports/channels.
      #   execute      run one turn, captured (adapter.py, stdin-piped)
      #   interactive  human tty (adapters/pi/interactive.py)
      #   agent        live agent session (adapters/pi/acp.py; pi also offers
      #                RPC hooks for observability)
      intents:
        execute:
          interaction: [native]
          observability: [pipe]
        interactive:
          interaction: [native]
          observability: [pipe]
        agent:
          interaction: [acp]
          observability: [acp, rpc]
      # One-shot gateway execution uses the shared YAML-driven CLI runner.
      # Live sessions use the provider ACP builder in adapters/pi/acp.py
      # instead (hand-written builder wins over any declarative recipe, so
      # interactive/acp need no recipe blocks here).
      recipes:
        execution:
          mode: cli
          executable: pi
          aliases: [pi]
          prompt-title: Pi
          error-code: EXT-PI-001
          extractor-name: pi-plaintext
          args-template: ["--print", "{model-flags}"]
          # {prompt} omitted — goes via stdin (run_streaming_command
          # input_text=) to preserve embedded newlines; Pi's --print drops
          # the first newline when the prompt arrives as a CLI argument (SH21).
          model-flag: "--model"
          approval-mode-flags:
            yolo: []
            auto-edit: []

# AS29 session-surface declaration for Pi's ACP route.
# pi-rpc (JSONL agent/turn/message/tool events via `pi --mode rpc --no-session`)
# is Pi's primary observability route and has no session_surfaces entry yet —
# see harness_observability_inventory.py#pi-pi-rpc. pi-community-acp below is
# the ACP-transport route exercised end-to-end by AS40's tee-shim proofs.
session_surfaces:
  - surface_id: pi-community-acp
    version_constraint: ">=0.80"
    # resume-by-ref: proven 2026-07-29 (tests/integration/providers/
    # test_pi_acp_resume_live.py, real pi-acp bridge, linux-amd64 Docker) —
    # agentCapabilities.loadSession is advertised AND session/load genuinely
    # replays prior turn content in a fresh process after a hard kill of the
    # original (structural proof via replayed session_update notifications,
    # not LLM-recall guessing). Not yet proven on windows-amd64/macOS.
    identity_operations:
      open: "supported"
      attach-existing: "unsupported"
      resume-by-ref: "supported"
      discover: "unsupported"
    ownership_modes:
      - "owned"
    controls:
      cancel-turn: "supported"
      interrupt-turn: "unsupported"
      steer-turn: "unsupported"
      respond-permission: "unsupported"
      close-session: "supported"
    lifecycle_source: "transport"
    lifecycle_installation: "none"
    content_channels:
      - channel: "assistant-text"
        max_bytes: 65536
        max_events: 100
    evidence:
      validated: true
      reference: "tests/integration/providers/test_pi_rpc_tap_real_binaries.py"
    # Platform evidence — AS40 (2026-07-29) proved byte-transparent ACP
    # passthrough plus a full conversational turn through the tee shim on
    # both platforms below. No macOS evidence exists yet.
    platforms:
      - platform: "windows-amd64"
        tool_version: "0.82.1"
        probe_artifact: "tests/integration/providers/test_pi_rpc_tap_real_binaries.py"
        evidence:
          validated: true
          reference: "tests/integration/providers/test_pi_rpc_tap_real_binaries.py"
      - platform: "linux-amd64"
        tool_version: "0.82.1"
        probe_artifact: "tests/docker/Dockerfile.pi-rpc-tap-e2e"
        evidence:
          # pi-lens-ignore: line-length
          validated: true
          reference: "tests/integration/providers/test_pi_rpc_tap_transcript_e2e.py"
      - platform: "darwin-arm64"
        evidence:
          validated: false
          reference: ""
      - platform: "darwin-amd64"
        evidence:
          validated: false
          reference: ""
    adapter_ref: "audiagentic.components.providers.adapters.pi.acp:build_acp_launch"

# CC53: AS27 harness-observability inventory (this provider's own facts —
# see harness_observability_inventory.py for the domain semantics).
harness_observability:
  - surface_id: pi-rpc
    candidate_source: JSONL agent/turn/message/tool events via pi --mode rpc --no-session
    evidence:
      validated: false
      reference: primary Pi route; prove schema/correlation/lifecycle/close semantics
    recipe: A
    lifecycle_source: none
    # pi-lens-ignore: line-length
    probe_anchor: primary Pi route; prove schema/correlation/lifecycle/close semantics
  - surface_id: pi-community-acp
    # pi-lens-ignore: line-length
    candidate_source: "community ACP adapter (optional route, never primary — pi-rpc is primary)"
    # AS41 Path A: this surface uses the same provider-neutral
    # AcpAgentSessionTransport wrapper OpenCode's opencode-acp surface does —
    # _map_acp_event_to_observation (foundation/transports/acp.py) is already
    # provider-agnostic. Only "model-thinking" (ACTIVITY -> assistant-message)
    # is claimed — that is what a real driven prompt turn actually proved
    # (Docker E2E: real pi-acp + real embedded model, session/new +
    # session/prompt through to a real assistant reply). tool-calling/
    # waiting-permission are NOT claimed: no test drove Pi through a tool
    # call or a permission request via ACP, so claiming those statuses would
    # invent capability rather than report proven evidence (AS41's own
    # doctrine).
    evidence:
      validated: true
      reference: tests/integration/providers/test_pi_rpc_tap_transcript_e2e.py
    recipe: A
    lifecycle_source: transport
    supported_statuses:
      - model-thinking
    probe_anchor: tests/integration/providers/test_pi_rpc_tap_transcript_e2e.py
    # linux-amd64: that Docker E2E test is the real proof of an actual
    # model-thinking-producing prompt turn there.
    # windows-amd64 (2026-08-09): test_pi_rpc_tap_real_binaries.py gained
    # test_real_pi_acp_drives_a_full_prompt_turn_against_local_rig_on_windows,
    # a native (non-Docker) host test — real pi-acp bridge, real pi binary,
    # real local embedded rig, session/new -> session/prompt through to a
    # real end_turn completion, run and passing on windows-amd64. Closes the
    # gap the previous comment here documented (session/new handshake alone
    # is not a prompt-turn proof); the new test is the one that actually
    # drives a turn on this platform.
    platform_evidence:
      - linux-amd64
      - windows-amd64
