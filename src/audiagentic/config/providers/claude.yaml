# Claude (Anthropic) — provider descriptor
# Common case: npm install, MCP JSON config, VS Code extension, callable hooks

provider_id: claude
execution_isolation_tier: no-isolation
display_name: "Claude (Anthropic)"
description: "Anthropic's Claude Code CLI. Agentic coding assistant with deep codebase understanding and MCP tool use."
url: "https://claude.ai/code"
prompt_aliases:
  - cld

capabilities:
  cli-install:
    mechanism:
      toolchain: npm
      package: "@anthropic-ai/claude-code"
      executable: claude
      probe: [claude, "--version"]

  host-extensions:
    mechanism:
      host: vscode
      capability_id: "anthropic.claude-code"
      display_name: "Claude Code"

  mcp:
    mechanism:
      config_path: "~/.claude/mcp.json"
      reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
      writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
      remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
      format: "mcp-json"
      refresh_mode: "file-watch"

  models:
    mechanism:
      refresh: "audiagentic.components.providers.adapters.claude.catalog:_fetch_claude_catalog"

  surface-skill:
    mechanism: ".claude/skills/{tag}/SKILL.md"

  surface-instruction:
    mechanism: "CLAUDE.md"

  permissions:
    mechanism:
      can_write_files: true
      can_execute_shell: true
      can_browse_web: true
      can_read_env: true
      notes: "Full project access via tool use; bash, file read/write, web fetch"

  agent-files:
    - mechanism:
        rel_path: "CLAUDE.md"
        managed: true
        description: "Project instructions / system prompt"
    - mechanism:
        rel_path: ".claude/rules/prompt-tags.md"
        managed: true
        description: "Canonical prompt tag rules"
    - mechanism:
        rel_path: ".claude/settings.json"
        managed: false
        description: "Claude Code user settings"

# CC53: AS27 harness-observability inventory (this provider's own facts —
# see harness_observability_inventory.py for the domain semantics).
harness_observability:
  - surface_id: claude-acp
    candidate_source: ACP adapter
    evidence:
      validated: false
      reference: verify package, launch, terminal and correlation
    recipe: A
    lifecycle_source: none
    probe_anchor: verify package, launch, terminal and correlation
  - surface_id: claude-cli
    candidate_source: "native hooks: UserPromptSubmit/PreToolUse/PostToolUse/Stop/SessionEnd"
    evidence:
      validated: false
      reference: project hook lifecycle and non-vetoing emitter proof
    recipe: B
    lifecycle_source: none
    probe_anchor: project hook lifecycle and non-vetoing emitter proof
