# Codex (OpenAI) — provider descriptor
# Toolchain-based install (npm), TOML MCP/LSP config, VS Code extension

provider_id: codex
execution_isolation_tier: full-isolation
display_name: "Codex (OpenAI)"
description: "OpenAI's CLI coding agent. Runs tasks autonomously in a sandboxed environment."
url: "https://github.com/openai/codex"
prompt_aliases:
  - cx

capabilities:
  surface-instruction:
    mechanism: "AGENTS.md"

  cli-install:
    mechanism:
      toolchain: npm
      package: "@openai/codex"
      executable: codex
      probe: [codex, "--version"]

  host-extensions:
    mechanism:
      host: vscode
      capability_id: "openai.chatgpt"
      display_name: "ChatGPT / OpenAI"

  mcp:
    mechanism:
      config_path: ".codex/config.toml"
      reader: "audiagentic.components.providers.adapters.codex.mcp_format:read_codex_toml"
      writer: "audiagentic.components.providers.adapters.codex.mcp_format:write_codex_toml"
      remover: "audiagentic.components.providers.adapters.codex.mcp_format:remove_codex_toml"
      transports: [stdio] # codex-toml writer emits command/args entries only
      format: "codex-toml"
      refresh_mode: "restart-required"

  lsp-config:
    mechanism:
      config_path: ".codex/config.toml"
      reader: "audiagentic.components.providers.adapters.codex.language_servers:read_language_servers_codex"
      writer: "audiagentic.components.providers.adapters.codex.language_servers:write_language_servers_codex"
      remover: "audiagentic.components.providers.adapters.codex.language_servers:remove_language_servers_codex"
      format: "codex-toml"

  hooks:
    mechanism:
      config_path: "audiagentic.components.providers.adapters.codex.hooks_format:resolve_codex_hooks_path"
      reader: "audiagentic.components.providers.adapters.codex.hooks_format:read_codex_hooks"
      writer: "audiagentic.components.providers.adapters.codex.hooks_format:write_codex_hooks"
      remover: "audiagentic.components.providers.adapters.codex.hooks_format:remove_codex_hook"
      format: "codex-hooks-json"
      refresh_mode: "restart-required"

  surface-skill:
    mechanism: ".agents/skills/{tag}/SKILL.md"

  permissions:
    mechanism:
      can_write_files: true
      can_execute_shell: true
      can_browse_web: false
      can_read_env: true
      notes: "CLI agent; full-auto mode supported, sandboxed shell execution"

  agent-files:
    mechanism:
      rel_path: "AGENTS.md"
      managed: false
      description: "Codex project instructions"

  model-local-state:
    evidence:
      note: >-
        ~/.codex/config.toml with [model_providers.<id>] blocks (name,
        base_url, env_key, wire_api); user-global primary authority,
        project-local .codex/config.toml also present; project-scope
        precedence over global config NOT verified — key blocker for
        automation (tool_version 0.87.0) — BLOCKED: verify project-scope
        .codex/config.toml precedence over ~/.codex/config.toml.
      source: "docs/reference/model-source-evidence/codex.md#codex-evidence"

  # --- ACP protocol-feature evidence (plan agent-sessions AS13/AS14) -----
  # One neutral kind, one list entry per feature so verification status
  # (verified/planned/blocked) stays per-feature. Evidence-only per boundary
  # rules — the executable authority is the adapter's acp submodule hook
  # (load_acp_launch_builder) consumed by gateway session dispatch.
  acp:
    - mechanism:
        feature: stdio-transport
      evidence:
        note: >-
          @agentclientprotocol/codex-acp bridge (npx or local binary) exposing
          an ACP stdio server over Codex App Server; launched via
          adapters/codex/acp.py build_acp_launch. Bridge package is not yet a
          managed install (AS13 step 2 — aux_installs extension); npx fallback
          is ad-hoc. Cannot attach to an already-open interactive Codex TUI —
          the ACP client owns the session. model_id passthrough unverified;
          model selection rides on codex config.toml/CODEX_HOME. NEXT: AS13
          managed install, model passthrough verification, live validation
          against real codex-acp.
        source: "tests/unit/providers/test_codex_acp_launch.py"
    - mechanism:
        feature: live-session
      evidence:
        note: >-
          gateway SessionRuntime keep-alive session over the codex-acp stdio
          bridge (session_keep_alive / session_id request fields); default-deny
          permission policy may block codex approval requests until a policy_fn
          story exists; unvalidated live — launch builder and routing tested
          with fakes only. NEXT: AS13 live two-turn context retention + clean
          close on real codex-acp.
        source: "tests/unit/providers/test_codex_acp_launch.py"
    - mechanism:
        feature: session-resume
      evidence:
        note: >-
          planned: ACP session/load if codex-acp advertises it; natively
          thread/resume via Codex App Server. Not implemented; ACP-created
          codex sessions are known not to appear in CLI /resume listing
          (upstream gap) — resume must be by persisted provider-session-ref,
          never by discovery. NEXT: AS10 (ACP session/load) / AS14 (App Server
          thread/resume).
        source: "docs/planning/active/agent-sessions/AS14.md"
    - mechanism:
        feature: shared-live-session
      evidence:
        note: >-
          planned: Codex App Server ws JSON-RPC (codex app-server --listen)
          with human TUI and gateway as peer clients; turn/start, turn/steer,
          turn/interrupt. Upstream ws transport experimental — localhost/SSH
          tunnel only, no TLS/auth assumptions; no gateway integration yet,
          requires external-process-ownership mode in SessionRuntime. NEXT:
          AS14 design + implementation after AS11 trial evidence.
        source: "docs/planning/active/agent-sessions/AS14.md"

# CC53: AS27 harness-observability inventory (this provider's own facts —
# see harness_observability_inventory.py for the domain semantics).
harness_observability:
  - surface_id: codex-acp
    candidate_source: ACP adapter bridge
    evidence:
      validated: false
      reference: AS13 bridge/version proof
    recipe: A
    lifecycle_source: none
    probe_anchor: AS13 bridge/version proof
  - surface_id: codex-cli
    candidate_source: native hooks TOML reader/writer/remover
    evidence:
      validated: false
      reference: installed TOML/hooks reader-writer-remover proof
    recipe: B
    lifecycle_source: none
    probe_anchor: installed TOML/hooks reader-writer-remover proof
