# Codex (OpenAI) — provider descriptor
# Toolchain-based install (npm), TOML MCP/LSP config, VS Code extension

provider_id: codex
automation_capabilities:

  - family_id: cli-lifecycle
    supported_modes: [plan, apply, prune, status]
    payload_contract: provider-cli-lifecycle-payload/v1
    result_contract: provider-cli-lifecycle-result/v1
    ownership_scope_required: false
  - family_id: managed-mcp
    supported_modes: [apply, prune, status]
    payload_contract: provider-managed-mcp-payload/v1
    result_contract: provider-managed-mcp-result/v1
    ownership_scope_required: true
  - family_id: managed-hooks
    supported_modes: [apply, prune, status]
    payload_contract: provider-managed-hooks-payload/v1
    result_contract: provider-managed-hooks-result/v1
    ownership_scope_required: true
  - family_id: language-server-projection
    supported_modes: [apply, prune, status]
    payload_contract: provider-language-server-projection-payload/v1
    result_contract: provider-language-server-projection-result/v1
    ownership_scope_required: true
  - family_id: generated-surfaces
    supported_modes: [plan, apply, prune, status]
    payload_contract: provider-generated-surface-payload/v1
    result_contract: provider-generated-surface-result/v1
    ownership_scope_required: true
display_name: "Codex (OpenAI)"
description: "OpenAI's CLI coding agent. Runs tasks autonomously in a sandboxed environment."
url: "https://github.com/openai/codex"
prompt_aliases:
  - cx

cli_probe:
  - codex
  - "--version"

cli_install:
  toolchain: npm
  package: "@openai/codex"
  executable: codex

host_capabilities:
  - host: vscode
    capability_id: "openai.chatgpt"
    display_name: "ChatGPT / OpenAI"

capability_facts:
  - capability_id: cli-install
    subject: cli_install
    mechanism: "npm install: @openai/codex with shell probe codex --version"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/codex.yaml#cli_install"
      review_state: verified
  - capability_id: host-extension
    subject: host_capabilities
    mechanism: "vscode extension openai.chatgpt"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/codex.yaml#host_capabilities"
      review_state: verified
  - capability_id: mcp-config
    subject: mcp_config
    mechanism: "reader/writer/remover over .codex/config.toml (TOML format, stdio-only)"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/codex.yaml#mcp_config"
      review_state: verified
  - capability_id: lsp-config
    subject: language_servers_config
    mechanism: "reader/writer/remover over .codex/config.toml (TOML format)"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/codex.yaml#language_servers_config"
      review_state: verified
  - capability_id: surfaces
    subject: skill_surface_path
    mechanism: ".agents/skills/{tag}/SKILL.md skill path with AGENTS.md instruction file"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/codex.yaml#skill_surface_path"
      review_state: verified
  - capability_id: perm-declaration
    subject: permissions
    mechanism: "ProviderPermissions boolean flags"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/codex.yaml#permissions"
      review_state: verified
  - capability_id: model-config-surface
    subject: "external:model-config-surface"
    mechanism: "~/.codex/config.toml with [model_providers.<id>] blocks (name, base_url, env_key, wire_api)"
    constraints:
      - "user-global primary authority; project-local .codex/config.toml also present"
    limitations:
      - "project-scope precedence over global config NOT verified — key blocker for automation"
    support_assessment: blocked
    action_needed: "Verify project-scope .codex/config.toml precedence over ~/.codex/config.toml."
    evidence:
      evidence_tier: unverified
      tool_version: "0.87.0"
      fact_anchor: "docs/reference/model-source-evidence/codex.md#codex-evidence"
      review_state: pending-review
  # --- ACP capability family (plan agent-sessions AS13/AS14) -------------
  # Segregates ACP/live-session features so they can be requested per state
  # while the capability is being built out. Evidence-only per boundary
  # rules — the executable authority is the adapter's acp submodule hook
  # (load_acp_launch_builder) consumed by gateway session dispatch.
  - capability_id: acp-stdio-transport
    subject: "external:acp-stdio-transport"
    mechanism: "@agentclientprotocol/codex-acp bridge (npx or local binary) exposing an ACP stdio server over Codex App Server; launched via adapters/codex/acp.py build_acp_launch"
    constraints:
      - "bridge package is not yet a managed install (AS13 step 2 — aux_installs extension); npx fallback is ad-hoc"
    limitations:
      - "cannot attach to an already-open interactive Codex TUI — the ACP client owns the session"
      - "model_id passthrough unverified; model selection rides on codex config.toml/CODEX_HOME"
    support_assessment: partial
    action_needed: "AS13: managed install, model passthrough verification, live validation against real codex-acp."
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "tests/unit/providers/test_codex_acp_launch.py"
      review_state: pending-review
  - capability_id: acp-live-session
    subject: "external:acp-live-session"
    mechanism: "gateway SessionRuntime keep-alive session over the codex-acp stdio bridge (session_keep_alive / session_id request fields)"
    constraints:
      - "default-deny permission policy may block codex approval requests until a policy_fn story exists"
    limitations:
      - "unvalidated live — launch builder and routing tested with fakes only"
    support_assessment: partial
    action_needed: "AS13: live two-turn context retention + clean close on real codex-acp."
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "tests/unit/providers/test_codex_acp_launch.py"
      review_state: pending-review
  - capability_id: acp-session-resume
    subject: "external:acp-session-resume"
    mechanism: "planned: ACP session/load if codex-acp advertises it; natively thread/resume via Codex App Server"
    constraints: []
    limitations:
      - "not implemented; ACP-created codex sessions are known not to appear in CLI /resume listing (upstream gap) — resume must be by persisted provider-session-ref, never by discovery"
    support_assessment: blocked
    action_needed: "AS10 (ACP session/load) / AS14 (App Server thread/resume)."
    evidence:
      evidence_tier: documentation
      tool_version: "0.87.0"
      fact_anchor: "docs/planning/active/agent-sessions/AS14.md"
      review_state: pending-review
  - capability_id: acp-shared-live-session
    subject: "external:acp-shared-live-session"
    mechanism: "planned: Codex App Server ws JSON-RPC (codex app-server --listen) with human TUI and gateway as peer clients; turn/start, turn/steer, turn/interrupt"
    constraints:
      - "upstream ws transport experimental — localhost/SSH tunnel only, no TLS/auth assumptions"
    limitations:
      - "no gateway integration yet; requires external-process-ownership mode in SessionRuntime"
    support_assessment: blocked
    action_needed: "AS14 design + implementation after AS11 trial evidence."
    evidence:
      evidence_tier: documentation
      tool_version: "0.87.0"
      fact_anchor: "docs/planning/active/agent-sessions/AS14.md"
      review_state: pending-review

permissions:
  can_write_files: true
  can_execute_shell: true
  can_browse_web: false
  can_read_env: true
  notes: "CLI agent; full-auto mode supported, sandboxed shell execution"

instruction_file: "AGENTS.md"
skill_surface_path: ".agents/skills/{tag}/SKILL.md"

agent_files:
  - rel_path: "AGENTS.md"
    managed: false
    description: "Codex project instructions"

mcp_config:
  remote: false  # config format is stdio-only; url-form entries are not expressible
  config_path: ".codex/config.toml"
  reader: "audiagentic.components.providers.adapters.codex.mcp_format:read_codex_toml"
  writer: "audiagentic.components.providers.adapters.codex.mcp_format:write_codex_toml"
  remover: "audiagentic.components.providers.adapters.codex.mcp_format:remove_codex_toml"
  format: "codex-toml"
  refresh_mode: "restart-required"

language_servers_config:
  config_path: ".codex/config.toml"
  reader: "audiagentic.components.providers.adapters.codex.language_servers:read_language_servers_codex"
  writer: "audiagentic.components.providers.adapters.codex.language_servers:write_language_servers_codex"
  remover: "audiagentic.components.providers.adapters.codex.language_servers:remove_language_servers_codex"
  format: "codex-toml"

hooks_config:
  config_path: "~/.codex/hooks.json"
  reader: "audiagentic.components.providers.adapters.codex.hooks_format:read_codex_hooks"
  writer: "audiagentic.components.providers.adapters.codex.hooks_format:write_codex_hooks"
  remover: "audiagentic.components.providers.adapters.codex.hooks_format:remove_codex_hook"
  format: "codex-hooks-json"
  refresh_mode: "restart-required"
