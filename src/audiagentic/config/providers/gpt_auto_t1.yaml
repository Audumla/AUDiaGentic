# gpt-auto-t1 — provider descriptor
# Dedicated GP05 test-project alias of gpt-auto: same CDP browser-automation
# implementation (adapters/gpt_auto_t1 re-exports adapters/gpt_auto), routed
# to a separate real ChatGPT project (gpt-t1) via its own provider settings
# file so concurrent/edge-case live testing never touches the real
# gpt-auto review project.

provider_id: gpt-auto-t1
execution_isolation_tier: no-isolation
display_name: "gpt-auto-t1 (GP05 test project)"
description: >-
  Browser-driven ChatGPT via CDP connect, dedicated to the gpt-t1 test
  project for GP05 concurrent/edge-case live testing. Same implementation as
  gpt-auto; only the target ChatGPT project differs.
url: "https://chat.openai.com"
prompt_aliases: []

access_mode: none

receive_lsp_mcp: false

capabilities:
  permissions:
    mechanism:
      can_write_files: false
      can_execute_shell: false
      can_browse_web: true
      can_read_env: false
      notes: >-
        Browser automation only. No file writes, no shell, no MCP, no LSP.
        The provider controls a Chrome/Brave browser via CDP to interact with ChatGPT.

  launch:
    mechanism:
      recipes:
        execution:
          mode: stub
          message: >-
            gpt-auto-t1 runs only through the Gateway session transport and
            its shared browser runtime, not a disposable CLI recipe.

  model-config-projection:
    evidence:
      note: >-
        No model configuration — the model is determined by the user's
        ChatGPT session. The provider does not support model selection
        or model switching.
      source: "src/audiagentic/components/providers/adapters/gpt_auto/config.py"

  model-local-state:
    evidence:
      note: >-
        ChatGPT login state is maintained in the running browser (Brave/Chrome)
        with --remote-debugging-port. No API keys or credentials stored by the
        provider itself. Session reuse across runs is supported via browser persistence.
      source: "src/audiagentic/components/providers/adapters/gpt_auto/runtime.py"

harness_observability:
  - surface_id: gpt-auto-browser
    candidate_source: shared Python CDP/browser runtime
    evidence:
      validated: true
      reference: tests/gpt_auto/test_session_transport_live.py
    recipe: A
    lifecycle_source: transport
    probe_anchor: runtime.py ensure_available() and turn.py GptAutoTurn.run()

session_surfaces:
  - surface_id: gpt-auto-cdp
    version_constraint: ">=1.0"
    identity_operations:
      open: "supported"
      attach-existing: "unsupported"
      resume-by-ref: "supported"
      discover: "unsupported"
    mapping_facts:
      ref_namespace: "provider-session-ref"
      requires_same_project: true
      requires_same_execution_context: false
    ownership_modes:
      - "external"
    controls:
      cancel-turn: "supported"
      interrupt-turn: "unsupported"
      steer-turn: "unsupported"
      respond-permission: "unsupported"
      close-session: "supported"
    lifecycle_source: "none"
    content_channels:
      - channel: "assistant-text"
        max_bytes: 65536
        max_events: 100
    evidence:
      validated: true
      reference: "tests/gpt_auto/test_session_transport_live.py"
    platforms:
      - platform: "windows-amd64"
        evidence:
          validated: true
          reference: "tests/gpt_auto/test_session_transport_live.py"
