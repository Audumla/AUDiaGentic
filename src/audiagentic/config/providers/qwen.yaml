# Qwen (Alibaba) — provider descriptor
# Toolchain-based install (npm), custom probe, MCP JSON + LSP config, VS Code extension

provider_id: qwen
display_name: "Qwen (Alibaba)"
description: "Alibaba Cloud's Qwen Code CLI. Open-source coding agent built on the Qwen model family."
url: "https://github.com/QwenLM/qwen-code"
prompt_aliases:
  - qw

cli_probe:
  - qwen
  - "--version"

cli_install:
  toolchain: npm
  package: "@qwen-code/qwen-code"
  executable: qwen
  probe_fn: "audiagentic.components.providers.adapters.qwen.hooks:_qwen_probe"

host_capabilities:
  - host: vscode
    capability_id: "qwenlm.qwen-code-vscode-ide-companion"
    display_name: "Qwen Code Companion"

permissions:
  can_write_files: true
  can_execute_shell: true
  can_browse_web: false
  can_read_env: true
  notes: "CLI agent; Alibaba Cloud account auth required"

instruction_file: "QWEN.md"

agent_files: []

mcp_config:
  config_path: ".mcp.json"
  reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
  writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
  remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
  format: "mcp-json"
  refresh_mode: "file-watch"

language_servers_config:
  config_path: ".lsp.json"
  reader: "audiagentic.components.providers.adapters.qwen.language_servers:read_language_servers_qwen"
  writer: "audiagentic.components.providers.adapters.qwen.language_servers:write_language_servers_qwen"
  remover: "audiagentic.components.providers.adapters.qwen.language_servers:remove_language_servers_qwen"
  format: "qwen-lsp-json"

surfaces:
  renderer: flat-skill
  contribution-file: "QWEN.md"

execution:
  mode: cli
  executable: qwen
  aliases: [qwen]
  prompt-title: Qwen
  error-code: EXT-QWEN-001
  extractor-name: qwen-plaintext
  args-template: ["{approval-flags}", "{model-flags}", "{prompt}"]
  model-flag: "-m"
  approval-mode-flags:
    yolo: ["--yolo"]
    auto-edit: ["--approval-mode", "auto-edit"]
