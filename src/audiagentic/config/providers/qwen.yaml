# Qwen (Alibaba) — provider descriptor
# Toolchain-based install (npm), custom probe, MCP JSON + LSP config, VS Code extension

provider_id: qwen
execution_isolation_tier: full-isolation
display_name: "Qwen (Alibaba)"
description: "Alibaba Cloud's Qwen Code CLI. Open-source coding agent built on the Qwen model family."
url: "https://github.com/QwenLM/qwen-code"
prompt_aliases:
  - qw

capabilities:
  cli-install:
    mechanism:
      toolchain: npm
      package: "@qwen-code/qwen-code"
      executable: qwen
      probe: [qwen, "--version"]
      probe_fn: "audiagentic.components.providers.adapters.qwen.hooks:_qwen_probe"

  host-extensions:
    mechanism:
      host: vscode
      capability_id: "qwenlm.qwen-code-vscode-ide-companion"
      display_name: "Qwen Code Companion"

  mcp:
    mechanism:
      config_path: "~/.qwen/settings.json"
      reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
      writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
      remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
      transports: [stdio, http]  # json_format.py:84-87 emits {type, url, headers} when entry.is_remote
      format: "mcp-json"
      refresh_mode: "restart-required"

  lsp-config:
    mechanism:
      config_path: ".lsp.json"
      reader: "audiagentic.components.providers.adapters.qwen.language_servers:read_language_servers_qwen"
      writer: "audiagentic.components.providers.adapters.qwen.language_servers:write_language_servers_qwen"
      remover: "audiagentic.components.providers.adapters.qwen.language_servers:remove_language_servers_qwen"
      format: "qwen-lsp-json"

  surfaces:
    mechanism:
      renderer: flat-skill
      contribution-file: "QWEN.md"

  surface-instruction:
    mechanism: "QWEN.md"

  permissions:
    mechanism:
      can_write_files: true
      can_execute_shell: true
      can_browse_web: false
      can_read_env: true
      notes: "CLI agent; Alibaba Cloud account auth required"

  models:
    mechanism:
      credentials:
        openai: "env:OPENAI_API_KEY"
        anthropic: "env:ANTHROPIC_API_KEY"
        google: "env:GEMINI_API_KEY"
    evidence:
      note: >-
        --auth-type with env vars: OPENAI_API_KEY, ANTHROPIC_API_KEY,
        GEMINI_API_KEY; only one auth-type active at a time; cannot have
        multiple vendors enabled concurrently (tool_version 0.13.1)
      source: "docs/reference/model-source-evidence/qwen.md#qwen-evidence"

  model-local-state:
    evidence:
      note: >-
        ~/.qwen/settings.json with security.auth.selectedType and model.name;
        user-global, home-scoped; project-local config path not verified
        (tool_version 0.13.1)
      source: "docs/reference/model-source-evidence/qwen.md#qwen-evidence"

  launch:
    mechanism:
      # Launch capability (HA04): CLI-only, so the execute intent over native
      # pipe. No live interactive/agent launch.
      intents:
        execute:
          interaction: [native]
          observability: [pipe]
      recipes:
        execution:
          mode: cli
          executable: qwen
          aliases: [qwen]
          prompt-title: Qwen
          error-code: EXT-QWEN-001
          extractor-name: qwen-plaintext
          args-template: ["{approval-flags}", "{model-flags}", "{prompt}"]
          model-flag: "-m"
          approval-mode-flags:
            yolo: ["--yolo"]
            auto-edit: ["--approval-mode", "auto-edit"]

# CC53: AS27 harness-observability inventory (this provider's own facts —
# see harness_observability_inventory.py for the domain semantics).
harness_observability:
  - surface_id: qwen-acp
    candidate_source: npx @qwen-code/qwen-code --acp --experimental-skills
    evidence:
      validated: false
      reference: prove flag/event effects
    recipe: A
    lifecycle_source: none
    probe_anchor: prove flag/event effects
