# Cline — provider descriptor
# Toolchain-based install (npm), MCP JSON config, VS Code extension

provider_id: cline
display_name: "Cline"
description: "Autonomous coding agent VS Code extension. Supports any model via OpenRouter, Anthropic, OpenAI and others."
url: "https://cline.bot"
prompt_aliases:
  - cln

cli_probe:
  - cline
  - "--version"

cli_install:
  toolchain: npm
  package: cline
  executable: cline

host_capabilities:
  - host: vscode
    capability_id: "saoudrizwan.claude-dev"
    display_name: "Cline"

permissions:
  can_write_files: true
  can_execute_shell: true
  can_browse_web: true
  can_read_env: true
  notes: "VS Code extension with full tool use; operates primarily inside editor"

skill_surface_path: ".clinerules/skills/{tag}.md"

agent_files:
  - rel_path: ".clinerules/prompt-tags.md"
    managed: true
    description: "Canonical prompt tag rules for Cline"
  - rel_path: ".clinerules"
    managed: false
    description: "Cline rules directory"

mcp_config:
  config_path: ".mcp.json"
  reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
  writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
  remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
  format: "mcp-json"
  refresh_mode: "restart-required"
