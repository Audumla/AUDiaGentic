# Cline — provider descriptor
# Toolchain-based install (npm), MCP JSON config, VS Code extension

provider_id: cline
execution_isolation_tier: no-isolation
display_name: "Cline"
description: "Autonomous coding agent VS Code extension. Supports any model via OpenRouter, Anthropic, OpenAI and others."
url: "https://cline.bot"
prompt_aliases:
  - cln

capabilities:
  cli-install:
    mechanism:
      toolchain: npm
      package: cline
      executable: cline
      probe: [cline, "--version"]

  host-extensions:
    mechanism:
      host: vscode
      capability_id: "saoudrizwan.claude-dev"
      display_name: "Cline"

  mcp:
    mechanism:
      config_path: ".cline/mcp.json"
      reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
      writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
      remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
      transports: [stdio, http]  # json_format.py:84-87 emits {type, url, headers} when entry.is_remote
      format: "mcp-json"
      refresh_mode: "restart-required"

  surface-skill:
    mechanism: ".clinerules/skills/{tag}.md"

  permissions:
    mechanism:
      can_write_files: true
      can_execute_shell: true
      can_browse_web: true
      can_read_env: true
      notes: "VS Code extension with full tool use; operates primarily inside editor"

  agent-files:
    - mechanism:
        rel_path: ".clinerules"
        managed: false
        description: "Cline rules directory"

  models:
    evidence:
      note: >-
        credentials: cline auth --provider <id> --apikey <key> for
        openai-compatible, anthropic, gemini; single active model per
        session; no project-local config surface, all state in ~/.cline/
        (user-global) (tool_version 3.0.3)
      source: "docs/reference/model-source-evidence/cline.md#cline-evidence"

  model-local-state:
    evidence:
      note: >-
        ~/.cline/ directory with per-provider auth state, cron, data, kanban,
        worktrees; user-global, home-scoped; no project-local config surface
        discovered (tool_version 3.0.3)
      source: "docs/reference/model-source-evidence/cline.md#cline-evidence"

# CC53: AS27 harness-observability inventory (this provider's own facts —
# see harness_observability_inventory.py for the domain semantics).
harness_observability:
  - surface_id: cline-acp
    candidate_source: "ACP: npx @cline/cline-acp --mcp --acp"
    evidence:
      validated: false
      reference: session/turn/tool correlation proof
    recipe: A
    lifecycle_source: none
    probe_anchor: session/turn/tool correlation proof
  - surface_id: cline-sdk
    candidate_source: "AS54 surface_matrix: Cline SDK/runtime events -- probe exact SDK mode and lifecycle schema independently of ACP/CLI"
    evidence:
      validated: false
      reference: unsupported
    recipe: A
    lifecycle_source: none
  - surface_id: cline-hooks
    candidate_source: "AS54 surface_matrix: Cline hooks or JSONL CLI -- prove the exact mode supports stable session semantics and schema"
    evidence:
      validated: false
      reference: unsupported
    recipe: D
    lifecycle_source: none
