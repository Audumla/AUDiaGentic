# Goose (Block) — provider descriptor
# Explicit shell steps for install/uninstall, custom YAML MCP format

provider_id: goose
execution_isolation_tier: partial-isolation
display_name: "Goose (Block)"
description: "Open-source AI agent by Block. Extensible toolkit of MCP extensions for dev workflows."
url: "https://block.github.io/goose"

capabilities:
  cli-install:
    mechanism:
      package_manager: script
      package_name: "https://github.com/block/goose/releases/download/stable/download_cli.sh"
      executable: goose
      probe: [goose, "--version"]
      install:
        type: shell
        id: install
        command:
          - bash
          - "-lc"
          - "curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash"
      uninstall:
        type: shell
        id: uninstall
        command:
          - bash
          - "-lc"
          - "rm -f \"$HOME/.local/bin/goose\""

  mcp:
    mechanism:
      config_path: "~/.config/goose/config.yaml"
      reader: "audiagentic.components.providers.adapters.goose.mcp_format:read_goose_yaml"
      writer: "audiagentic.components.providers.adapters.goose.mcp_format:write_goose_yaml"
      remover: "audiagentic.components.providers.adapters.goose.mcp_format:remove_goose_yaml"
      transports: [stdio, http]  # goose extensions support type: streamable_http with uri/headers (INSTALL_MAP.md 9)
      format: "goose-yaml"
      refresh_mode: "restart-required"

  surfaces:
    mechanism:
      renderer: none
      contribution-file: "AGENTS.md"

  permissions:
    mechanism:
      can_write_files: true
      can_execute_shell: true
      can_browse_web: true
      can_read_env: true
      notes: "On-machine agent with MCP/tool orchestration and local/Ollama provider support"

  agent-files:
    - mechanism:
        rel_path: ".goose/config.yaml"
        managed: false
        description: "Goose project configuration"
    - mechanism:
        rel_path: "AGENTS.md"
        managed: false
        description: "Shared project instructions"

  launch:
    mechanism:
      recipes:
        execution:
          mode: stub
          aliases: [goose]
          message: "Goose adapter is registered; execution bridge not wired yet."

# CC53: AS27 harness-observability inventory (this provider's own facts —
# see harness_observability_inventory.py for the domain semantics).
harness_observability:
  - surface_id: goose-acp
    candidate_source: official ACP/API route
    evidence:
      validated: false
      reference: prove prompt terminal response and correlation
    recipe: A
    lifecycle_source: none
    probe_anchor: prove prompt terminal response and correlation
