# Goose (Block) — provider descriptor
# Explicit shell steps for install/uninstall, custom YAML MCP format

provider_id: goose
execution_isolation_tier: partial-isolation
automation_capabilities:
  - family_id: cli-lifecycle
    supported_modes: [plan, apply, prune, status]
    payload_contract: provider-cli-lifecycle-payload/v1
    result_contract: provider-cli-lifecycle-result/v1
    ownership_scope_required: false
  - family_id: managed-mcp
    supported_modes: [apply, prune, status]
    payload_contract: provider-managed-mcp-payload/v1
    result_contract: provider-managed-mcp-result/v1
    ownership_scope_required: true
  - family_id: generated-surfaces
    supported_modes: [plan, apply, prune, status]
    payload_contract: provider-generated-surface-payload/v1
    result_contract: provider-generated-surface-result/v1
    ownership_scope_required: true
display_name: "Goose (Block)"
description: "Open-source AI agent by Block. Extensible toolkit of MCP extensions for dev workflows."
url: "https://block.github.io/goose"

cli_probe:
  - goose
  - "--version"

cli_install:
  package_manager: script
  package_name: "https://github.com/block/goose/releases/download/stable/download_cli.sh"
  executable: goose
  install:
    type: shell
    id: install
    command:
      - bash
      - "-lc"
      - "curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash"
  uninstall:
    type: shell
    id: uninstall
    command:
      - bash
      - "-lc"
      - "rm -f \"$HOME/.local/bin/goose\""

host_capabilities: []

capability_facts:
  - capability_id: cli-install
    subject: cli_install
    mechanism: "curl-based install script with shell probe goose --version"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/goose.yaml#cli_install"
      review_state: verified
  - capability_id: mcp-config
    subject: mcp_config
    mechanism: >-
      reader/writer/remover over ~/.config/goose/config.yaml
      (YAML, streamable_http)
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/goose.yaml#mcp_config"
      review_state: verified
  - capability_id: surfaces
    subject: surfaces
    mechanism: "renderer: none with AGENTS.md contribution file"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/goose.yaml#surfaces"
      review_state: verified
  - capability_id: exec-adapter
    subject: execution
    mechanism: "mode: stub"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/goose.yaml#execution"
      review_state: verified
  - capability_id: perm-declaration
    subject: permissions
    mechanism: "ProviderPermissions boolean flags"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/goose.yaml#permissions"
      review_state: verified

permissions:
  can_write_files: true
  can_execute_shell: true
  can_browse_web: true
  can_read_env: true
  notes: "On-machine agent with MCP/tool orchestration and local/Ollama provider support"

agent_files:
  - rel_path: ".goose/config.yaml"
    managed: false
    description: "Goose project configuration"
  - rel_path: "AGENTS.md"
    managed: false
    description: "Shared project instructions"

mcp_config:
  remote: true   # streamable_http extension support
  config_path: "~/.config/goose/config.yaml"
  reader: "audiagentic.components.providers.adapters.goose.mcp_format:read_goose_yaml"
  writer: "audiagentic.components.providers.adapters.goose.mcp_format:write_goose_yaml"
  remover: "audiagentic.components.providers.adapters.goose.mcp_format:remove_goose_yaml"
  format: "goose-yaml"
  refresh_mode: "restart-required"

surfaces:
  renderer: none
  contribution-file: "AGENTS.md"

execution:
  mode: stub
  aliases: [goose]
  message: "Goose adapter is registered; execution bridge not wired yet."
