# Antigravity (Google) — provider descriptor
# curl-based install, MCP JSON config, AGENTS.md instruction file
# All claims verified via live CLI execution

provider_id: antigravity
display_name: "Antigravity"
description: "Google's Antigravity CLI and IDE. AI-first development platform with code execution and browser tools."
url: "https://antigravity.google"
prompt_aliases:
  - ag
  - agy

cli_probe:
  - agy
  - "--version"

cli_install:
  package_manager: script
  package_name: antigravity-cli
  executable: agy
  install:
    type: shell
    id: install
    command:
      - bash
      - "-lc"
      - "curl -fsSL https://antigravity.google/cli/install.sh | bash"
  uninstall:
    type: shell
    id: uninstall
    command:
      - bash
      - "-lc"
      - "rm -f $(which agy) 2>/dev/null; rm -rf ~/.gemini/antigravity 2>/dev/null; true"

capability_facts:
  - capability_id: cli-probe
    subject: cli_probe
    mechanism: "shell probe: agy --version"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/antigravity.yaml#cli_probe"
      review_state: verified
  - capability_id: cli-install
    subject: cli_install
    mechanism: "curl-based install script"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/antigravity.yaml#cli_install"
      review_state: verified
  - capability_id: mcp-config
    subject: mcp_config
    mechanism: "reader/writer/remover over ~/.gemini/antigravity/mcp_config.json"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/antigravity.yaml#mcp_config"
      review_state: verified
  - capability_id: surface-render
    subject: surfaces
    mechanism: "flat-skill renderer, AGENTS.md contribution"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/antigravity.yaml#surfaces"
      review_state: verified
  - capability_id: surface-skill
    subject: skill_surface_path
    mechanism: ".agents/skills/{tag}/SKILL.md path template"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/antigravity.yaml#skill_surface_path"
      review_state: verified
  - capability_id: surface-instruction
    subject: instruction_file
    mechanism: "AGENTS.md managed file in project root"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/antigravity.yaml#instruction_file"
      review_state: verified
  - capability_id: exec-adapter
    subject: execution
    mechanism: "mode: stub"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/antigravity.yaml#execution"
      review_state: verified
  - capability_id: perm-declaration
    subject: permissions
    mechanism: "ProviderPermissions boolean flags"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/antigravity.yaml#permissions"
      review_state: verified
  - capability_id: file-agent
    subject: agent_files
    mechanism: "tuple of AgentFile"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/antigravity.yaml#agent_files"
