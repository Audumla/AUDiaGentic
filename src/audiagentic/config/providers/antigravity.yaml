# Antigravity (Google) — provider descriptor
# curl-based install, MCP JSON config, AGENTS.md instruction file
# All claims verified via live CLI execution

provider_id: antigravity
execution_isolation_tier: no-isolation
display_name: "Antigravity"
description: "Google's Antigravity CLI and IDE. AI-first development platform with code execution and browser tools."
url: "https://antigravity.google"
prompt_aliases:
  - ag
  - agy

capabilities:
  cli-install:
    mechanism:
      package_manager: script
      package_name: antigravity-cli
      executable: agy
      probe: [agy, "--version"]
      install:
        type: shell
        id: install
        command:
          - bash
          - "-lc"
          - "curl -fsSL https://antigravity.google/cli/install.sh | bash"
      uninstall:
        type: shell
        id: uninstall
        command:
          - bash
          - "-lc"
          - "rm -f $(which agy) 2>/dev/null; rm -rf ~/.gemini/antigravity 2>/dev/null; true"

  mcp:
    mechanism:
      config_path: "~/.gemini/antigravity/mcp_config.json"
      reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
      writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
      remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
      format: "mcp-json"
      refresh_mode: "file-watch"

  surfaces:
    mechanism:
      renderer: flat-skill
      contribution-file: "AGENTS.md"

  surface-skill:
    mechanism: ".agents/skills/{tag}/SKILL.md"

  surface-instruction:
    mechanism: "AGENTS.md"

  permissions:
    mechanism:
      can_write_files: true
      can_execute_shell: true
      can_browse_web: true
      can_read_env: true
      notes: "Google's Antigravity development assistant."

  agent-files:
    mechanism:
      rel_path: "AGENTS.md"
      managed: false
      description: "Shared project instructions"

  launch:
    mechanism:
      recipes:
        execution:
          mode: stub
          aliases: [agy]
          message: "Antigravity adapter is registered; execution bridge not wired yet."

# CC53: AS27 harness-observability inventory (this provider's own facts —
# see harness_observability_inventory.py for the domain semantics).
harness_observability:
  - surface_id: antigravity-cli
    candidate_source: hooks/plugins/status — candidate route not source-pinned
    evidence:
      validated: false
      reference: primary-source probe required; prove non-vetoing machine event and config lifecycle; no Gemini inference
    recipe: B
    lifecycle_source: none
    probe_anchor: primary-source probe required; prove non-vetoing machine event and config lifecycle; no Gemini inference
