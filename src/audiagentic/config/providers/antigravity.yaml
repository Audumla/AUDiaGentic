permissions:
  can_write_files: true
  can_execute_shell: true
  can_browse_web: true
  can_read_env: true
  notes: "Google's Antigravity development assistant."

instruction_file: "AGENTS.md"
skill_surface_path: ".agents/skills/{tag}/SKILL.md"

agent_files:
  - rel_path: "AGENTS.md"
    managed: false
    description: "Shared project instructions"

mcp_config:
  config_path: "~/.gemini/antigravity/mcp_config.json"
  reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
  writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
  remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
  format: "mcp-json"
  refresh_mode: "file-watch"

surfaces:
  renderer: flat-skill
  contribution-file: "AGENTS.md"

execution:
  mode: stub
  aliases: [agy]
  message: "Antigravity adapter is registered; execution bridge not wired yet."
