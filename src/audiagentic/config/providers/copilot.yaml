# GitHub Copilot — provider descriptor
# Toolchain-based install (npm), custom probe, MCP JSON config, VS Code extensions

provider_id: copilot
execution_isolation_tier: no-isolation
display_name: "GitHub Copilot"
description: "GitHub's AI coding assistant. Inline completions, chat, and multi-file edits across VS Code and JetBrains."
url: "https://github.com/features/copilot"
prompt_aliases:
  - cp

capabilities:
  cli-install:
    mechanism:
      toolchain: npm
      package: "@github/copilot"
      executable: copilot
      probe: [copilot, "--version"]
      probe_fn: "audiagentic.components.providers.adapters.copilot.hooks:_copilot_probe"

  host-extensions:
    - mechanism:
        host: vscode
        capability_id: "GitHub.copilot"
        display_name: "GitHub Copilot"
    - mechanism:
        host: vscode
        capability_id: "GitHub.copilot-chat"
        display_name: "GitHub Copilot Chat"

  mcp:
    mechanism:
      config_path: ".vscode/mcp.json"
      reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
      writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
      remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
      transports: [stdio, http]  # json_format.py:84-87 emits {type, url, headers} when entry.is_remote
      format: "mcp-json"
      refresh_mode: "restart-required"

  surfaces:
    mechanism:
      renderer: flat-skill
      contribution-file: "COPILOT.md"

  surface-instruction:
    mechanism: "COPILOT.md"

  permissions:
    mechanism:
      can_write_files: false
      can_execute_shell: false
      can_browse_web: false
      can_read_env: false
      notes: "Completion and chat only; no autonomous tool use in standard mode"

  agent-files:
    - mechanism:
        rel_path: "COPILOT.md"
        managed: true
        description: "Copilot project instructions"
    - mechanism:
        rel_path: ".github/copilot-instructions.md"
        managed: false
        description: "GitHub Copilot repo instructions"

  launch:
    mechanism:
      # Launch capability (HA04): CLI-only, execute intent over native pipe.
      intents:
        execute:
          interaction: [native]
          observability: [pipe]
      recipes:
        execution:
          mode: cli
          executable: copilot
          aliases: [gh]
          prompt-title: Copilot
          error-code: EXT-COPIL-001
          extractor-name: copilot-plaintext
          args-template: ["copilot", "suggest", "-t", "shell", "{prompt}"]

# CC53: AS27 harness-observability inventory (this provider's own facts —
# see harness_observability_inventory.py for the domain semantics).
harness_observability:
  - surface_id: copilot-acp
    candidate_source: "official ACP server: copilot --acp --stdio or loopback TCP"
    evidence:
      validated: false
      reference: pin CLI/protocol and test stdio or loopback TCP; public-preview version/Docker probe required
    recipe: A
    lifecycle_source: none
    probe_anchor: pin CLI/protocol and test stdio or loopback TCP; public-preview version/Docker probe required
