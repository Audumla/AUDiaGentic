# Zed — provider descriptor
# CC53: minimal registered descriptor (no adapter code yet — candidate
# route only). Mirrors aider.yaml's stub launch pattern for "known but not
# wired" providers, so this file can own its own harness_observability
# entries per ARCHITECTURE_STANDARDS.md Section 2 instead of living in a
# central cross-provider Python list.

provider_id: zed
execution_isolation_tier: no-isolation
display_name: "Zed"
description: "Zed editor — delegates to external agents (ACP) or its own terminal; not yet installed/wired."

capabilities:
  launch:
    mechanism:
      recipes:
        execution:
          mode: stub
          aliases: [zed]
          message: "Zed adapter is registered; execution bridge not wired yet."

# CC53: AS27 harness-observability inventory (this provider's own facts —
# see harness_observability_inventory.py for the domain semantics).
harness_observability:
  - surface_id: zed-external-agent
    candidate_source: delegates to the selected external agent's ACP/native route
    evidence:
      validated: false
      reference: delegates to the selected external agent's ACP/native route (blocked)
    recipe: D
    lifecycle_source: none
  - surface_id: zed-terminal
    evidence:
      validated: false
      reference: unsupported
    recipe: D
    lifecycle_source: none
