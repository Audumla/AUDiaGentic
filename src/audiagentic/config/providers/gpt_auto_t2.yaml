# gpt-auto-t2: dedicated GP05 test-project alias of gpt-auto. It extends gpt_auto.yaml and
# overrides only what differs; the adapter, capabilities and session surfaces are the
# base's. The target ChatGPT project is set in this provider's own provider settings.
provider_id: gpt-auto-t2
extends: gpt-auto
display_name: "gpt-auto-t2 (GP05 test project)"
description: >-
  Browser-driven ChatGPT via CDP connect, dedicated to the gpt-t2 test project for GP05 concurrent/edge-case live testing. Same implementation as gpt-auto; only the target ChatGPT project differs.
prompt_aliases: []
capabilities:
  launch:
    mechanism:
      recipes:
        execution:
          message: >-
            gpt-auto-t2 runs only through the Gateway session transport and its shared browser runtime, not a disposable CLI recipe.
