# Aider — provider descriptor
# Toolchain-based install (uv), no MCP config

provider_id: aider
display_name: "Aider"
description: "AI pair programming in your terminal. Edit code directly in your git repo via chat."
url: "https://aider.chat"

cli_probe:
  - aider
  - "--version"

cli_install:
  toolchain: uv
  package: "aider-chat@latest"
  executable: aider
  extra:
    - "--force"
    - "--python"
    - "python3.12"
    - "--with"
    - "pip"
  uninstall_package: "aider-chat"

host_capabilities: []

capability_facts:
  - capability_id: cli-probe
    subject: cli_probe
    mechanism: "shell probe: aider --version"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/aider.yaml#cli_probe"
      review_state: verified
  - capability_id: cli-install
    subject: cli_install
    mechanism: "uv install: aider-chat@latest"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/aider.yaml#cli_install"
      review_state: verified
  - capability_id: exec-adapter
    subject: execution
    mechanism: "mode: stub"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/aider.yaml#execution"
      review_state: verified
  - capability_id: perm-declaration
    subject: permissions
    mechanism: "ProviderPermissions boolean flags"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/aider.yaml#permissions"
      review_state: verified
  - capability_id: file-agent
    subject: agent_files
    mechanism: "tuple of AgentFile"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/aider.yaml#agent_files"
      review_state: verified

permissions:
  can_write_files: true
  can_execute_shell: true
  can_browse_web: true
  can_read_env: true
  notes: "Terminal pair-programming agent; local model capable via OpenAI-compatible backends"

agent_files:
  - rel_path: "AGENTS.md"
    managed: false
    description: "Shared project instructions"
  - rel_path: ".aider.conf.yml"
    managed: false
    description: "Aider project configuration"

execution:
  mode: stub
  aliases: [aider]
  message: "Aider adapter is registered; execution bridge not wired yet."
