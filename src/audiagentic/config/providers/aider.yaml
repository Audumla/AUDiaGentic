# Aider — provider descriptor
# Toolchain-based install (uv), no MCP config

provider_id: aider
execution_isolation_tier: partial-isolation
display_name: "Aider"
description: "AI pair programming in your terminal. Edit code directly in your git repo via chat."
url: "https://aider.chat"

capabilities:
  cli-install:
    mechanism:
      toolchain: uv
      package: "aider-chat@latest"
      executable: aider
      probe: [aider, "--version"]
      extra:
        - "--force"
        - "--python"
        - "python3.12"
        - "--with"
        - "pip"
      uninstall_package: "aider-chat"

  permissions:
    mechanism:
      can_write_files: true
      can_execute_shell: true
      can_browse_web: true
      can_read_env: true
      notes: "Terminal pair-programming agent; local model capable via OpenAI-compatible backends"

  agent-files:
    - mechanism:
        rel_path: "AGENTS.md"
        managed: false
        description: "Shared project instructions"
    - mechanism:
        rel_path: ".aider.conf.yml"
        managed: false
        description: "Aider project configuration"

  launch:
    mechanism:
      recipes:
        execution:
          mode: stub
          aliases: [aider]
          message: "Aider adapter is registered; execution bridge not wired yet."

# CC53: AS27 harness-observability inventory (this provider's own facts —
# see harness_observability_inventory.py for the domain semantics).
harness_observability:
  - surface_id: aider-cli
    evidence:
      validated: false
      reference: unsupported
    recipe: D
    lifecycle_source: none
