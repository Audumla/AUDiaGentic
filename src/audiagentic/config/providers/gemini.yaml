  - capability_id: surface-render
    subject: surfaces
    mechanism: "flat-skill renderer, GEMINI.md contribution"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/gemini.yaml#surfaces"
      review_state: verified
  - capability_id: surface-skill
    subject: skill_surface_path
    mechanism: ".gemini/commands/{tag}.md path template"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/gemini.yaml#skill_surface_path"
      review_state: verified
  - capability_id: surface-instruction
    subject: instruction_file
    mechanism: "GEMINI.md managed file in project root"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/gemini.yaml#instruction_file"
      review_state: verified
  - capability_id: depr-status
    subject: deprecated
    mechanism: "boolean with annotations, replaced by antigravity"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/gemini.yaml#deprecated"
      review_state: verified
  - capability_id: perm-declaration
    subject: permissions
    mechanism: "ProviderPermissions boolean flags"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
