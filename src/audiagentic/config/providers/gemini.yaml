# Gemini (Google) — provider descriptor
# Toolchain-based install (npm), MCP JSON config, VS Code extension
# DEPRECATED — replaced by Antigravity (agy v2.2.1+)

provider_id: gemini
display_name: "Gemini (Google)"
description: "Google's Gemini CLI. Agentic coding assistant with large context window and Google tool integrations."
url: "https://github.com/google-gemini/gemini-cli"
deprecated: true
annotations:
  deprecated:
    since: "2026-07-13"
    replacement_provider: antigravity
    message: "Google Gemini CLI is deprecated; migrate to Antigravity (agy v2.2.1+)."
prompt_aliases:
  - gm

cli_probe:
  - gemini
  - "--version"

cli_install:
  toolchain: npm
  package: "@google/gemini-cli"
  executable: gemini

host_capabilities:
  - host: vscode
    capability_id: "google.gemini-cli-vscode-ide-companion"
    display_name: "Gemini CLI Companion"

capability_facts:
  - capability_id: cli-probe
    subject: cli_probe
    mechanism: "shell probe: gemini --version"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/gemini.yaml#cli_probe"
      review_state: verified
  - capability_id: cli-install
    subject: cli_install
    mechanism: "npm install: @google/gemini-cli"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/gemini.yaml#cli_install"
      review_state: verified
  - capability_id: ext-declaration
    subject: host_capabilities
    mechanism: "tuple of HostCapability"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/gemini.yaml#host_capabilities"
      review_state: verified
  - capability_id: mcp-config
    subject: mcp_config
    mechanism: "reader/writer/remover over .gemini/settings.json"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/gemini.yaml#mcp_config"
