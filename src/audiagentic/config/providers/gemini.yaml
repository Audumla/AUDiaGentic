  - capability_id: file-agent
    subject: agent_files
    mechanism: "tuple of AgentFile"
    constraints: []
    limitations: []
    support_assessment: verified
    action_needed: null
    evidence:
      evidence_tier: installed-artifact
      tool_version: repository
      fact_anchor: "config/providers/gemini.yaml#agent_files"
      review_state: verified

permissions:
  can_write_files: true
  can_execute_shell: true
  can_browse_web: true
  can_read_env: true
  notes: "CLI agent with tool use; Google account auth required"

instruction_file: "GEMINI.md"
skill_surface_path: ".gemini/commands/{tag}.md"

agent_files:
  - rel_path: "GEMINI.md"
    managed: false
    description: "Gemini project instructions"

mcp_config:
  config_path: ".gemini/settings.json"
  reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
  writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
  remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
  format: "mcp-json"
  refresh_mode: "restart-required"

surfaces:
  renderer: flat-skill
  contribution-file: "GEMINI.md"
