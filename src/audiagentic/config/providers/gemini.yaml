# Gemini (Google) — provider descriptor
# Toolchain-based install (npm), MCP JSON config, VS Code extension
# DEPRECATED — replaced by Antigravity (agy v2.2.1+)

provider_id: gemini
execution_isolation_tier: no-isolation
display_name: "Gemini (Google)"
description: "Google's Gemini CLI. Agentic coding assistant with large context window and Google tool integrations."
url: "https://github.com/google-gemini/gemini-cli"
deprecated: true
annotations:
  deprecated:
    since: "2026-07-13"
    replacement_provider: antigravity
    message: "Google Gemini CLI is deprecated; migrate to Antigravity (agy v2.2.1+)."
prompt_aliases:
  - gm

capabilities:
  cli-install:
    mechanism:
      toolchain: npm
      package: "@google/gemini-cli"
      executable: gemini
      probe: [gemini, "--version"]

  host-extensions:
    mechanism:
      host: vscode
      capability_id: "google.gemini-cli-vscode-ide-companion"
      display_name: "Gemini CLI Companion"

  mcp:
    mechanism:
      config_path: ".gemini/settings.json"
      reader: "audiagentic.foundation.mcp.json_format:read_mcp_json"
      writer: "audiagentic.foundation.mcp.json_format:write_mcp_json"
      remover: "audiagentic.foundation.mcp.json_format:remove_mcp_json"
      format: "mcp-json"
      refresh_mode: "restart-required"

  surfaces:
    mechanism:
      renderer: flat-skill
      contribution-file: "GEMINI.md"

  surface-skill:
    mechanism: ".gemini/commands/{tag}.md"

  surface-instruction:
    mechanism: "GEMINI.md"

  permissions:
    mechanism:
      can_write_files: true
      can_execute_shell: true
      can_browse_web: true
      can_read_env: true
      notes: "CLI agent with tool use; Google account auth required"

  agent-files:
    mechanism:
      rel_path: "GEMINI.md"
      managed: false
      description: "Gemini project instructions"

# CC53: AS27 harness-observability inventory (this provider's own facts —
# see harness_observability_inventory.py for the domain semantics).
harness_observability:
  - surface_id: gemini-acp
    candidate_source: npx @google/gemini-cli --acp
    evidence:
      validated: false
      reference: independent of CLI hooks — prove event fidelity
    recipe: A
    lifecycle_source: none
    probe_anchor: independent of CLI hooks — prove event fidelity
  - surface_id: gemini-cli
    candidate_source: BeforeAgent/BeforeModel/AfterModel/BeforeTool/AfterTool/AfterAgent/SessionEnd
    evidence:
      validated: false
      reference: probe project config and environment inheritance on Gemini 0.49.0
    recipe: B
    lifecycle_source: none
    probe_anchor: probe project config and environment inheritance on Gemini 0.49.0
