type: prompt-trigger-tag
contract-version: v1
tag-id: ag-plan
display-name: Plan
description: Shape work into a concrete, scoped execution plan before any implementation starts
aliases:
  - agp
  - p
  - plan
directives:
  - id
  - target
  - context
  - output
  - template
  - job
  - profile
  - model
  - model-alias
requires-body: true
is-generic-tag: false
is-review-tag: false
skill-content-file: skill.md

files:
  - path: .audiagentic/skills/ag-plan/skill.md
    lifecycle: required-managed
    description: ag-plan canonical skill source

surface-contributions:
  - id: ag-plan/doctrine
    kind: rule
    title: Plan action doctrine
    content:
      body: |
        When the plan action is triggered: map the requested change into a concrete
        execution plan with discrete steps. Identify dependencies, blockers, risks,
        and review checkpoints. Do not implement — plan only.

  - id: ag-plan/planning-item-policy
    kind: rule
    title: Planning item creation policy
    content:
      body: |
        Planning items (requests, specs, plans, tasks) can only be created with explicit user approval.

        - Do not autonomously create planning items during analysis, review, or exploration work.
        - If analysis suggests a new request or spec is needed, report findings and ask for approval.
        - Use the plan action to signal planning work that requires user direction.
        - Only create planning items in response to explicit user instruction or approved workflow prompts.

prompts:
  - name: default
    content-file: prompts/default.md
