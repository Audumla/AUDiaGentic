# AUDiaGentic Pi harness — Pi-specific package defaults.
#
# Loaded only by the Pi harness runner and installer. Generic harness settings
# live in ag.yaml and are loaded independently.
#
# Override hierarchy (deep-merge, lowest priority first):
#   1. This file     — package defaults
#   2. User-global   — $AUDIAGENTIC_HOME/config/harness/pi.yaml
#   3. Project-local — <project>/.audiagentic/config/harness/pi.yaml

# --- Agent package versions ---
#
# Pin to a specific npm version to prevent silent upgrades on reinstall.
# Use "latest" to always pull the current release.
# Overridden by env vars: AUDIAGENTIC_PI_AGENT_VERSION, AUDIAGENTIC_PI_MCP_ADAPTER_VERSION
agent:
  # The installer consumes this package recipe; keep package identities here
  # so clean installs do not depend on hand-run npm commands.
  packages:
    cli: "@earendil-works/pi-coding-agent"
    mcp_adapter: "pi-mcp-adapter"
    acp: "pi-acp"
  # Pi ACP is a separate community bridge, not a Pi native capability.
  acp_version: "0.0.31"
  runtime_extra: "acp"
  version: "0.77.0"
  mcp_adapter_version: "2.11.0"

# --- Built-in tool access control ---
#
# mode selects Pi's built-in tool exposure (a single choice, not overlapping
# flags):
#   none      Disable every tool (--no-tools).
#   mcp-only  Disable Pi built-ins; MCP + explicit tools remain (--no-builtin-tools).
#   full      Pi defaults (no flag).
tools:
  mode: mcp-only

# --- Lockdown ---
#
# Restricts the slash-command surface via Pi's own CLI flags. No source
# patching -- if Pi doesn't expose a flag for something, it isn't restricted.
#
# no_skills:           Disable skill-based /commands.
# no_prompt_templates: Disable prompt-template /commands.
# no_context_files:    Stop Pi auto-loading CLAUDE.md / AGENTS.md.
lockdown:
  no_skills: true
  no_prompt_templates: true
  no_context_files: true

# --- UI ---
#
# Written into Pi's stock settings.json on each install/refresh. AUDiaGentic
# injects no extensions; these are Pi's own settings only.
ui:
  theme: dark
  quiet_startup: true
  collapse_changelog: true
  thinking: off
  editor_padding_x: 0
  theme_colors: {}
