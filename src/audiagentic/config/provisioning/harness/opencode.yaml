# AUDiaGentic OpenCode harness — opencode-specific package defaults.
#
# Loaded only by the opencode harness runner and installer. Generic harness
# settings live in ag.yaml and are loaded independently.
#
# Override hierarchy (deep-merge, lowest priority first):
#   1. This file     — package defaults
#   2. User-global   — $AUDIAGENTIC_HOME/config/harness/opencode.yaml
#   3. Project-local — <project>/.audiagentic/config/harness/opencode.yaml

# --- UI customization ---
ui:
  show_startup_info: true
  startup_banner: null

# Extra opencode CLI flags appended verbatim to every non-smoke invocation.
extra_flags: []
