# AUDiaGentic harness — generic package defaults.
#
# These settings apply to any harness implementation. Harness-specific
# settings live in their own config file (e.g. pi.yaml for the Pi harness).
#
# Override hierarchy (deep-merge, lowest priority first):
#   1. This file     — package defaults
#   2. User-global   — $AUDIAGENTIC_HOME/config/harness/ag.yaml
#   3. Project-local — <project>/.audiagentic/config/harness/ag.yaml
#
# Set exclusive_local: true in the project-local file to skip the user-global tier.

# Harness selection.
# Each harness is an isolated adaptor under runtime/harness/<type>/.
# Supported: pi, opencode
#
# Launch-time selection uses an already-available harness from PATH; it never
# silently installs one as a side effect. Explicit installation is supported by
# the provider lifecycle. Available harnesses are tried in the order below and
# the FIRST one found is used. Reorder or extend the list to change preference;
# override per-user or per-project via the same key.
harness:
  order:
    - pi
    - opencode
  # Optional explicit pin. When set, forces this harness and skips order-based
  # resolution (used by tests and for forcing a specific harness).
  # type: pi

# Embedded rig settings.
rig:
  port: 42001
  # Which model to use. Resolved against rig.yaml profile list.
  model: audiagentic-rig
  # Provider id passed to the harness CLI (names the models.json backend block).
  provider: audiagentic

# Smoke test timeout in seconds.
smoke:
  timeout: 60.0

# MCP integration.
mcp:
  enabled: true
