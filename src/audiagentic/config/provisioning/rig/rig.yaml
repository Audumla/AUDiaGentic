# Rig server configuration — AUDiaGentic embedded llama-server.
#
# profile_settings: named reusable setting blocks.
# models.<profile-name>.extends: merge listed setting blocks in order, then apply model-local overrides.
#
# Groups:
# - server: llama-server runtime flags
# - agent: metadata exposed to Pi/OpenAI-compatible surfaces
# - prompt: prompt/chat-template behavior
# - proxy: auxiliary runtime shims

compat_qwen: &compat_qwen
  supportsDeveloperRole: false
  supportsReasoningEffort: false
  thinkingFormat: qwen-chat-template

compat_plain: &compat_plain
  supportsDeveloperRole: false
  supportsReasoningEffort: false
  thinkingFormat: none

profile_settings:
  mtp_base:
    server:
      spec_type: draft-mtp
      spec_draft_n_max: 2
      spec-draft-type-v: q8_0
      spec-draft-type-k: q8_0

  qwen_base:
    server:
      ubatch_size: 512
      batch_size: 2048
      gpu_layers: all
      fit: "on"
      fit-target: 1024
      no_mmap: true
      flash_attn: "on"
      reasoning: "off"
      temp: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      parallel: 1
      cache-type-k: q8_0
      cache-type-v: q8_0
    agent:
      reasoning: false
      compat: *compat_qwen
    prompt:
      chat_template:
        preserve_thinking: true


rig_model:
  profile: qwen3.5-2b
  model_id: audiagentic-rig

# --- Per-model overrides ---
# Keys here deep-merge over inherited profile_settings.

models:
  qwen3.5-0.8b:
    extends: [qwen_base]
    model_file: ../../models/Qwen3.5-0.8B.Q8_0.gguf

  qwen3.5-2b:
    extends: [qwen_base]
    model_file: ../../models/Qwen_Qwen3.5-2B-Q4_K_S.gguf

  qwen3.5-9b:
    extends: [qwen_base]
    model_file: ../../models/Qwen3.5-9B-IQ4_XS.gguf
    server:
      context_size: 1280000
 
