# Composition for the gateway-service process root (AS60 step 7 / RV888) --
# distinct from composition.yaml (the launcher/CLI root). Carries no domain
# data, no secrets, no Python paths; code contributes the factory, this file
# only selects between implementations by identifier.
#
# Override tiers (see foundation/config/layers.py):
#   package default   this file
#   user global       ~/.audiagentic/config/gateway-service-composition.yaml
#   project local     <project>/.audiagentic/config/gateway-service-composition.yaml
gateway-service-composition:
  roots:
    - agents.execution-profile-registry
    - agents.gateway-queue-manager
    - providers.gpt-auto-runtime-owner

  bindings:
    # Shared-gateway resolution is the only implementation this process
    # constructs -- project-local resolution is a stateless plain function
    # with nothing to compose (see AS60's Public boundary and composition).
    agents.execution-profile-registry: agents.shared-gateway-registry
    # The queue manager has one implementation too (AS63 step 9/10) -- it is
    # composed for its per-process lifetime, not for swappable implementations.
    agents.gateway-queue-manager: agents.gateway-queue-manager
    providers.gpt-auto-runtime-owner: providers.shared-gpt-auto-runtime
