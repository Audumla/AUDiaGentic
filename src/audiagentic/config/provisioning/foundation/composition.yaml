# Composition: which implementation backs each service, and which services the
# process constructs. This is a separate configuration concern — it carries no
# domain data, no secrets, and no Python paths. Code contributes the factories;
# this file only selects between them by identifier.
#
# Override tiers (see foundation/config/layers.py):
#   package default   this file
#   user global       ~/.audiagentic/config/composition.yaml
#   project local     <project>/.audiagentic/config/composition.yaml
composition:
  # Only what the process actually constructs. Adding a root here without a
  # binding below is a build failure, not a silent no-op.
  roots:
    - runtime.application-host

  bindings:
    runtime.application-host: runtime.default-host
    # The interaction surface is genuinely replaceable — InteractionBackend's
    # own contract names CLI input and MCP elicitation as alternatives.
    foundation.interaction-backend: foundation.cli-interaction
