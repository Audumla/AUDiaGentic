toolchains:
  npm:
    install: [npm, install, -g, "{package}"]
    uninstall: [npm, uninstall, -g, "{package}"]

  uv:
    install: [uv, tool, install, "{package}"]
    uninstall: [uv, tool, uninstall, "{package}"]

  brew:
    install: [brew, install, "{package}"]
    uninstall: [brew, uninstall, "{package}"]

  cargo:
    install: [cargo, install, "{package}"]
    uninstall: [cargo, uninstall, "{package}"]

  rustup:
    install: [rustup, component, add, "{package}"]
    remove: [rustup, component, remove, "{package}"]

  choco:
    install: [choco, install, -y, "{package}"]
    uninstall: [choco, uninstall, -y, "{package}"]

  scoop:
    install: [scoop, install, "{package}"]
    uninstall: [scoop, uninstall, "{package}"]

  winget:
    install: [winget, install, --id, "{package}", -e, --accept-source-agreements, --accept-package-agreements]
    uninstall: [winget, uninstall, --id, "{package}", -e]

  gh_extension:
    install: [gh, extension, install, "{package}"]
    remove: [gh, extension, remove, "{package}"]

  vscode:
    install: [code, --install-extension, "{package}", --force]
    uninstall: [code, --uninstall-extension, "{package}"]

  apt:
    privilege: true
    install_steps:
      - [apt-get, update, -q]
      - [apt-get, install, -y, "{package}"]
    remove: [apt-get, remove, -y, "{package}"]

  dnf:
    privilege: true
    install: [dnf, install, -y, "{package}"]
    remove: [dnf, remove, -y, "{package}"]

  pacman:
    privilege: true
    install: [pacman, -S, --noconfirm, "{package}"]
    remove: [pacman, -R, --noconfirm, "{package}"]
