# GP09/GP20: shared packaged defaults exclusively for the gpt-auto provider.
#
# Project config files under .audiagentic/config/providers/gpt-auto*.yaml
# become sparse overlays -- they may specify project-url when a provider
# profile is intentionally pinned to one ChatGPT project. When it is absent,
# the admitted project name is used for project discovery. Everything else is
# inherited from here.
#
# This file was extracted from the AUDiaGentic project's own gpt-auto.yaml,
# which had accumulated the fullest set of hard-won live-debugging comments;
# gpt-auto-t1.yaml/gpt-auto-t2.yaml were near-identical duplicates of the
# same content (confirmed via diff, 2026-08-17) modulo project-url and some
# comment-text drift -- exactly the duplication GP09 was raised about.
settings:
  contract-version: v3
  browser:
    executable: 'C:\Program Files\BraveSoftware\Brave-Browser\Application\brave.exe'
    remote-debugging-port: 9222
    existing-browser-policy: fail
    shutdown-timeout-seconds: 10
    force-kill: false
    dedicated-window: true
    close-tabs-on-session-close: false
    physical-tab-idle-timeout-seconds: 7200
    physical-tab-reaper-interval-seconds: 300
  cdp:
    # CDP target location. For a remote browser use e.g.
    # http://10.0.0.25:9222 and set up private transport (SSH/VPN).
    endpoint: http://127.0.0.1:9222
    connect-timeout-seconds: 15
    protocol-timeout-seconds: 30
    recovery-timeout-seconds: 30
    devtools-active-port-file: null
  chat:
    ready-timeout-seconds: 30
    navigation-timeout-seconds: 30
  turn:
    submission-timeout-seconds: 15
    # Response observation has no provider-side hard deadline. AS122 owns
    # bounded refresh recovery and terminal exhaustion.
    response-start-timeout-seconds: 0
    response-stall-timeout-seconds: 0
    response-timeout-seconds: 0
    response-no-activity-refresh-seconds: 240
    response-refresh-attempts: 15
    response-refresh-final-grace-seconds: 600
    # The interruption banner is not proof of failure. Emit a synthetic
    # request activity edge at this cadence so clients/gateway leases remain
    # alive while the provider may still complete the answer.
    response-interruption-activity-interval-seconds: 30
    poll-interval-seconds: 1
    response-stability-seconds: 6
    # A completion witness while ChatGPT still reports generation is active
    # is contradictory evidence. Require a longer stable window before
    # overriding that signal, while preserving the normal fast path when it
    # is inactive.
    response-generating-override-stability-seconds: 30
    submission-proof-progress-lease-seconds: 300
    submission-proof-absolute-ceiling-seconds: 900
    # Experimental blank/stale-page probe. Never refresh by default.
    initial-response-observation-grace-seconds: 15
    initial-response-refresh-enabled: false
    initial-response-refresh-attempts: 1
    initial-response-refresh-cooldown-seconds: 30
    # If a submitted turn stops producing observable progress, perform one
    # read-only focus/materialization probe.  This is not a submission retry.
    stale-progress-focus-enabled: true
    stale-progress-focus-after-seconds: 30
  workflow:
    recovery:
      # Recovery policy is workflow data; dispatch still enforces session and
      # request correlation before applying any of these actions.
      network-error-followup-enabled: true
      network-error-followup-max-attempts: 1
      network-error-followup-prompt-template: >-
        Complete the previous request. The previous response was interrupted by a
        network error. Continue from the work already done and provide the complete
        answer.

        Original request:
        {original_request}
      provider-error-followup-enabled: true
      provider-error-followup-max-attempts: 1
      provider-error-followup-prompt-template: >-
        Complete the previous request. ChatGPT reported a temporary request error.
        Continue from the work already done and provide the complete answer.

        Original request:
        {original_request}
      conversation-load-failure-recovery-enabled: true
      conversation-load-failure-max-attempts: 2
      action-pause-seconds: 0.15
    dom-signals:
      stop-control:
        scope: document
        selectors: ['[data-testid="stop-button"]', '[data-testid="stop-generating"]', 'button[aria-label*="stop" i]']
        visible: true
      streaming-indicator:
        scope: latest-assistant-turn
        # ChatGPT keeps `.streaming-animation` on completed assistant
        # messages, so it is not proof that generation is still active.
        # Restrict this signal to indicators that disappear at completion.
        selectors: ['.result-streaming', '.loading-dots']
        visible: true
      thinking-indicator:
        scope: latest-assistant-turn
        selectors: ['.result-thinking']
        visible: true
      busy-indicator:
        scope: latest-assistant-turn
        selectors: ['[aria-busy="true"]', '[data-busy="true"]']
        visible: true
      conversation-load-failed:
        scope: document
        selectors: ['body']
        visible: true
        # The current renderer omits the trailing period, while older
        # renderers included it. Match both exact provider-owned variants so
        # a persistent load-error page cannot fall through to heartbeat-only
        # response observation.
        text-contains-any:
          - 'Could not load this ChatGPT conversation'
          - 'Could not load this ChatGPT conversation.'
      network-error-alert:
        scope: document
        selectors: ['body']
        visible: true
        text-contains-any: ['A network error occurred. Please check your connection and try again.']
      completion-control:
        # GP41 (2026-08-17): [data-testid="copy-turn-action-button"] is NOT
        # unique to assistant turns -- confirmed live it is the SAME
        # testid ChatGPT uses on the user's own prompt-message action bar
        # (copy/edit/share what was typed). Scoping to latest-assistant-turn
        # is what prevents matching the wrong one, but that scoping walk
        # was independently found to be fragile for at least one real DOM
        # shape tonight (a false alarm in that specific investigation, but
        # a real fragility in the underlying approach). The assistant's
        # own copy button separately carries aria-label="Copy response"
        # (confirmed live: <button ... aria-label="Copy response"
        # data-testid="copy-turn-action-button">), which IS role-specific.
        #
        # Code review (2026-08-17) caught that a naive second, OR'd
        # selector does not actually help: selectors within one signal are
        # OR'd, so the known-ambiguous bare testid still matches (and wins)
        # first if scoping ever picks the wrong container. A single
        # selector requiring BOTH attributes on the same element is used
        # instead -- role-specific by itself, testid kept only as an extra
        # qualifier, not an independently-sufficient alternative.
        scope: latest-assistant-turn
        selectors:
          - 'button[data-testid="copy-turn-action-button"][aria-label="Copy response"]'
          # Current ChatGPT project conversations use the same assistant-scoped
          # control with the generic labels "Copy" or "Copy message".
          - 'button[aria-label="Copy"]'
          - 'button[aria-label="Copy message"]'
          # The current action bar also exposes this stable terminal control
          # after a completed response, even when the copy control is
          # virtualized or temporarily absent.
          - 'button[aria-label="Regenerate response"]'
        visible: false
      error-page:
        scope: document
        selectors: ['.error-page', '[data-testid*="error"]']
        visible: true
      error-alert:
        scope: document
        selectors: ['[role="alert"]']
        visible: true
        text-contains-any: ['error', 'failed', 'went wrong', 'try again', 'retry', 'rate limit', 'too many requests']
      provider-interruption:
        # Provider interruption is a recovery trigger, not a generic
        # terminal error. Match the exact user-visible interruption text.
        scope: document
        selectors: ['[role="alert"]']
        visible: true
        text-equals-any: ['Connection interrupted. Waiting for the complete answer']
      delivery-timeout-retry:
        # Conversation-scoped delivery timeout; never a generic error click.
        scope: document
        selectors:
          - 'button[data-testid="regenerate-thread-error-button"]'
          - 'button[aria-label="Retry"]'
          - 'button[data-testid*="regenerate"][data-testid*="error"]'
        visible: true
        text-contains-any: ['retry']
      delivery-timeout-alert:
        # The current renderer's plain-text Retry control (live-captured
        # 2026-09-27) has neither aria-label nor data-testid, so it cannot
        # be identified by button attributes the way delivery-timeout-retry
        # above does. A prior attempt widened delivery-timeout-retry's own
        # selectors to `[role="alert"] button`, but that signal's
        # text-contains-any (["retry"]) is a substring match, so it would
        # also fire on any unrelated role="alert" containing a
        # differently-labelled Retry-ish button (e.g. "Retry upload") --
        # and turn.py marks the one-shot retry attempted before the click
        # runs, so that false-positive would permanently consume the
        # attempt and starve a later, genuine timeout retry. Detect this
        # specific alert by its own message text instead, which is exact
        # and does not depend on the button's accessible name at all; the
        # click side (gpt_auto_cdp.py's _RETRY_DELIVERY_TIMEOUT_FN) locates
        # the exact-text "retry" button scoped to this same alert.
        scope: document
        selectors: ['[role="alert"]']
        visible: true
        text-contains-any: ['stream recovery polling timed out']
      auth-required:
        scope: document
        selectors: ['[data-testid="login-button"]', '[data-testid="signup-button"]', 'input[type="email"]']
        visible: true
      rate-limit-dialog:
        # ChatGPT's hard rate-limit block renders as a Radix role="dialog"
        # popover ("Too many requests"), not role="alert" -- error-alert's
        # selector does not match it. Advisory only: proven live 2026-08-16
        # both that this fires on the real DOM AND that the panel can be
        # visible while the underlying generation is still executing (and
        # can still complete correctly) behind it, exactly like the
        # earlier stop-control finding. Never wired as a response-failed
        # trigger or a response-complete veto; kept for diagnostics only.
        scope: document
        selectors: ['[role="dialog"]']
        visible: true
        text-contains-any: ['too many requests', 'making requests too quickly', 'temporarily limited']
      more-actions-menu:
        # The end-of-turn action bar's "More actions" overflow button,
        # confirmed present live 2026-08-17 alongside completion-control on
        # a genuinely complete turn, using the SAME production scoping
        # logic (assistantTurn = closest("article") ||
        # parentElement.parentElement) as the real snapshot code -- not an
        # ad-hoc check.
        scope: latest-assistant-turn
        selectors: ['button[aria-label="More actions"]']
        visible: true
      canvas-edit-control:
        # ChatGPT's canvas/writing-block response type (a distinct rendering
        # mode from the standard chat-turn bubble, seen live 2026-08-17)
        # shows a completely different end-of-turn action bar -- Edit/Copy/
        # Open editor -- instead of the standard copy-turn-action-button +
        # More actions pair. completion-control/more-actions-menu were
        # confirmed document-scoped-absent for a genuinely complete canvas
        # turn (GP33 follow-up), which would make response-complete
        # permanently unsatisfiable for this whole response type -- the
        # exact GP32 failure mode again, for a different rendering mode
        # this time. ChatGPT is known to have MORE than these two response
        # variants; this is only the second one confirmed live so far.
        #
        # KNOWN WEAKNESS (GP34/code review, 2026-08-17): live monitoring
        # confirmed this signal (and canvas-open-editor-control) both
        # appear within ~150 characters of a response that ultimately
        # reached ~1900 characters -- i.e. essentially at canvas-panel
        # creation, not at genuine completion. Both members of this pair
        # fire together at the same moment, so pairing them provides NO
        # real independent corroboration the way completion-control/
        # more-actions-menu are intended to (code review, 2026-08-17: "two
        # structural witnesses for essentially the same event... pairing
        # them doesn't convert that into 'generation has finished'").
        # streaming-indicator/thinking-indicator (response-complete's
        # none-of veto) are chat-bubble-specific CSS classes that do not
        # fire for canvas content, so none-of provides no protection
        # either. Mitigated (not fully closed) by requiring not-generating
        # as a THIRD group member below -- current.generating (the raw
        # stop/streaming/thinking/aria-busy check) was observed live to
        # correctly track this specific canvas turn's busy/done state
        # (stop button present throughout growth, false only once text
        # stabilized), but this is one data point, not a proven guarantee
        # the same way completion-control/more-actions-menu's stability
        # requirement is. Do not treat this group as equally trustworthy
        # until a canvas turn has been watched live through an actual
        # multi-second generation pause to rule out a false-positive
        # during a real mid-generation stall.
        scope: latest-assistant-turn
        selectors: ['[data-testid="writing-block-header-magic-edit-button"]']
        visible: true
      canvas-open-editor-control:
        # Paired corroborating signal for canvas-edit-control -- confirmed
        # live 2026-08-17 co-occurring with it on a genuinely complete
        # canvas turn, same discipline as completion-control/
        # more-actions-menu (never trust one witness alone, GP17). Carries
        # the SAME known weakness noted on canvas-edit-control above --
        # see GP34.
        scope: latest-assistant-turn
        selectors: ['button[aria-label="Open editor"]']
        visible: true
    evidence-policies:
      response-started:
        any-of: [assistant-fresh, stop-control, streaming-indicator, thinking-indicator]
      response-active:
        any-of: [text-changed, stop-control, streaming-indicator, thinking-indicator]
      response-complete:
        # stop-control is deliberately NOT in none-of: proven live
        # (2026-08-15/16) to stick indefinitely after real completion, so
        # it is advisory-only now (logged on disagreement, never a veto).
        # completion-control alone is unreliable (proven live to fire on a
        # genuinely-incomplete turn mid-stream, GP17 2026-08-16) and can
        # stay persistently true (not flap) through the whole
        # response_stability_seconds window, so a second independent
        # corroborating fact is required. any-of-groups (not a single
        # flat all-of) so a future DOM change breaking one corroborating
        # signal degrades to the other surviving groups instead of making
        # response-complete permanently unsatisfiable -- exactly what
        # happened on 2026-08-17 when one DOM marker was absent from the
        # long technical response GP32 was diagnosed against, which caused
        # a 600s hang despite ChatGPT having finished. DOM renderer-position
        # markers such as data-is-last-node/data-is-only-node are deliberately
        # diagnostics only: they can identify the last node rendered so far
        # while generation is still continuing, so they are not terminal
        # authority. A second variant of the same failure mode was
        # live-reproduced:
        # ChatGPT's canvas/writing-block response type renders a
        # different action bar entirely, so the standard pair was
        # document-scoped-absent for a genuinely complete canvas turn
        # (GP33 follow-up) -- covered by a second any-of-groups entry
        # rather than trying to find one selector that covers every
        # response variant. ChatGPT has more response variants than
        # these two; add further groups only after their own live
        # validation, never speculatively.
        #
        # The current standard renderer can omit the historical
        # more-actions-menu while retaining Copy message after generation
        # has ended.  completion-control + not-generating is therefore a
        # validated alternate group: it still rejects a mid-generation
        # completion-control-only snapshot, while allowing the current DOM
        # variant to terminalize once the assistant text is stable and
        # request-correlated.
        #
        # GP34/code review 2026-08-17: unlike the standard pair, the
        # canvas pair's own two members were proven to co-fire at
        # canvas-panel-creation time (not completion) -- see
        # canvas-edit-control's comment. not-generating is included as a
        # THIRD required fact in the canvas group specifically (never
        # added to the standard group -- that would reintroduce the
        # stop-control-stickiness false-negative GP17 fixed) so a genuine
        # mid-generation pause, where ChatGPT's own busy indicator is
        # still active, cannot satisfy this group.
        #
        # Renderer-position markers are intentionally not an alternate
        # completion path: "last node" and "only node" describe the current
        # render tree, not the end of the provider turn, and have been
        # observed before substantial additional output arrives.
        all-of: [assistant-fresh, text-present]
        any-of-groups:
          - [completion-control, more-actions-menu]
          - [completion-control, not-generating]
          - [canvas-edit-control, canvas-open-editor-control, not-generating]
        # A stale delivery-error panel can remain visible after ChatGPT has
        # produced the replacement answer.  Fresh assistant correlation plus
        # the structural completion witnesses must outrank that advisory
        # error marker; auth-required remains a hard veto.
        none-of: [streaming-indicator, thinking-indicator, auth-required]
      response-failed:
        any-of: [error-page, request-error-alert, network-error-alert, conversation-load-failed, auth-required]
