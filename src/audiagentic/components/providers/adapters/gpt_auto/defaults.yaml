# GP09/GP20: packaged defaults for the gpt-auto provider's settings.
#
# Project config files under .audiagentic/config/providers/gpt-auto*.yaml
# become sparse overlays -- they only need to specify project-url (always
# required, since it identifies which ChatGPT project this project talks
# to) plus any genuine overrides. Everything else is inherited from here.
#
# This file was extracted from the AUDiaGentic project's own gpt-auto.yaml,
# which had accumulated the fullest set of hard-won live-debugging comments;
# gpt-auto-t1.yaml/gpt-auto-t2.yaml were near-identical duplicates of the
# same content (confirmed via diff, 2026-08-17) modulo project-url and some
# comment-text drift -- exactly the duplication GP09 was raised about.
settings:
  contract-version: v1
  browser:
    executable: 'C:\Program Files\BraveSoftware\Brave-Browser\Application\brave.exe'
    remote-debugging-port: 9222
    existing-browser-policy: fail
    shutdown-timeout-seconds: 10
    force-kill: false
    dedicated-window: true
    close-tabs-on-session-close: false
  cdp:
    connect-timeout-seconds: 15
    protocol-timeout-seconds: 30
    recovery-timeout-seconds: 30
    devtools-active-port-file: null
  chat:
    ready-timeout-seconds: 30
    navigation-timeout-seconds: 30
  turn:
    submission-timeout-seconds: 15
    response-start-timeout-seconds: 120
    response-stall-timeout-seconds: 0
    response-timeout-seconds: 3600
    poll-interval-seconds: 1
    response-stability-seconds: 6
    submission-proof-progress-lease-seconds: 300
    submission-proof-absolute-ceiling-seconds: 900
  workflow:
    dom-signals:
      stop-control:
        scope: document
        selectors: ['[data-testid="stop-button"]', '[data-testid="stop-generating"]', 'button[aria-label*="stop" i]']
        visible: true
      streaming-indicator:
        scope: latest-assistant-turn
        # ChatGPT keeps `.streaming-animation` on completed assistant
        # messages, so it is not proof that generation is still active.
        # Restrict this signal to indicators that disappear at completion.
        selectors: ['.result-streaming', '.loading-dots']
        visible: true
      thinking-indicator:
        scope: latest-assistant-turn
        selectors: ['.result-thinking']
        visible: true
      busy-indicator:
        scope: latest-assistant-turn
        selectors: ['[aria-busy="true"]', '[data-busy="true"]']
        visible: true
      completion-control:
        scope: latest-assistant-turn
        selectors: ['[data-testid="copy-turn-action-button"]']
        visible: false
      message-finalized:
        # ChatGPT's markdown renderer's own "this is the final paragraph"
        # marker. Corroborating evidence only (any-of, alongside
        # completion-control) -- its exact lifecycle (transient vs
        # persistent, per turn type) is not yet fully characterized, so it
        # must never be relied on alone.
        scope: latest-assistant-turn
        selectors: ['[data-is-last-node]']
        visible: false
      error-page:
        scope: document
        selectors: ['.error-page', '[data-testid*="error"]']
        visible: true
      error-alert:
        scope: document
        selectors: ['[role="alert"]']
        visible: true
        text-contains-any: ['error', 'failed', 'went wrong', 'try again', 'retry', 'rate limit', 'too many requests']
      auth-required:
        scope: document
        selectors: ['[data-testid="login-button"]', '[data-testid="signup-button"]', 'input[type="email"]']
        visible: true
      rate-limit-dialog:
        # ChatGPT's hard rate-limit block renders as a Radix role="dialog"
        # popover ("Too many requests"), not role="alert" -- error-alert's
        # selector does not match it. Advisory only: proven live 2026-08-16
        # both that this fires on the real DOM AND that the panel can be
        # visible while the underlying generation is still executing (and
        # can still complete correctly) behind it, exactly like the
        # earlier stop-control finding. Never wired as a response-failed
        # trigger or a response-complete veto; kept for diagnostics only.
        scope: document
        selectors: ['[role="dialog"]']
        visible: true
        text-contains-any: ['too many requests', 'making requests too quickly', 'temporarily limited']
      more-actions-menu:
        # The end-of-turn action bar's "More actions" overflow button,
        # confirmed present live 2026-08-17 alongside completion-control on
        # a genuinely complete turn. A real, distinct end-of-turn signal,
        # but its lifecycle relative to completion-control/message-finalized
        # (does it ever lag, does it persist identically across turn types)
        # is not yet characterized the way those two were before landing in
        # response-complete's all-of set (GP17). Advisory/diagnostic only
        # for now -- never wired into a completion or failure policy without
        # its own live validation across multiple real completions first.
        scope: latest-assistant-turn
        selectors: ['button[aria-label="More actions"]']
        visible: true
    evidence-policies:
      response-started:
        any-of: [assistant-fresh, stop-control, streaming-indicator, thinking-indicator]
      response-active:
        any-of: [text-changed, stop-control, streaming-indicator, thinking-indicator]
      response-complete:
        # stop-control is deliberately NOT in none-of: proven live
        # (2026-08-15/16) to stick indefinitely after real completion, so
        # it is advisory-only now (logged on disagreement, never a veto).
        # completion-control and message-finalized are BOTH individually
        # unreliable (each independently proven live to fire on a
        # genuinely-incomplete turn -- completion-control mid-stream,
        # message-finalized on a 7-35 char response, GP17 2026-08-16) and
        # each can stay persistently true (not flap) through the whole
        # response_stability_seconds window, so the stability check alone
        # does not catch a shared false-positive. Require BOTH together
        # (all-of, not any-of) as the corroborating pair -- this was the
        # root cause of real live truncated/wrong "completed" results
        # (GP17), not text stability being insufficient on its own.
        all-of: [assistant-fresh, text-present, completion-control, message-finalized]
        none-of: [streaming-indicator, thinking-indicator, error-page, error-alert, auth-required]
      response-failed:
        any-of: [error-page, error-alert, auth-required]
