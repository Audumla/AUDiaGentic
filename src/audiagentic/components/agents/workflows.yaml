# Agent LLM Gateway request state workflow. Loaded by agents_gateway_store.py
# via the shared foundation.workflow.transitions primitives — mirrors the
# pattern agent_jobs/workflows.yaml uses for job records, applied to the
# gateway's own (unrelated) request/result data shape.
kinds:
  gateway-request:
    default-workflow: standard
    workflows:
      standard:
        initial: queued
        values: [queued, running, completed, failed, cancelled, rejected]
        transitions:
          queued: [running, cancelled, rejected]
          running: [completed, failed, cancelled]
          completed: []
          failed: []
          cancelled: []
          rejected: []
        state-sets:
          terminal: [completed, failed, cancelled, rejected]
