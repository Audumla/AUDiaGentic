# Agent Execution Gateway request state workflow.
# Loaded by agents_gateway_store.py through the shared foundation.workflow
# transitions primitives — mirrors the pattern agent_jobs/workflows.yaml uses
# gateway's own (unrelated) request/result data shape.
kinds:
  gateway-request:
    default-workflow: standard
    workflows:
      standard:
        initial: queued
        values: [queued, running, completed, failed, cancelled, rejected, interrupted]
        transitions:
          queued: [running, cancelled, rejected, interrupted]
          running: [completed, failed, cancelled, interrupted]
          completed: []
          failed: []
          cancelled: []
          rejected: []
          interrupted: []
        state-sets:
          terminal: [completed, failed, cancelled, rejected, interrupted]
  # Live agent session lifecycle (plan agent-sessions AS03). Live handles are
  # in-memory (SessionRuntime); these records are the durable audit/resume
  # anchor. 'expired' = closed by the idle/max-lifetime reaper.
  gateway-session:
    default-workflow: standard
    workflows:
      standard:
        initial: active
        values: [active, closing, closed, expired, failed]
        transitions:
          active: [closing, closed, expired, failed]
          closing: [closed, failed]
          closed: []
          expired: []
          failed: []
        state-sets:
          terminal: [closed, expired, failed]
