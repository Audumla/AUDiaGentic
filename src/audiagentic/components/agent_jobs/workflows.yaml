# Agent-jobs state workflow. Loaded by state_machine.py via the shared
# foundation.workflow.transitions primitives. The job lifecycle and its legal
# transitions are defined here — not hardcoded in Python.
kinds:
  job:
    default-workflow: standard
    workflows:
      standard:
        initial: created
        values: [created, ready, running, awaiting-approval, completed, failed, cancelled]
        transitions:
          # created/ready -> failed exists solely for the observer's
          # dispatch-failure path (EDJ23); gateway outcome propagation
          # explicitly refuses pre-dispatch transitions in event_observer.py.
          created: [ready, failed]
          ready: [running, cancelled, failed]
          running: [awaiting-approval, completed, failed, cancelled]
          awaiting-approval: [running, cancelled]
          completed: []
          failed: []
          cancelled: []
        state-sets:
          terminal: [completed, failed, cancelled]
