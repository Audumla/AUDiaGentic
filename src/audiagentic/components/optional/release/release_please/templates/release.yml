name: Release

on:
  push:
    branches:
      - __BRANCH__
      - proof-release-*

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  finalize-ledger:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "__PYTHON_VERSION__"

      - name: Finalize ledger
        run: |
          python - <<'PY'
          from pathlib import Path
          from audiagentic.components.optional.release import api

          result = api.finalize(
              project_root=Path(".").resolve(),
              release_id="${{ needs.release-please.outputs.tag_name }}",
          )
          print(result)
          PY

      - name: Commit release artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/releases/LEDGER.ndjson \
                  docs/releases/CURRENT_RELEASE_LEDGER.ndjson \
                  docs/releases/CHANGELOG.md \
                  docs/releases/RELEASE_NOTES.md \
                  docs/releases/VERSION_HISTORY.md \
                  docs/releases/CURRENT_RELEASE.md
          git diff --cached --quiet || git commit -m "chore(release): finalize ledger for ${{ needs.release-please.outputs.tag_name }} [skip ci]"
          git push

  build-and-publish:
    needs: [release-please, finalize-ledger]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "__PYTHON_VERSION__"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*

      - name: Publish to PyPI
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
