name: Release

on:
  push:
    branches:
      - __BRANCH__
      - proof-release-*
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing release tag to publish (for example v0.2.0); leave blank for normal release-please runs
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_id != '') }}
      tag_name: ${{ steps.rp.outputs.tag_name || inputs.release_id }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  finalize-ledger:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    outputs:
      finalized_sha: ${{ steps.finalized-sha.outputs.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "__PYTHON_VERSION__"

      - name: Install AUDiaGentic release tooling
        run: python -m pip install audiagentic

      - name: Finalize ledger
        run: |
          python - <<'PY'
          from pathlib import Path
          from audiagentic.components.release import release_api

          result = release_api.finalize(
              project_root=Path(".").resolve(),
              release_id="${{ needs.release-please.outputs.tag_name }}",
          )
          print(result)
          PY

      - name: Commit release artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/releases/LEDGER.ndjson \
                  docs/releases/CURRENT_RELEASE_LEDGER.ndjson \
                  docs/releases/RELEASE_NOTES.md \
                  docs/releases/VERSION_HISTORY.md \
                  docs/releases/CURRENT_RELEASE.md
          git diff --cached --quiet || git commit -m "chore(release): finalize ledger for ${{ needs.release-please.outputs.tag_name }} [skip ci]"
          git push

      - name: Record finalized commit
        id: finalized-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  update-release-notes:
    needs: [release-please, finalize-ledger]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.finalize-ledger.outputs.finalized_sha }}

      - name: Update GitHub release notes from ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --notes-file docs/releases/RELEASE_NOTES.md
