# Planning state workflows. Loaded by planning_api.py via the shared
# foundation.workflow.transitions primitives. Item and review state sets and
# their legal transitions are defined here, not hardcoded in Python. The
# workflow's placement map is canonical for active/ vs completed/ storage.
kinds:
  item:
    default-workflow: standard
    workflows:
      standard:
        initial: pending
        values: [pending, in_progress, completed, superseded, deprecated]
        transitions:
          pending: [in_progress, completed, superseded, deprecated]
          in_progress: [pending, completed, superseded, deprecated]
          completed: [pending, in_progress, superseded, deprecated]
          superseded: [pending, in_progress]
          deprecated: [pending, in_progress]
        state-sets:
          terminal: [completed, superseded, deprecated]
          active: [pending, in_progress]
        placement:
          pending: active
          in_progress: active
          completed: completed
          superseded: completed
          deprecated: completed
  review:
    default-workflow: standard
    workflows:
      standard:
        initial: created
        values: [created, considered, closed]
        transitions:
          created: [considered, closed]
          considered: [created, closed]
          closed: [created, considered]
        state-sets:
          terminal: [closed]
          active: [created, considered]
        placement:
          created: active
          considered: active
          closed: completed
