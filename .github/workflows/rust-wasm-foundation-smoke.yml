name: Rust Wasm Foundation Smoke

on:
  push:
    branches: ["spike/rust-wasm-foundation"]
    paths:
      - "experiments/rust-wasm-foundation/**"
      - ".github/workflows/rust-wasm-foundation-smoke.yml"
  pull_request:
    branches: ["ASA-ACP-DI-refactor"]
    paths:
      - "experiments/rust-wasm-foundation/**"
      - ".github/workflows/rust-wasm-foundation-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.94 + WASIp2 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: wasm32-wasip2
          components: clippy,rustfmt

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            experiments/rust-wasm-foundation/host
            experiments/rust-wasm-foundation/components/workflow-default
            experiments/rust-wasm-foundation/components/workflow-alt
            experiments/rust-wasm-foundation/components/process

      - name: Rust formatting
        working-directory: experiments/rust-wasm-foundation
        run: |
          cargo fmt --manifest-path host/Cargo.toml -- --check
          cargo fmt --manifest-path components/workflow-default/Cargo.toml -- --check
          cargo fmt --manifest-path components/workflow-alt/Cargo.toml -- --check
          cargo fmt --manifest-path components/process/Cargo.toml -- --check

      - name: Build and execute real smoke
        working-directory: experiments/rust-wasm-foundation
        env:
          RUST_LOG: info
        run: ./scripts/smoke.sh
