name: ci-tests

on:
  push:
  pull_request:

jobs:
  # ── Fast host suite ──────────────────────────────────────────────────────────
  # Whole non-Docker suite in one parallel command. `--dist loadfile` keeps each
  # test module on a single worker — `loadgroup` was splitting individual tests
  # across workers and breaking module-level setup (measured: 10 failures vs 1
  # on the same run). The conftest no_parallel hook additionally deselects
  # genuinely process-global tests from this run entirely; those run in the
  # serial phase below. mutates_host tests auto-skip here.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run host suite (parallel)
        run: python -m pytest tests/unit tests/integration tests/e2e -n auto --dist loadfile -m "not docker and not requires_container and not mutates_host"
      - name: Run held-back serial tests (no_parallel)
        run: AUDIAGENTIC_SERIAL_PHASE=1 python -m pytest tests/unit tests/integration tests/e2e -m "no_parallel and not requires_container and not mutates_host"

  # ── Docker suites (parallel matrix) ──────────────────────────────────────────
  # Each scenario builds in its own job so they run concurrently instead of the
  # old sequential 11-step block. The shared toolchain base is cached via the GHA
  # build cache, so only the first job pays its full build cost.
  #
  # The mutating recipe images are kept SEPARATE on purpose: each exercises a real
  # MCP install recipe and asserts install/uninstall from a clean toolchain, so
  # their environments must not share state. See tests/TESTING.md.
  docker-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: suite            # clean, non-mutating whole suite
            dockerfile: Dockerfile.test
            tag: audiagentic-test
            base: true
          - name: packaging        # clean-room wheel/install/server checks
            dockerfile: Dockerfile.packaging
            tag: audia-packaging
            base: false
          - name: provider-cli
            dockerfile: Dockerfile.provider-cli-test
            tag: audia-provider-cli-test
            base: true
          - name: provider-cli-comprehensive
            dockerfile: Dockerfile.provider-cli-comprehensive
            tag: audia-provider-cli-comprehensive
            base: true
          - name: provider-lifecycle
            dockerfile: Dockerfile.provider-lifecycle-e2e
            tag: audiagentic-provider-lifecycle-e2e
            base: true
          - name: provider-lsp
            dockerfile: Dockerfile.provider-lsp-e2e
            tag: audia-provider-lsp-e2e
            base: true
          - name: mcp-tools
            dockerfile: Dockerfile.mcp-tools-e2e
            tag: audia-mcp-tools-e2e
            base: true
          - name: lsp-install      # slow clean-toolchain recipe (rust compile)
            dockerfile: Dockerfile.lsp-install-test
            tag: audiagentic-lsp-install-test
            base: true
          - name: gateway-crash-matrix   # SH07 real-subprocess crash/recovery
            dockerfile: Dockerfile.gateway-crash-matrix
            tag: audiagentic-gateway-crash-matrix
            base: true
          - name: gateway-opencode       # real npm-CLI-provider dispatch (dynamic discovery)
            dockerfile: Dockerfile.gateway-opencode
            tag: audiagentic-gateway-opencode
            base: true
          - name: gateway-concurrency    # real concurrent load + negative paths
            dockerfile: Dockerfile.gateway-concurrency
            tag: audiagentic-gateway-concurrency
            base: true
          - name: gateway-pi-smoke       # SH16 real Pi CLI + embedded rig gateway dispatch
            dockerfile: Dockerfile.gateway-pi-smoke
            tag: audiagentic-gateway-pi-smoke
            base: true
          - name: pi-rpc-tap-e2e         # AS40 real pi-acp RPC tee shim, tapped conversational turn
            dockerfile: Dockerfile.pi-rpc-tap-e2e
            tag: audiagentic-pi-rpc-tap-e2e
            base: true
          - name: pi-acp-resume-e2e      # AS49 real pi-acp session/load resume after process death
            dockerfile: Dockerfile.pi-acp-resume-e2e
            tag: audiagentic-pi-acp-resume-e2e
            base: true
          - name: acp-e2e                # MA18 step 6 clean-room [acp] extra install + protocol fixture
            dockerfile: Dockerfile.acp-e2e
            tag: audia-acp-e2e
            base: false
          - name: consumer-pipeline      # AS19/AS30/AS31 observer/session-binding/output-relay pipeline
            dockerfile: Dockerfile.consumer-pipeline
            tag: audiagentic-consumer-pipeline
            base: true
          - name: harness-user-path      # credential-free harness materialization gate
            dockerfile: Dockerfile.harness-user-path
            tag: audiagentic-harness-user-path
            base: false
          - name: provider-config-matrix-e2e   # real provider CLI managed-config capability matrix
            dockerfile: Dockerfile.provider-config-matrix-e2e
            tag: audiagentic-provider-config-matrix-e2e
            base: true
          - name: opencode-recipe-live   # opencode upgrade recipe against a real toolchain
            dockerfile: Dockerfile.opencode-recipe-live
            tag: audiagentic-opencode-recipe-live
            base: true
          - name: rig-recipe-live        # llama.cpp rig recipe against a real toolchain
            dockerfile: Dockerfile.rig-recipe-live
            tag: audiagentic-rig-recipe-live
            base: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build the shared toolchain base with GHA layer cache (only images that
      # FROM it need this). Packaging uses a slim base and skips this.
      - name: Build base image
        if: ${{ matrix.base }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/docker/Dockerfile.test-base
          tags: audia-test-base:latest
          load: true
          cache-from: type=gha,scope=test-base
          cache-to: type=gha,scope=test-base,mode=max

      - name: Build ${{ matrix.name }} image
        run: docker build -f tests/docker/${{ matrix.dockerfile }} -t ${{ matrix.tag }} .

      - name: Run ${{ matrix.name }} image
        run: docker run --rm ${{ matrix.tag }}
