name: ci-tests

on:
  push:
    branches: [main, proof-release-*]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/ci/requirements.txt
      - name: Install test dependencies (no browser OS installation)
        run: python -m pip install -c tests/ci/requirements.txt -e ".[test,acp]"
      - name: Validate canonical schemas and IDs before tests
        run: |
          python -m audiagentic.foundation.contracts.validate_schemas
          python -m audiagentic.components.providers.validate_ids
      - name: Critical gateway and changed-component gates
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m tests.ci.run --tier fast --base "$CI_BASE_SHA" --workers 2 --results .ci-results/fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-evidence-${{ github.job }}-${{ inputs.source_ref || github.sha }}
          path: .ci-results
          include-hidden-files: true
          retention-days: 7
