name: rust-production-foundation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'examples/**'
      - 'scripts/rust-foundation-smoke.sh'
      - 'docs/architecture/**'
      - '.github/workflows/rust-production-foundation.yml'

concurrency:
  group: rust-production-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Resolve lockfile for tracing dependency transition
        shell: bash
        run: cargo generate-lockfile
      - name: Validate architecture layers
        shell: bash
        run: bash scripts/rust-foundation-smoke.sh
      - name: Capture resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-production-foundation-lockfile-${{ matrix.os }}
          if-no-files-found: ignore
          path: Cargo.lock
