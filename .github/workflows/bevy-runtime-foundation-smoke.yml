name: Bevy Runtime Foundation Smoke

on:
  pull_request:
    paths:
      - "experiments/bevy-runtime-foundation/**"
      - ".github/workflows/bevy-runtime-foundation-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/bevy-runtime-foundation
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/bevy-runtime-foundation

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build and execute spike
        env:
          RUST_LOG: info
        run: bash scripts/smoke.sh
