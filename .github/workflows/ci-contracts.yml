name: ci-contracts

on:
  push:
  pull_request:

jobs:
  contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema pyyaml
          python -m pip install -e .
      - name: Validate schemas
        run: python -m audiagentic.foundation.contracts.validate_schemas
      - name: Validate canonical ids
        run: python -m audiagentic.components.providers.validate_ids
      - name: Validate packet dependencies
        run: python -m audiagentic.foundation.contracts.validate_packet_dependencies
      - name: Run contract tests
        run: python -m pytest tests/unit/contracts
