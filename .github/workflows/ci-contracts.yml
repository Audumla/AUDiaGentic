name: ci-contracts

on:
  push:
    branches:
      - main
      - proof-release-*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/ci/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c tests/ci/requirements.txt -e ".[test]"
      - name: Validate schemas
        run: python -m audiagentic.foundation.contracts.validate_schemas
      - name: Validate canonical ids
        run: python -m audiagentic.components.providers.validate_ids
      - name: Run contract tests
        run: python -m pytest tests/unit/contracts tests/unit/planning/test_plan_set_integrity.py --durations=20 --junitxml=.ci-results/contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-evidence
          path: .ci-results
          retention-days: 7
