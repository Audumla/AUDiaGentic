name: stage9-rust-lockgen

on:
  push:
    branches:
      - 'stage9/audiacore-application-bootstrap'

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stage9/audiacore-application-bootstrap
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Generate lock
        shell: bash
        run: cargo +1.95.0 generate-lockfile --manifest-path apps/audiagentic-bootstrap/Cargo.toml
      - name: Commit lock
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/audiagentic-bootstrap/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Lock Rust bootstrap dependencies"
          git push origin HEAD:stage9/audiacore-application-bootstrap
