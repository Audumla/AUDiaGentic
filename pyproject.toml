[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiagentic"
version = "0.1.1"
description = "AUDiaGentic: Agentic workflow orchestration and execution platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
# MCP server support for the planning tool surface
mcp = [
    "mcp==1.27.0",
]
# Test dependencies
test = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "mcp==1.27.0",
]
# Full development environment
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "mcp==1.27.0",
    "ruff",
    "mypy",
]

[project.scripts]
# Only the user-facing CLI is a public entry point.
# MCP servers are internal modules invoked via `python -m` within the Pi
# harness session only. They must not appear on PATH or be discoverable
# by other tools.
audiagentic = "audiagentic.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"audiagentic" = [
    # Component descriptors and embedded markdown assets
    "config/components/**/*.yaml",
    "config/components/**/*.md",
    # Package-default configs
    "config/provisioning/harness/*.yaml",
    "config/provisioning/rig/*.yaml",
    # Pi harness home templates
    "runtime/harness/pi/templates/home/agent/**/*.ts",
    "runtime/harness/pi/templates/home/agent/**/*.json",
    "runtime/harness/pi/templates/home/agent/**/*.md",
    # Embedded rig model profiles registry (machine-only, not user config)
    "runtime/rig/embedded/models.json",
    # Release-please provisioning templates
    "components/optional/release/release_please/templates/*.json",
    "components/optional/release/release_please/templates/*.yml",
    "components/optional/providers/workflow/*.yaml",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests/unit", "tests/integration", "tests/e2e", "tests/deferred"]
addopts = "-ra -q --tb=short --strict-markers --strict-config"
timeout = 30
markers = [
    "dev: exercises local filesystem state; not collected in CI/release (run explicitly: pytest tests/dev/)",
    "slow: takes more than 10 seconds; excluded from quick runs (pytest -m 'not slow')",
    "docker: requires Docker daemon; run via make test-docker or pytest -m docker",
    "requires_network: needs outbound internet access",
    "requires_uv: needs uv on PATH",
    "requires_npm: needs npm on PATH",
    "requires_cargo: needs cargo on PATH",
    "opt_in: explicitly opt-in tests; never part of default local runs",
    "mutates_host: may change host-installed tools, PATH state, or global/user config",
    "mutates_project_fs: writes/deletes project files beyond ephemeral temp paths",
    "long_running: expected runtime >60s",
    "flaky_external: depends on unstable external systems/services",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60

[tool.ruff]
src = ["src"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
