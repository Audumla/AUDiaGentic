[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiagentic"
version = "0.78.0"
description = "AUDiaGentic: Agentic workflow orchestration and execution platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "babel>=2.15",
  "dulwich>=0.24,<0.26",
  "pyyaml>=6.0",
  "platformdirs>=4.2",
  "rapidfuzz>=3.0",
  "jsonschema>=4.18",
  "mcp==1.27.0",
  "pydantic>=2.11,<3",
  "tomli-w>=1.0",
  "rich>=15.0.0",
]

[project.optional-dependencies]
# Standards-based streaming agent transport. Kept optional because CLI-stream
# providers remain supported without ACP.
acp = ["agent-client-protocol==0.11.0"]
a2a = ["a2a-sdk==1.1.2"]
# MCP server support for the planning tool surface
mcp = ["mcp==1.27.0", "tomli-w>=1.0"]
# Browser automation for gpt-auto provider
gpt-auto = ["websockets>=13.0"]
# Node transport uses the verified websockets 15 asyncio/proxy/redirect API.
node = ["websockets>=15,<16"]
# Test dependencies
test = [
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.0",
  "playwright>=1.50",
  "psutil>=5.9",
  "mcp==1.27.0",
  "tomli-w>=1.0",
  "pyright>=1.1",
]
# Full development environment
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.0",
  "playwright>=1.50",
  "psutil>=5.9",
  "mcp==1.27.0",
  "tomli-w>=1.0",
  "pyright>=1.1",
  "ruff",
  "mypy",
]

[project.scripts]
# Only the user-facing CLI is a public entry point.
# Component MCP servers use the module route from generated native configuration;
# the public CLI also owns metadata discovery and explicit targeted registration.
audiagentic = "audiagentic.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"audiagentic" = [
  "components/*/contracts/*.json",
  "components/agents/gateway/service/client_icons/*.png",
  # Component descriptors and embedded markdown assets
  "config/components/**/*.yaml",
  "config/components/**/*.md",
  "config/components/**/*.json",
  "config/components/release/.github/workflows/*.yml",
  "config/providers/*.yaml",
  "config/recipes/*.yaml",
  # Package-default configs
  "config/provisioning/foundation/*.yaml",
  # Toolchain action table (read at import time by descriptors)
  "foundation/toolchains/*.yaml",
  # JSON Schemas used for runtime payload validation (ledger, providers, planning)
  "foundation/contracts/schemas/**/*.json",
  # Provider instruction / prompt-tag templates materialized onto surfaces
  "components/providers/adapters/**/*.md",
  "components/providers/adapters/gpt_auto/gpt-auto-defaults.yaml",
  "components/providers/surfaces/templates/*.md",
  # Release-please provisioning templates
  "components/release/release_please/templates/*.json",
  "components/release/release_please/templates/*.yml",
  # Component-local state workflow definitions (states + transitions)
  "components/agent_jobs/*.yaml",
  "components/planning/*.yaml",
  # Agent LLM Gateway workflow definition (loaded at module load time)
  "components/agents/*.yaml",
  # Component contracts read at runtime (job/approval/ledger schemas)
  "components/*/contracts/*.json",
  # Provider adapter package defaults (gpt-auto settings)
  "components/providers/adapters/**/*.yaml",
  # Recipe schema and provisioning fixtures, LSP template, ledger git hook
  "config/recipes/*.json",
  "config/recipes/fixtures/*.yaml",
  "components/coding_lsp/templates/*",
  "components/source_control/*.sh",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = ["src"]
addopts = "-ra -q --tb=short --strict-markers --strict-config --import-mode=importlib -p no:randomly"
timeout = 30
# Parallel execution: -n auto uses all available CPUs.
# Run with: pytest -n auto  (or pytest -n <N> for N workers)
# Safe for e2e because all e2e tests use tmp_path isolation.
# xdist auto-detects CPU count; override with -n 4 etc.
markers = [
  # Tier markers — auto-applied by tests/conftest.py based on directory path
  "unit: pure in-process test; no real I/O, subprocess, or network",
  "integration: real filesystem (tmp_path) or subprocess; no Docker required",
  "e2e: full user-facing path; real CLI, network, or Docker",
  # Speed
  "slow: single test takes >10s; excluded from quick runs (pytest -m 'not slow')",
  # Resource / environment dependencies
    "requires_container: must run inside the disposable Docker test environment",
  "requires_network: needs outbound internet access",
  "requires_uv: needs uv on PATH",
  "requires_npm: needs npm on PATH",
  "requires_cargo: needs cargo on PATH",
  "requires_gh: needs gh CLI on PATH",
  # Behaviour / intent
  "smoke: minimal sanity check; should pass in every environment",
  "opt_in: destructive or expensive; never run by default",
    "mutates_host: installs/removes packages on the test host; implies disposable-container execution",
  # Legacy / extended markers (kept for backward compatibility)
  "docker: legacy alias for requires_container",
  "dev: exercises local filesystem state; not collected in CI (run: pytest tests/dev/)",
  "mutates_project_fs: writes/deletes project files beyond ephemeral temp paths",
  "long_running: expected runtime >60s; pair with @pytest.mark.timeout(N)",
  "flaky_external: depends on unstable external systems or services",
  # Parallel execution
  "no_parallel: test shares a subprocess connection; must run serially",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60

[tool.ruff]
src = ["src"]
target-version = "py310"
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
