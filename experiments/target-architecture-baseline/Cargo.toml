[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/application",
  "crates/artifact",
  "crates/runtime",
  "crates/config",
  "crates/sensitive",
  "crates/template",
  "crates/reconcile",
  "crates/file-store",
  "capabilities/managed-config",
  "examples/demo-capability",
  "examples/demo-app",
  "examples/wasm-app",
]
exclude = ["components/greeting"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
atomic-write-file = "=0.3.0"
figment = { version = "=0.10.19", default-features = false, features = ["env", "json", "toml"] }
regex = "1"
secrecy = "=0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
thiserror = "2"
wasmtime = { version = "=47.0.3", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }
