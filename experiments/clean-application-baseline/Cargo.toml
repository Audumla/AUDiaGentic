[workspace]
resolver = "2"
members = [
  "crates/kernel-core",
  "crates/kernel-manifest",
  "crates/kernel-composition",
  "crates/application",
  "crates/foundation-diagnostics",
  "crates/foundation-sensitive",
  "crates/foundation-template",
  "crates/foundation-reconcile",
  "crates/foundation-config",
  "crates/foundation-file-store",
  "crates/workflow-api",
  "crates/component-probe-api",
  "crates/filesystem-api",
  "crates/filesystem-native",
  "crates/process-api",
  "crates/process-native",
  "crates/secrets-api",
  "crates/secrets-memory",
  "crates/managed-config-api",
  "crates/managed-config-json",
  "crates/runtime-bevy",
  "crates/component-host",
  "crates/mcp-adapter",
  "crates/spike-smoke",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bevy_app = "=0.19.1"
bevy_ecs = "=0.19.1"
cap-std = "=4.0.2"
rmcp = "=3.1.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
